  <text x="533" y="182" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#37474F">kube-proxy</text>
  <text x="533" y="198" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#546E7A">iptables / IPVS 规则</text>

  <text x="745" y="123" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">后端 Pod（EndpointSlice）</text>
  <rect x="680" y="135" width="130" height="30" rx="5" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="745" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">Pod 1</text>
