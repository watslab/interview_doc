<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="mB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1565C0"/></marker>
    <marker id="mP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#7B1FA2"/></marker>
    <marker id="mG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2E7D32"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="610" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 图例 -->
  <line x1="55" y1="58" x2="91" y2="58" stroke="#1565C0" stroke-width="1.5" marker-end="url(#mB)"/>
  <text x="105" y="62" font-size="9.5" fill="#616161">客户端流量（请求 / 连接 VIP）</text>
  <line x1="55" y1="88" x2="91" y2="88" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#mP)"/>
  <text x="105" y="92" font-size="9.5" fill="#616161">DNS 响应 / 服务解析记录</text>

  <!-- 客户端容器 -->
  <rect x="40" y="160" width="225" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="56" y="186" font-size="12.5" font-weight="bold" fill="#1565C0">客户端容器</text>
  <rect x="65" y="210" width="175" height="56" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="152.5" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">应用程序</text>
  <rect x="65" y="298" width="175" height="56" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="152.5" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">DNS 客户端</text>

  <!-- Swarm 内置 DNS -->
  <rect x="340" y="160" width="230" height="240" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="356" y="186" font-size="12.5" font-weight="bold" fill="#6A1B9A">Swarm 内置 DNS</text>
  <rect x="365" y="210" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.2" filter="url(#s1)"/>
  <text x="455" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">DNS 解析器</text>
  <rect x="365" y="298" width="180" height="72" rx="6" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.2" filter="url(#s1)"/>
  <text x="455" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">服务注册表</text>
  <text x="455" y="341" text-anchor="middle" font-size="9.5" fill="#888888">web → 10.0.0.100</text>
  <text x="455" y="355" text-anchor="middle" font-size="9.5" fill="#888888">db → 10.0.0.101</text>

  <!-- db 服务（上） -->
  <rect x="660" y="60" width="270" height="220" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="676" y="86" font-size="12.5" font-weight="bold" fill="#1B5E20">db 服务</text>
  <rect x="690" y="104" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="795" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">VIP</text>
  <text x="795" y="144" text-anchor="middle" font-size="9.5" fill="#666666">10.0.0.101</text>
  <rect x="690" y="198" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="795" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">Task 1</text>
  <text x="795" y="232" text-anchor="middle" font-size="9.5" fill="#666666">10.0.0.4</text>

  <!-- web 服务（下） -->
  <rect x="660" y="360" width="270" height="210" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="676" y="386" font-size="12.5" font-weight="bold" fill="#1B5E20">web 服务</text>
  <rect x="690" y="396" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="795" y="421" text-anchor="middle" font-size="11" font-weight="600" fill="#1B5E20">VIP</text>
  <text x="795" y="436" text-anchor="middle" font-size="9.5" fill="#666666">10.0.0.100</text>
  <rect x="690" y="496" width="97" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="738.5" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">Task 1</text>
  <text x="738.5" y="534" text-anchor="middle" font-size="9.5" fill="#666666">10.0.0.2</text>
  <rect x="803" y="496" width="97" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="851.5" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">Task 2</text>
  <text x="851.5" y="534" text-anchor="middle" font-size="9.5" fill="#666666">10.0.0.3</text>

  <!-- 连接线（最后绘制，保证位于最上层） -->
  <line x1="152.5" y1="267" x2="152.5" y2="297" stroke="#1565C0" stroke-width="1.5" marker-end="url(#mB)"/>
  <text x="164" y="286" font-size="9.5" fill="#1565C0">1. 访问 web 服务</text>

  <line x1="435" y1="267" x2="435" y2="297" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#mP)"/>
  <text x="427" y="286" text-anchor="end" font-size="9.5" fill="#757575">查询</text>
  <line x1="475" y1="297" x2="475" y2="267" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#mP)"/>
  <text x="483" y="286" font-size="9.5" fill="#8E24AA">返回 VIP</text>

  <path d="M241,314 C288,314 312,234 350,234 L364,234" fill="none" stroke="#1565C0" stroke-width="1.5" marker-end="url(#mB)"/>
  <text x="300" y="222" text-anchor="middle" font-size="9.5" fill="#1565C0">2. 查询 web</text>

  <path d="M364,254 C317,254 300,338 253,338 L241,338" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#mP)"/>
  <text x="302" y="354" text-anchor="middle" font-size="9.5" fill="#8E24AA">3. 返回 VIP</text>

  <path d="M546,318 C596,318 610,132 645,132 L689,132" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#mP)"/>
  <text x="614" y="246" font-size="9.5" fill="#8E24AA">解析记录</text>

  <path d="M546,350 C596,350 610,410 645,410 L689,410" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#mP)"/>
  <text x="614" y="342" font-size="9.5" fill="#8E24AA">解析记录</text>

  <path d="M152.5,355 L152.5,434 L689,434" fill="none" stroke="#1565C0" stroke-width="1.5" marker-end="url(#mB)"/>
  <text x="380" y="425" text-anchor="middle" font-size="10" fill="#1565C0">4. 连接 VIP</text>

  <line x1="795" y1="161" x2="795" y2="197" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#mG)"/>
  <text x="808" y="183" font-size="9.5" fill="#757575">负载均衡</text>

  <line x1="738.5" y1="453" x2="738.5" y2="495" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#mG)"/>
  <line x1="851.5" y1="453" x2="851.5" y2="495" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#mG)"/>
  <text x="795" y="478" text-anchor="middle" font-size="9.5" fill="#757575">负载均衡</text>

  <text x="480" y="598" text-anchor="middle" font-size="10.5" fill="#757575">客户端仅需知道服务名；Swarm 内置 DNS 将服务名解析为 VIP，流量再由负载均衡分发到具体 Task 实例</text>
</svg>
