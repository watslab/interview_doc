<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1020" height="480" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H1000 Q1010,20 1010,30 V62 H30 V30 Q30,20 40,20Z" fill="#1E88E5" filter="url(#s1)"/>
  <text x="520" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Seata 分布式事务架构</text>
  <text x="520" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">分支事务向 TC 注册并上报状态，由 TC 决议全局提交或回滚</text>

  <!-- ============ 应用程序 ============ -->
  <rect x="25" y="160" width="130" height="106" rx="8" fill="#F9F4FB" stroke="#E1BEE7" stroke-width="1"/>
  <rect x="35" y="170" width="90" height="22" rx="11" fill="#7B1FA2"/>
  <text x="80" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">应用程序</text>
  <rect x="40" y="204" width="100" height="48" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.8"/>
  <text x="90" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#6A1B9A">主服务</text>

  <!-- ============ Seata ============ -->
  <rect x="205" y="100" width="560" height="330" rx="8" fill="#F4F9FE" stroke="#BBDEFB" stroke-width="1"/>
  <rect x="220" y="110" width="140" height="22" rx="11" fill="#1E88E5"/>
  <text x="290" y="121" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">Seata 分布式事务</text>

  <rect x="225" y="195" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="285" y="214" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="bold" fill="#1565C0">Transaction Manager</text>
  <text x="285" y="234" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务管理器</text>

  <rect x="415" y="185" width="140" height="77" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2.2" filter="url(#s1)"/>
  <text x="485" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="bold" fill="#1565C0">Transaction Coordinator</text>
  <text x="485" y="240" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务协调器</text>

  <rect x="615" y="140" width="130" height="56" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="680" y="160" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="bold" fill="#1565C0">Resource Manager 1</text>
  <text x="680" y="180" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">资源管理器</text>

  <rect x="615" y="290" width="130" height="56" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="680" y="310" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="bold" fill="#1565C0">Resource Manager 2</text>
  <text x="680" y="330" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">资源管理器</text>

  <!-- ============ 数据库 ============ -->
  <rect x="825" y="100" width="190" height="330" rx="8" fill="#F4FAF5" stroke="#C8E6C9" stroke-width="1"/>
  <rect x="840" y="110" width="90" height="22" rx="11" fill="#43A047"/>
  <text x="885" y="121" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">数据库</text>
  <rect x="850" y="140" width="140" height="56" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.8"/>
  <text x="920" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#2E7D32">数据库 1</text>
  <rect x="850" y="290" width="140" height="56" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.8"/>
  <text x="920" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#2E7D32">数据库 2</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M142,228 C180,228 195,223 223,223" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M347,208 L413,208" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M413,238 L349,238" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M557,200 C590,200 588,155 613,155" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M613,181 C588,181 590,225 559,225" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M557,236 C590,236 588,303 613,303" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M613,329 C588,329 590,251 559,251" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M747,168 L848,168" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M747,318 L848,318" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- ============ Step number circles ============ -->
  <circle cx="380" cy="208" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="380" y="208" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">1</text>
  <circle cx="380" cy="238" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="380" y="238" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">4</text>
  <circle cx="588" cy="177" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="588" y="177" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">2</text>
  <circle cx="588" cy="203" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="588" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">3</text>
  <circle cx="588" cy="270" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="588" y="270" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">2</text>
  <circle cx="588" cy="290" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="588" y="290" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">3</text>

  <!-- ============ Legend ============ -->
  <rect x="25" y="448" width="990" height="36" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="57" cy="466" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="57" y="466" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">1</text>
  <text x="72" y="466" text-anchor="start" dominant-baseline="central" font-size="10" fill="#455A64">开启全局事务</text>
  <circle cx="180" cy="466" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="180" y="466" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">2</text>
  <text x="195" y="466" text-anchor="start" dominant-baseline="central" font-size="10" fill="#455A64">注册分支事务</text>
  <circle cx="310" cy="466" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="310" y="466" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">3</text>
  <text x="325" y="466" text-anchor="start" dominant-baseline="central" font-size="10" fill="#455A64">上报分支事务状态</text>
  <circle cx="460" cy="466" r="9" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="460" y="466" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0">4</text>
  <text x="475" y="466" text-anchor="start" dominant-baseline="central" font-size="10" fill="#455A64">决议全局提交或回滚</text>
</svg>
