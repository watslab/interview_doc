<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahv" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#7B1FA2"/></marker>
    <marker id="ahvr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6Z" fill="#7B1FA2"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="620" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 宿主机 1 -->
  <rect x="60" y="60" width="390" height="400" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="90" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#1565C0">宿主机 1</text>

  <!-- 容器 A -->
  <rect x="125" y="106" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="140" y="130" text-anchor="start" font-size="11" font-weight="600" fill="#1565C0">容器 A</text>
  <rect x="155" y="144" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="158.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">eth0</text>
  <text x="255" y="170" text-anchor="middle" font-size="10" fill="#666666">10.0.0.2</text>

  <!-- br-xxx 网桥 -->
  <rect x="125" y="238" width="260" height="44" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="257.3" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">br-xxx 网桥</text>
  <text x="255" y="271.8" text-anchor="middle" font-size="10" fill="#C62828">Overlay 网络的接入网桥</text>

  <!-- vxlan0 -->
  <rect x="125" y="318" width="260" height="48" rx="8" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="255" y="339.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4527A0">vxlan0 接口</text>
  <text x="255" y="354" text-anchor="middle" font-size="10" fill="#7B1FA2">VXLAN 隧道端点（VTEP）</text>

  <!-- 宿主机 eth0 -->
  <rect x="145" y="402" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="420.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">eth0</text>
  <text x="255" y="432" text-anchor="middle" font-size="10" fill="#666666">192.168.1.10</text>

  <!-- 宿主机 2 -->
  <rect x="510" y="60" width="390" height="400" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="540" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#1B5E20">宿主机 2</text>

  <!-- 容器 B -->
  <rect x="575" y="106" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="590" y="130" text-anchor="start" font-size="11" font-weight="600" fill="#1B5E20">容器 B</text>
  <rect x="605" y="144" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="705" y="158.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">eth0</text>
  <text x="705" y="170" text-anchor="middle" font-size="10" fill="#666666">10.0.0.3</text>

  <!-- br-yyy 网桥 -->
  <rect x="575" y="238" width="260" height="44" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="705" y="257.3" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">br-yyy 网桥</text>
  <text x="705" y="271.8" text-anchor="middle" font-size="10" fill="#C62828">Overlay 网络的接入网桥</text>

  <!-- vxlan0 -->
  <rect x="575" y="318" width="260" height="48" rx="8" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="705" y="339.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4527A0">vxlan0 接口</text>
  <text x="705" y="354" text-anchor="middle" font-size="10" fill="#7B1FA2">VXLAN 隧道端点（VTEP）</text>

  <!-- 宿主机 eth0 -->
  <rect x="595" y="402" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="705" y="420.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">eth0</text>
  <text x="705" y="432" text-anchor="middle" font-size="10" fill="#666666">192.168.1.11</text>

  <!-- 底层物理网络 -->
  <rect x="150" y="500" width="660" height="64" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="536.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E65100">底层物理网络（物理交换机 / 路由器）</text>

  <!-- 连接箭头（最后绘制，保证在最上层） -->
  <line x1="247" y1="178" x2="247" y2="237" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="263" y1="237" x2="263" y2="177" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="271" y="211" text-anchor="start" font-size="10" fill="#757575">veth pair</text>
  <line x1="697" y1="178" x2="697" y2="237" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="713" y1="237" x2="713" y2="177" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="721" y="211" text-anchor="start" font-size="10" fill="#757575">veth pair</text>

  <line x1="255" y1="284" x2="255" y2="317" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="267" y="304" text-anchor="start" font-size="10" fill="#757575">挂载</text>
  <line x1="705" y1="284" x2="705" y2="317" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="717" y="304" text-anchor="start" font-size="10" fill="#757575">挂载</text>

  <line x1="255" y1="368" x2="255" y2="401" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="267" y="388" text-anchor="start" font-size="10" fill="#757575">VXLAN 报文</text>
  <line x1="705" y1="368" x2="705" y2="401" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="717" y="388" text-anchor="start" font-size="10" fill="#757575">VXLAN 报文</text>

  <line x1="387" y1="342" x2="573" y2="342" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="8,5" marker-start="url(#ahvr)" marker-end="url(#ahv)"/>
  <text x="480" y="334" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6A1B9A">VXLAN 隧道（UDP 4789）</text>

  <line x1="255" y1="444" x2="255" y2="499" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="705" y1="444" x2="705" y2="499" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="480" y="601" text-anchor="middle" font-size="10.5" fill="#757575">Overlay 网络底层基于网桥接入容器流量，经 vxlan0 封装为 VXLAN 报文，以宿主机 IP 经物理网络传输，由对端 VTEP 解封装后交付目标容器</text>
</svg>
