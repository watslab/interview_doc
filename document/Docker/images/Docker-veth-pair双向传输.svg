<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EF6C00"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="300" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- veth pair 容器 -->
  <rect x="100" y="60" width="760" height="200" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#E65100">veth pair（虚拟网线）</text>

  <!-- 端点 A -->
  <rect x="150" y="126" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">veth 端点 A</text>

  <!-- 端点 B -->
  <rect x="590" y="126" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="700" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">veth 端点 B</text>

  <!-- 双向数据包传输 -->
  <line x1="370" y1="140" x2="590" y2="140" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="590" y1="184" x2="370" y2="184" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="480" y="166" text-anchor="middle" font-size="10.5" fill="#757575">数据包双向传输</text>

  <!-- 底部说明 -->
  <text x="480" y="287" text-anchor="middle" font-size="10.5" fill="#757575">从任一端进入的数据包会立即从另一端发出，反之亦然</text>
</svg>
