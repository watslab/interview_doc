<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#546E7A"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#43A047"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="580" height="560" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#37474F">TLS 1.2 握手流程（2-RTT）</text>

  <!-- Client header -->
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="140" height="35" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="110" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">Client</text>
    <text x="110" y="78" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#666">客户端</text>
  </g>

  <!-- Server header -->
  <g filter="url(#shadow)">
    <rect x="420" y="50" width="140" height="35" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
    <text x="490" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E65100">Server</text>
    <text x="490" y="78" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#666">服务器</text>
  </g>

  <!-- Lifelines (dashed) -->
  <line x1="110" y1="85" x2="110" y2="555" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="490" y1="85" x2="490" y2="555" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- RTT 1 region label (left side) -->
  <rect x="15" y="95" width="18" height="195" rx="3" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="24" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#1565C0" transform="rotate(-90 24 192)">1-RTT</text>

  <!-- RTT 2 region label (left side) -->
  <rect x="15" y="315" width="18" height="230" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="24" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#E65100" transform="rotate(-90 24 430)">2-RTT</text>

  <!-- RTT divider (dashed horizontal) -->
  <line x1="40" y1="300" x2="580" y2="300" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="575" y="293" text-anchor="end" dominant-baseline="central" font-size="9" fill="#757575" font-style="italic">RTT 分界</text>

  <!-- ============ Messages (drawn last for z-order) ============ -->

  <!-- Msg 1: ClientHello (Client -> Server) -->
  <line x1="110" y1="110" x2="490" y2="110" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">1. ClientHello</text>
  <text x="300" y="123" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">版本 + 密码套件 + 随机数</text>

  <!-- Msg 2: ServerHello (Server -> Client) -->
  <line x1="490" y1="150" x2="110" y2="150" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">2. ServerHello</text>
  <text x="300" y="163" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">选定套件 + 随机数</text>

  <!-- Msg 3: Certificate (Server -> Client) -->
  <line x1="490" y1="190" x2="110" y2="190" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="180" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">3. Certificate</text>
  <text x="300" y="203" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">服务器证书链</text>

  <!-- Msg 4: ServerKeyExchange (Server -> Client) -->
  <line x1="490" y1="230" x2="110" y2="230" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">4. ServerKeyExchange</text>
  <text x="300" y="243" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">DH 参数 + 签名</text>

  <!-- Msg 5: ServerHelloDone (Server -> Client) -->
  <line x1="490" y1="270" x2="110" y2="270" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="260" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">5. ServerHelloDone</text>
  <text x="300" y="283" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">服务器握手结束</text>

  <!-- Msg 6: ClientKeyExchange (Client -> Server) -->
  <line x1="110" y1="330" x2="490" y2="330" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">6. ClientKeyExchange</text>
  <text x="300" y="343" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">预主密钥（公钥加密）</text>

  <!-- Msg 7: ChangeCipherSpec (Client -> Server) -->
  <line x1="110" y1="370" x2="490" y2="370" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="360" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">7. ChangeCipherSpec</text>
  <text x="300" y="383" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">通知启用协商参数</text>

  <!-- Msg 8: Finished (Client -> Server) - encrypted -->
  <line x1="110" y1="410" x2="490" y2="410" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">8. Finished（加密）</text>
  <text x="300" y="423" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">握手摘要验证</text>

  <!-- Annotation: client starts encrypted communication -->
  <g filter="url(#shadow)">
    <rect x="60" y="430" width="100" height="22" rx="11" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
    <text x="110" y="441" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="bold" fill="#2E7D32">开始加密通信</text>
  </g>

  <!-- Msg 9: ChangeCipherSpec (Server -> Client) -->
  <line x1="490" y1="465" x2="110" y2="465" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="455" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#333">9. ChangeCipherSpec</text>
  <text x="300" y="478" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">通知启用协商参数</text>

  <!-- Msg 10: Finished (Server -> Client) - encrypted -->
  <line x1="490" y1="500" x2="110" y2="500" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="490" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">10. Finished（加密）</text>
  <text x="300" y="513" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">握手摘要验证</text>

  <!-- Annotation: server starts encrypted communication -->
  <g filter="url(#shadow)">
    <rect x="440" y="520" width="100" height="22" rx="11" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
    <text x="490" y="531" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="bold" fill="#2E7D32">开始加密通信</text>
  </g>

</svg>
