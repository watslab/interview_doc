<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#607D8B"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="580" height="410" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#37474F">TLS 记录与报文封装</text>

  <!-- ============ Panel A: TLS record structure ============ -->
  <text x="40" y="62" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">TLS 记录（Record）结构</text>

  <!-- Field bar -->
  <g filter="url(#shadow)">
    <rect x="40" y="75" width="70" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <rect x="110" y="75" width="90" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <rect x="200" y="75" width="90" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <rect x="290" y="75" width="270" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  </g>
  <text x="75" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">内容类型</text>
  <text x="75" y="108" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">1 字节</text>
  <text x="155" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">版本</text>
  <text x="155" y="108" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">2 字节</text>
  <text x="245" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">长度</text>
  <text x="245" y="108" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">2 字节</text>
  <text x="425" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2E7D32">载荷（分片 + 加密 + 认证标签）</text>
  <text x="425" y="108" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">≤ 16384 字节</text>

  <!-- Content type legend chips -->
  <text x="40" y="143" text-anchor="start" dominant-baseline="central" font-size="10" fill="#757575">内容类型取值：</text>
  <rect x="115" y="132" width="130" height="20" rx="10" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="180" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#455A64">20 ChangeCipherSpec</text>
  <rect x="253" y="132" width="64" height="20" rx="10" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="285" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#455A64">21 Alert</text>
  <rect x="325" y="132" width="88" height="20" rx="10" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="369" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#455A64">22 Handshake</text>
  <rect x="421" y="132" width="135" height="20" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="488" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#1565C0">23 Application Data</text>

  <!-- ============ Panel B: encapsulation pipeline ============ -->
  <text x="40" y="182" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">封装链路：一次 HTTPS 请求</text>

  <!-- Layer headers -->
  <text x="110" y="205" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">应用层（HTTP）</text>
  <text x="300" y="205" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">TLS 层</text>
  <text x="490" y="205" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">传输层（TCP）</text>

  <!-- Col 1: HTTP message -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="140" height="100" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  </g>
  <text x="110" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">HTTP 报文</text>
  <text x="110" y="272" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">作为 TLS 应用数据</text>
  <text x="110" y="290" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">消息边界由 HTTP 自声明</text>

  <!-- Arrow 1 -->
  <line x1="185" y1="270" x2="226" y2="270" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="205" y="258" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">分片 + 加密</text>

  <!-- Col 2: TLS records -->
  <g filter="url(#shadow)">
    <rect x="230" y="222" width="140" height="26" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
    <rect x="230" y="254" width="140" height="26" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
    <rect x="230" y="286" width="140" height="26" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  </g>
  <text x="300" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#2E7D32">TLS 记录 1</text>
  <text x="300" y="267" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#2E7D32">TLS 记录 2</text>
  <text x="300" y="299" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#2E7D32">TLS 记录 3</text>
  <text x="300" y="330" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">每条 ≤ 16384 字节</text>

  <!-- Arrow 2 -->
  <line x1="375" y1="270" x2="416" y2="270" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="395" y="258" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">字节流交付</text>

  <!-- Col 3: TCP segments -->
  <g filter="url(#shadow)">
    <rect x="420" y="222" width="140" height="26" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <rect x="420" y="254" width="140" height="26" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <rect x="420" y="286" width="140" height="26" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  </g>
  <text x="490" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#37474F">TCP 报文段 1</text>
  <text x="490" y="267" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#37474F">TCP 报文段 2</text>
  <text x="490" y="299" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#37474F">TCP 报文段 3</text>
  <text x="490" y="330" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#757575">按 MSS 独立切分</text>

  <!-- Bottom notes -->
  <text x="300" y="365" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">握手消息（22）与告警消息（21）同样以记录承载，本图以应用数据（23）为例</text>
  <text x="300" y="385" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">TCP 只见字节流：TCP 分段边界与 TLS 记录边界互不感知</text>

</svg>
