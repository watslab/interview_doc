<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#78909C"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#C62828"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="410" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#C62828" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">跨线程事务失效原因</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">事务上下文经 ThreadLocal 绑定于主线程，子线程无法访问</text>

  <!-- ============ 主线程 ============ -->
  <rect x="80" y="100" width="330" height="270" rx="8" fill="#F5F7F8" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="100" y="110" width="90" height="24" rx="12" fill="#546E7A"/>
  <text x="145" y="122" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">主线程</text>

  <rect x="105" y="150" width="280" height="190" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="245" y="168" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">ThreadLocal · 线程隔离存储</text>

  <rect x="125" y="186" width="240" height="36" rx="5" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="245" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">数据库连接 Connection</text>
  <rect x="125" y="230" width="240" height="36" rx="5" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="245" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">事务状态 TransactionStatus</text>
  <rect x="125" y="274" width="240" height="36" rx="5" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="245" y="292" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#37474F">事务同步器 TransactionSynchronization</text>

  <!-- ============ 子线程 ============ -->
  <rect x="660" y="130" width="210" height="76" rx="8" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="765" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#546E7A">子线程 1</text>
  <text x="765" y="182" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#90A4AE">无事务上下文</text>

  <rect x="660" y="264" width="210" height="76" rx="8" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="765" y="292" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#546E7A">子线程 2</text>
  <text x="765" y="316" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#90A4AE">无事务上下文</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M412,190 C510,190 560,168 656,168" stroke="#78909C" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M412,280 C510,280 560,302 656,302" stroke="#78909C" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M656,192 C540,196 460,214 372,214" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ahr)"/>
  <path d="M656,290 C540,294 460,304 372,304" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ahr)"/>

  <!-- ============ Block marks ============ -->
  <circle cx="503" cy="204" r="9" fill="#FFFFFF"/>
  <path d="M497.5,198.5 L508.5,209.5 M497.5,209.5 L508.5,198.5" stroke="#C62828" stroke-width="2.2"/>
  <circle cx="503" cy="299" r="9" fill="#FFFFFF"/>
  <path d="M497.5,293.5 L508.5,304.5 M497.5,304.5 L508.5,293.5" stroke="#C62828" stroke-width="2.2"/>

  <!-- ============ Annotations ============ -->
  <text x="534" y="174" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">创建</text>
  <text x="534" y="276" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">创建</text>
  <text x="503" y="224" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#C62828">无法访问</text>
  <text x="503" y="319" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#C62828">无法访问</text>
  <text x="480" y="398" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">TransactionSynchronizationManager 将事务上下文绑定到当前线程，线程间无法共享</text>
</svg>
