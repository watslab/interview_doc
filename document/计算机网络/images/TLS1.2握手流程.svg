<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#607D8B"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="580" height="600" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title + 2-RTT badge (header unit, centered as a group) -->
  <text x="255" y="30" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#37474F">TLS 1.2 握手流程</text>
  <rect x="320" y="19" width="80" height="22" rx="11" fill="#1E88E5"/>
  <text x="360" y="30" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFF">2-RTT</text>

  <!-- Client header (blue, fully rounded) -->
  <rect x="40" y="42" width="140" height="33" rx="8" fill="#1E88E5" filter="url(#shadow)"/>
  <text x="110" y="59" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFF">Client</text>

  <!-- Server header (purple, fully rounded) -->
  <rect x="420" y="42" width="140" height="33" rx="8" fill="#7B1FA2" filter="url(#shadow)"/>
  <text x="490" y="59" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFF">Server</text>

  <!-- Lifelines (solid, light) -->
  <line x1="110" y1="75" x2="110" y2="560" stroke="#CFD8DC" stroke-width="2"/>
  <line x1="490" y1="75" x2="490" y2="560" stroke="#CFD8DC" stroke-width="2"/>

  <!-- Encrypted region (from client Finished onward) -->
  <rect x="30" y="404" width="540" height="151" rx="6" fill="#E8F5E9" opacity="0.5"/>

  <!-- RTT dividers -->
  <line x1="30" y1="302" x2="570" y2="302" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="575" y="295" text-anchor="end" font-size="9" fill="#757575" font-style="italic">RTT 1 结束</text>
  <line x1="30" y1="530" x2="570" y2="530" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="575" y="523" text-anchor="end" font-size="9" fill="#757575" font-style="italic">RTT 2 结束</text>
  <text x="575" y="415" text-anchor="end" font-size="9" font-weight="bold" fill="#43A047">加密阶段（协商密钥已生效）</text>

  <!-- Step labels: number + name + description on the same row -->
  <text x="285" y="99" text-anchor="end" font-size="11" font-weight="600" fill="#333">1. ClientHello</text>
  <text x="315" y="99" text-anchor="start" font-size="9" fill="#757575">最高支持版本 + 密码套件列表 + 随机数</text>

  <text x="285" y="141" text-anchor="end" font-size="11" font-weight="600" fill="#333">2. ServerHello</text>
  <text x="315" y="141" text-anchor="start" font-size="9" fill="#757575">选定版本与套件 + 随机数</text>

  <text x="285" y="183" text-anchor="end" font-size="11" font-weight="600" fill="#333">3. Certificate</text>
  <text x="315" y="183" text-anchor="start" font-size="9" fill="#757575">服务器证书链</text>

  <text x="285" y="225" text-anchor="end" font-size="11" font-weight="600" fill="#333">4. ServerKeyExchange</text>
  <text x="315" y="225" text-anchor="start" font-size="9" fill="#757575">DHE/ECDHE 参数与签名</text>

  <text x="285" y="267" text-anchor="end" font-size="11" font-weight="600" fill="#333">5. ServerHelloDone</text>
  <text x="315" y="267" text-anchor="start" font-size="9" fill="#757575">服务器响应结束</text>

  <text x="285" y="329" text-anchor="end" font-size="11" font-weight="600" fill="#333">6. ClientKeyExchange</text>
  <text x="315" y="329" text-anchor="start" font-size="9" fill="#757575">RSA 预主密钥或 DHE/ECDHE 公钥</text>

  <text x="285" y="371" text-anchor="end" font-size="11" font-weight="600" fill="#333">7. ChangeCipherSpec</text>
  <text x="315" y="371" text-anchor="start" font-size="9" fill="#757575">通知：后续记录改用协商密钥保护</text>

  <text x="285" y="413" text-anchor="end" font-size="11" font-weight="600" fill="#2E7D32">8. Finished</text>
  <text x="315" y="413" text-anchor="start" font-size="9" fill="#757575">校验全部握手消息的完整性</text>

  <text x="285" y="455" text-anchor="end" font-size="11" font-weight="600" fill="#333">9. ChangeCipherSpec</text>
  <text x="315" y="455" text-anchor="start" font-size="9" fill="#757575">服务器侧同步骤 7</text>

  <text x="285" y="497" text-anchor="end" font-size="11" font-weight="600" fill="#2E7D32">10. Finished</text>
  <text x="315" y="497" text-anchor="start" font-size="9" fill="#757575">服务器侧同步骤 8</text>

  <!-- Arrow lines (drawn LAST for correct z-order) -->
  <line x1="112" y1="110" x2="488" y2="110" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="488" y1="152" x2="112" y2="152" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="488" y1="194" x2="112" y2="194" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="488" y1="236" x2="112" y2="236" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="488" y1="278" x2="112" y2="278" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="112" y1="340" x2="488" y2="340" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="112" y1="382" x2="488" y2="382" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="112" y1="424" x2="488" y2="424" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="488" y1="466" x2="112" y2="466" stroke="#607D8B" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="488" y1="508" x2="112" y2="508" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Completion bar -->
  <rect x="80" y="565" width="440" height="30" rx="6" fill="#43A047" filter="url(#shadow)"/>
  <text x="300" y="580" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFF">握手完成，开始加密通信</text>

</svg>
