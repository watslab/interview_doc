<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="aho" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#F57C00"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1180" height="740" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="600" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">标准 I/O 流重定向与管道机制</text>

  <!-- ===== LEFT: Process panel (blue) ===== -->
  <rect x="50" y="70" width="260" height="350" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M60,70 H300 Q310,70 310,80 V106 H50 V80 Q50,70 60,70Z" fill="#1E88E5"/>
  <text x="180" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">进程 Process</text>

  <!-- FD0 stdin -->
  <rect x="80" y="130" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="96" y="156" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">FD 0 · stdin</text>
  <text x="96" y="178" text-anchor="start" dominant-baseline="central" font-size="11" fill="#757575">← 从外部读入数据</text>
  <!-- FD1 stdout -->
  <rect x="80" y="212" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="96" y="238" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">FD 1 · stdout</text>
  <text x="96" y="260" text-anchor="start" dominant-baseline="central" font-size="11" fill="#757575">→ 正常输出</text>
  <!-- FD2 stderr -->
  <rect x="80" y="294" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="96" y="320" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">FD 2 · stderr</text>
  <text x="96" y="342" text-anchor="start" dominant-baseline="central" font-size="11" fill="#757575">→ 错误输出</text>

  <!-- ===== MIDDLE: Operators panel (orange) ===== -->
  <rect x="380" y="70" width="400" height="350" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M390,70 H770 Q780,70 780,80 V106 H380 V80 Q380,70 390,70Z" fill="#F57C00"/>
  <text x="580" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">重定向操作符 Operator</text>

  <!-- operator rows: y tops 124,174,224,274,324,374 ; chip h=40 -->
  <g>
    <rect x="400" y="124" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="144" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">&gt;</text>
    <text x="505" y="144" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">覆盖写入文件（stdout）</text>

    <rect x="400" y="174" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="194" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">&gt;&gt;</text>
    <text x="505" y="194" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">追加写入文件（stdout）</text>

    <rect x="400" y="224" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="244" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">&lt;</text>
    <text x="505" y="244" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">从文件读入 stdin</text>

    <rect x="400" y="274" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="294" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">2&gt;</text>
    <text x="505" y="294" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">重定向 stderr 到文件</text>

    <rect x="400" y="324" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">2&gt;&amp;1</text>
    <text x="505" y="344" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">stderr 合并到 stdout</text>

    <rect x="400" y="374" width="90" height="40" rx="6" fill="#F57C00"/><text x="445" y="394" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#FFFFFF" font-family="Consolas,monospace">|</text>
    <text x="505" y="394" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5D4037">管道：stdout → 下游 stdin</text>
  </g>

  <!-- ===== RIGHT: Targets panel (green) ===== -->
  <rect x="850" y="70" width="300" height="350" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M860,70 H1140 Q1150,70 1150,80 V106 H850 V80 Q850,70 860,70Z" fill="#43A047"/>
  <text x="1000" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">目标 Target</text>

  <!-- target cards: tops 130,202,274,346 ; h=60 -->
  <g>
    <rect x="870" y="130" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1"/>
    <text x="890" y="154" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">文件 file.out</text>
    <text x="890" y="176" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">普通文件，持久存储</text>

    <rect x="870" y="202" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1"/>
    <text x="890" y="226" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">终端 /dev/tty</text>
    <text x="890" y="248" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">默认输出到屏幕</text>

    <rect x="870" y="274" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1"/>
    <text x="890" y="298" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">/dev/null</text>
    <text x="890" y="320" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">黑洞设备，丢弃数据</text>

    <rect x="870" y="346" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1"/>
    <text x="890" y="370" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">另一进程 stdin</text>
    <text x="890" y="392" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">经管道流入下游进程</text>
  </g>

  <!-- ===== Flow arrows between top columns (drawn last) ===== -->
  <line x1="312" y1="245" x2="376" y2="245" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="344" y="236" text-anchor="middle" font-size="10" fill="#757575">操作符</text>
  <line x1="782" y1="245" x2="846" y2="245" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="814" y="236" text-anchor="middle" font-size="10" fill="#757575">重定向到</text>

  <!-- ===== BOTTOM: Pipe example ===== -->
  <text x="600" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474F">管道示例：cmd1 | cmd2 | cmd3（stdout 依次接入下游 stdin）</text>

  <!-- cmd1 -->
  <rect x="110" y="510" width="210" height="120" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M120,510 H310 Q320,510 320,520 V544 H110 V520 Q110,510 120,510Z" fill="#1E88E5"/>
  <text x="215" y="527" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">cmd1</text>
  <text x="215" y="578" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">FD 1 · stdout</text>
  <text x="215" y="602" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#757575">正常输出 →</text>

  <!-- cmd2 -->
  <rect x="495" y="510" width="210" height="120" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M505,510 H695 Q705,510 705,520 V544 H495 V520 Q495,510 505,510Z" fill="#1E88E5"/>
  <text x="600" y="527" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">cmd2</text>
  <text x="600" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">← FD 0 stdin</text>
  <text x="600" y="600" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">FD 1 stdout →</text>

  <!-- cmd3 -->
  <rect x="880" y="510" width="210" height="120" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M890,510 H1080 Q1090,510 1090,520 V544 H880 V520 Q880,510 890,510Z" fill="#1E88E5"/>
  <text x="985" y="527" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">cmd3</text>
  <text x="985" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">← FD 0 stdin</text>
  <text x="985" y="600" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">FD 1 stdout →</text>

  <!-- stdin input into cmd1 -->
  <line x1="74" y1="570" x2="108" y2="570" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="91" y="560" text-anchor="middle" font-size="10" fill="#757575">stdin</text>

  <!-- pipe1 arrow -->
  <line x1="322" y1="570" x2="491" y2="570" stroke="#F57C00" stroke-width="2" marker-end="url(#aho)"/>
  <text x="406" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#F57C00" font-family="Consolas,monospace">|</text>
  <text x="406" y="588" text-anchor="middle" font-size="10" fill="#757575">stdout → stdin</text>

  <!-- pipe2 arrow -->
  <line x1="707" y1="570" x2="876" y2="570" stroke="#F57C00" stroke-width="2" marker-end="url(#aho)"/>
  <text x="791" y="558" text-anchor="middle" font-size="13" font-weight="bold" fill="#F57C00" font-family="Consolas,monospace">|</text>
  <text x="791" y="588" text-anchor="middle" font-size="10" fill="#757575">stdout → stdin</text>

  <!-- final output to terminal -->
  <line x1="1092" y1="570" x2="1156" y2="570" stroke="#43A047" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1124" y="560" text-anchor="middle" font-size="10" fill="#1B5E20">→ 终端</text>

  <!-- bottom note -->
  <text x="600" y="690" text-anchor="middle" font-size="12" fill="#546E7A" font-style="italic">管道符 | 将左侧进程的 stdout 连接到右侧进程的 stdin，形成单向数据流；每个进程仍保留独立的 stderr</text>
</svg>
