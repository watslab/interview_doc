<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="980" height="330" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 阶段1：构建阶段 -->
  <rect x="60" y="50" width="400" height="250" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="75" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#0D47A1">阶段1：构建阶段</text>
  <rect x="85" y="98" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="260" y="121.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">FROM golang:1.21 AS builder</text>
  <rect x="85" y="166" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="260" y="189.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">COPY . .</text>
  <rect x="85" y="234" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="260" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">RUN go build</text>

  <!-- 阶段2：运行阶段 -->
  <rect x="540" y="50" width="400" height="250" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="555" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#1B5E20">阶段2：运行阶段</text>
  <rect x="565" y="98" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="740" y="121.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">FROM alpine:3.19</text>
  <rect x="565" y="166" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="740" y="189.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">COPY --from=builder /app/myapp .</text>
  <rect x="565" y="234" width="350" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="740" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">CMD ['./myapp']</text>

  <!-- 阶段间连接 -->
  <line x1="461" y1="175" x2="539" y2="175" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="500" y="162" text-anchor="middle" font-size="10" fill="#757575">只复制编译产物</text>
</svg>
