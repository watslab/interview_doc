<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 574" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <rect x="10" y="10" width="900" height="554" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 宿主机框 -->
  <rect x="60" y="40" width="800" height="494" rx="10" fill="#FFFFFF" stroke="#546E7A" stroke-width="2" filter="url(#s1)"/>
  <text x="84" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#37474F">宿主机（Host）</text>

  <!-- 容器层 -->
  <rect x="92" y="92" width="736" height="132" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="108" y="116" text-anchor="start" font-size="11" font-weight="bold" fill="#2E7D32">容器层</text>
  <rect x="108" y="126" width="224" height="82" rx="6" fill="#FFFFFF" stroke="#81C784" stroke-width="1.2" filter="url(#s1)"/>
  <text x="220" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">容器 1</text>
  <text x="220" y="186" text-anchor="middle" font-size="10" fill="#888888">App | Libs</text>
  <rect x="348" y="126" width="224" height="82" rx="6" fill="#FFFFFF" stroke="#81C784" stroke-width="1.2" filter="url(#s1)"/>
  <text x="460" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">容器 2</text>
  <text x="460" y="186" text-anchor="middle" font-size="10" fill="#888888">App | Libs</text>
  <rect x="588" y="126" width="224" height="82" rx="6" fill="#FFFFFF" stroke="#81C784" stroke-width="1.2" filter="url(#s1)"/>
  <text x="700" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">容器 3</text>
  <text x="700" y="186" text-anchor="middle" font-size="10" fill="#888888">App | Libs</text>

  <!-- Docker Engine 层 -->
  <rect x="92" y="254" width="736" height="90" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2"/>
  <text x="108" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#1565C0">Docker Engine</text>
  <rect x="150" y="292" width="290" height="38" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="295" y="316" text-anchor="middle" font-size="11.5" fill="#333333">dockerd 守护进程</text>
  <rect x="480" y="292" width="290" height="38" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="625" y="316" text-anchor="middle" font-size="11.5" fill="#333333">docker CLI 客户端</text>

  <!-- 操作系统层 -->
  <rect x="92" y="374" width="736" height="60" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2"/>
  <text x="108" y="398" text-anchor="start" font-size="11" font-weight="bold" fill="#EF6C00">操作系统</text>
  <text x="460" y="418" text-anchor="middle" font-size="12" fill="#333333">Linux Kernel（提供 Namespace 与 Cgroups 支持）</text>

  <!-- 硬件层 -->
  <rect x="92" y="464" width="736" height="40" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2"/>
  <text x="460" y="489" text-anchor="middle" font-size="12" fill="#333333">硬件层 —— CPU | 内存 | 磁盘 | 网卡</text>
</svg>
