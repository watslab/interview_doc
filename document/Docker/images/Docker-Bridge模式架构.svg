<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 686" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="666" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 外部网络 -->
  <rect x="370" y="30" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">外部网络</text>

  <!-- 宿主机网络命名空间 -->
  <rect x="60" y="108" width="840" height="326" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="90" y="138" text-anchor="start" font-size="13" font-weight="bold" fill="#1565C0">宿主机网络命名空间</text>

  <rect x="370" y="136" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">eth0</text>
  <text x="480" y="166" text-anchor="middle" font-size="10" fill="#666666">192.168.1.100</text>

  <rect x="370" y="216" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">iptables NAT</text>

  <rect x="250" y="296" width="460" height="44" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">docker0 网桥</text>
  <text x="480" y="328" text-anchor="middle" font-size="10" fill="#C62828">172.17.0.1</text>

  <rect x="200" y="380" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="265" y="398" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333333">vethxxx</text>
  <rect x="630" y="380" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="695" y="398" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333333">vethyyy</text>

  <!-- 容器 1 网络命名空间 -->
  <rect x="100" y="470" width="330" height="160" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="115" y="496" text-anchor="start" font-size="11" font-weight="600" fill="#1B5E20">容器 1 网络命名空间</text>
  <rect x="165" y="514" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="265" y="530" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">eth0</text>
  <text x="265" y="540" text-anchor="middle" font-size="10" fill="#666666">172.17.0.2</text>
  <rect x="165" y="582" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="265" y="602" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">应用进程</text>

  <!-- 容器 2 网络命名空间 -->
  <rect x="530" y="470" width="330" height="160" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="545" y="496" text-anchor="start" font-size="11" font-weight="600" fill="#E65100">容器 2 网络命名空间</text>
  <rect x="595" y="514" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="695" y="530" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">eth0</text>
  <text x="695" y="540" text-anchor="middle" font-size="10" fill="#666666">172.17.0.3</text>
  <rect x="595" y="582" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="695" y="602" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">应用进程</text>

  <!-- 连接箭头（最后绘制，保证在最上层；出站流量统一向上） -->
  <line x1="480" y1="135" x2="480" y2="75" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="215" x2="480" y2="177" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="295" x2="480" y2="257" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="265" y1="341" x2="265" y2="379" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="695" y1="341" x2="695" y2="379" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="279" y="364" font-size="10" fill="#757575">挂载</text>
  <text x="709" y="364" font-size="10" fill="#757575">挂载</text>
  <line x1="257" y1="513" x2="257" y2="409" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="273" y1="409" x2="273" y2="513" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="687" y1="513" x2="687" y2="409" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="703" y1="409" x2="703" y2="513" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="265" y1="581" x2="265" y2="549" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="695" y1="581" x2="695" y2="549" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="295" y="456" text-anchor="start" font-size="10" fill="#757575">veth pair</text>
  <text x="723" y="456" text-anchor="start" font-size="10" fill="#757575">veth pair</text>

  <!-- 底部说明 -->
  <text x="480" y="657" text-anchor="middle" font-size="10.5" fill="#757575">容器出站流量经 veth pair 汇聚到 docker0，由 iptables NAT 转换源地址后经宿主机 eth0 访问外部网络</text>
</svg>
