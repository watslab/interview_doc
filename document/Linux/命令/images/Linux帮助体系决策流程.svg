<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
    <marker id="ahgd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#7CB342"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1180" height="830" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="600" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">Linux 帮助体系决策流程</text>

  <!-- ===== Start oval ===== -->
  <rect x="480" y="60" width="240" height="50" rx="25" fill="#43A047" filter="url(#s1)"/>
  <text x="600" y="85" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">需要查询命令帮助？</text>

  <!-- ===== Decision 1: 是内建命令？ ===== -->
  <polygon points="600,155 710,210 600,265 490,210" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="600" y="210" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">是内建命令？</text>

  <!-- help rect (是 branch, left) -->
  <rect x="150" y="180" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="250" y="202" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20" font-family="Consolas,monospace">help / help -d</text>
  <text x="250" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">内建命令帮助</text>

  <!-- ===== Decision 2: 需要完整手册？ ===== -->
  <polygon points="600,325 710,380 600,435 490,380" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="600" y="380" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20">需要完整手册？</text>

  <!-- man rect (是 branch, down) -->
  <rect x="470" y="485" width="260" height="70" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="600" y="512" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20" font-family="Consolas,monospace">man command</text>
  <text x="600" y="534" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">查看 man 1-9 章节（见下表）</text>

  <!-- command-help rect (否 branch, right) -->
  <rect x="830" y="350" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="940" y="372" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1B5E20" font-family="Consolas,monospace">command --help</text>
  <text x="940" y="392" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">快速选项速查</text>

  <!-- ===== Bypass container (right top) ===== -->
  <rect x="950" y="100" width="220" height="190" rx="10" fill="#F1F8E9" stroke="#7CB342" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="1060" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#558B2F">补充工具（旁路）</text>
  <!-- info rect -->
  <rect x="965" y="145" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#7CB342" stroke-width="1.2"/>
  <text x="1060" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20" font-family="Consolas,monospace">info command</text>
  <text x="1060" y="185" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#555">GNU 详细手册（超链接）</text>
  <!-- tldr rect -->
  <rect x="965" y="215" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#7CB342" stroke-width="1.2"/>
  <text x="1060" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20" font-family="Consolas,monospace">tldr command</text>
  <text x="1060" y="255" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#555">社区示例速查</text>

  <!-- ===== Branch arrows (drawn last) ===== -->
  <!-- start -> D1 -->
  <line x1="600" y1="110" x2="600" y2="153" stroke="#43A047" stroke-width="1.8" marker-end="url(#ahg)"/>
  <!-- D1 是 -> help (left) -->
  <line x1="490" y1="210" x2="352" y2="210" stroke="#43A047" stroke-width="1.8" marker-end="url(#ahg)"/>
  <text x="420" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">是</text>
  <!-- D1 否 -> D2 (down) -->
  <line x1="600" y1="265" x2="600" y2="323" stroke="#43A047" stroke-width="1.8" marker-end="url(#ahg)"/>
  <text x="612" y="295" text-anchor="start" font-size="12" font-weight="bold" fill="#1B5E20">否</text>
  <!-- D2 是 -> man (down) -->
  <line x1="600" y1="435" x2="600" y2="483" stroke="#43A047" stroke-width="1.8" marker-end="url(#ahg)"/>
  <text x="612" y="460" text-anchor="start" font-size="12" font-weight="bold" fill="#1B5E20">是</text>
  <!-- D2 否 -> command-help (right) -->
  <line x1="710" y1="380" x2="828" y2="380" stroke="#43A047" stroke-width="1.8" marker-end="url(#ahg)"/>
  <text x="765" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">否</text>
  <!-- start -> bypass (dashed) -->
  <path d="M720,85 H835 V195 H948" fill="none" stroke="#7CB342" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ahgd)"/>
  <text x="780" y="76" text-anchor="middle" font-size="10" fill="#558B2F">需要示例/详情</text>

  <!-- ===== Bottom: man sections table (1-9) ===== -->
  <text x="600" y="610" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474F">man 手册章节（1-9）</text>

  <!-- 3x3 grid of section cards; cols x=74,430,786 ; rows y=636,694,752 ; w=340 h=48 -->
  <g>
    <!-- row 0 -->
    <rect x="74" y="636" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="102" cy="660" r="15" fill="#43A047"/><text x="102" y="660" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="128" y="660" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">用户命令（Programs）</text>

    <rect x="430" y="636" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="458" cy="660" r="15" fill="#43A047"/><text x="458" y="660" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="484" y="660" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">系统调用（System Calls）</text>

    <rect x="786" y="636" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="814" cy="660" r="15" fill="#43A047"/><text x="814" y="660" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="840" y="660" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">库函数（Library Calls）</text>

    <!-- row 1 -->
    <rect x="74" y="694" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="102" cy="718" r="15" fill="#43A047"/><text x="102" y="718" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="128" y="718" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">设备文件（Special Files）</text>

    <rect x="430" y="694" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="458" cy="718" r="15" fill="#43A047"/><text x="458" y="718" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="484" y="718" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">配置文件（File Formats）</text>

    <rect x="786" y="694" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="814" cy="718" r="15" fill="#43A047"/><text x="814" y="718" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">6</text>
    <text x="840" y="718" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">游戏（Games）</text>

    <!-- row 2 -->
    <rect x="74" y="752" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="102" cy="776" r="15" fill="#43A047"/><text x="102" y="776" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="128" y="776" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">约定与杂项（Conventions）</text>

    <rect x="430" y="752" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="458" cy="776" r="15" fill="#43A047"/><text x="458" y="776" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">8</text>
    <text x="484" y="776" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">管理命令（Sys Admin）</text>

    <rect x="786" y="752" width="340" height="48" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
    <circle cx="814" cy="776" r="15" fill="#43A047"/><text x="814" y="776" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">9</text>
    <text x="840" y="776" text-anchor="start" dominant-baseline="central" font-size="13" fill="#1B5E20">内核接口（Kernel Routines）</text>
  </g>
</svg>
