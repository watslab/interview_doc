<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="390" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 生产者 -->
  <rect x="40" y="70" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#s1)"/>
  <text x="110" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">生产者 A</text>

  <rect x="40" y="160" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#s1)"/>
  <text x="110" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">生产者 B</text>

  <!-- 集群面板 -->
  <rect x="240" y="40" width="400" height="280" rx="10" fill="#F0F7FF" stroke="#90CAF9" stroke-width="1.5"/>
  <path d="M250,40 H630 Q640,40 640,50 V76 H240 V50 Q240,40 250,40Z" fill="#1E88E5"/>
  <text x="440" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Kafka 集群 · 主题 orders（3 分区）</text>

  <rect x="330" y="96" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="430" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Broker 1</text>
  <text x="430" y="136" text-anchor="middle" font-size="10.5" fill="#888888">分区 0（Leader）</text>

  <rect x="330" y="168" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="430" y="188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Broker 2</text>
  <text x="430" y="208" text-anchor="middle" font-size="10.5" fill="#888888">分区 1（Leader）</text>

  <rect x="330" y="240" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="430" y="260" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Broker 3</text>
  <text x="430" y="280" text-anchor="middle" font-size="10.5" fill="#888888">分区 2（Leader）</text>

  <!-- 消费组 A -->
  <rect x="700" y="40" width="180" height="156" rx="10" fill="#F2FAF2" stroke="#81C784" stroke-width="1.5"/>
  <path d="M710,40 H870 Q880,40 880,50 V76 H700 V50 Q700,40 710,40Z" fill="#43A047"/>
  <text x="790" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">消费组 A</text>
  <rect x="716" y="88" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 A1</text>
  <rect x="716" y="142" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="167" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 A2</text>

  <!-- 消费组 B -->
  <rect x="700" y="218" width="180" height="102" rx="10" fill="#F9F3FC" stroke="#CE93D8" stroke-width="1.5"/>
  <path d="M710,218 H870 Q880,218 880,228 V254 H700 V228 Q700,218 710,218Z" fill="#7B1FA2"/>
  <text x="790" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">消费组 B</text>
  <rect x="716" y="266" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 B1</text>

  <!-- 写入路径 -->
  <line x1="180" y1="96" x2="329" y2="120" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="180" y1="96" x2="329" y2="182" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="180" y1="186" x2="329" y2="206" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="180" y1="186" x2="329" y2="264" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 消费路径 -->
  <line x1="641" y1="118" x2="699" y2="118" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="641" y1="269" x2="699" y2="269" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="670" y="114" text-anchor="middle" font-size="10" fill="#757575">拉取</text>
  <text x="670" y="265" text-anchor="middle" font-size="10" fill="#757575">拉取</text>

  <text x="460" y="354" text-anchor="middle" font-size="10.5" fill="#757575">同一消费组内：分区在实例间负载均衡，一个分区同一时刻只被组内一个实例消费</text>
  <text x="460" y="374" text-anchor="middle" font-size="10.5" fill="#757575">不同消费组之间：各自独立消费全量数据（广播），互不影响</text>
</svg>
