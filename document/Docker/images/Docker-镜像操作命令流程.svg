<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="286" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 主链路：获取 → 查看 → 构建发布 -->
  <rect x="64" y="60" width="112" height="56" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="120" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0D47A1">docker search</text>
  <text x="120" y="98" text-anchor="middle" font-size="10" fill="#1E88E5">搜索镜像</text>

  <rect x="208" y="60" width="112" height="56" rx="8" fill="#E0F2F1" stroke="#00897B" stroke-width="1.2" filter="url(#s1)"/>
  <text x="264" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#00695C">docker pull</text>
  <text x="264" y="98" text-anchor="middle" font-size="10" fill="#00897B">拉取镜像</text>

  <rect x="352" y="60" width="112" height="56" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="408" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E65100">docker images</text>
  <text x="408" y="98" text-anchor="middle" font-size="10" fill="#FB8C00">查看本地镜像</text>

  <rect x="496" y="60" width="112" height="56" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.2" filter="url(#s1)"/>
  <text x="552" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6A1B9A">docker build</text>
  <text x="552" y="98" text-anchor="middle" font-size="10" fill="#8E24AA">构建镜像</text>

  <rect x="640" y="60" width="112" height="56" rx="8" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.2" filter="url(#s1)"/>
  <text x="696" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#283593">docker tag</text>
  <text x="696" y="98" text-anchor="middle" font-size="10" fill="#3949AB">标记镜像</text>

  <rect x="784" y="60" width="112" height="56" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <text x="840" y="85" text-anchor="middle" font-size="11.5" font-weight="600" fill="#AD1457">docker push</text>
  <text x="840" y="98" text-anchor="middle" font-size="10" fill="#D81B60">推送镜像</text>

  <!-- 分支：本地镜像管理（rmi 为破坏性操作，红色标注） -->
  <rect x="280" y="190" width="112" height="56" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="336" y="215.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#B71C1C">docker rmi</text>
  <text x="336" y="228.2" text-anchor="middle" font-size="10" fill="#C62828">删除镜像</text>

  <rect x="424" y="190" width="112" height="56" rx="8" fill="#B2EBF2" stroke="#0097A7" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="215.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#006064">docker save</text>
  <text x="480" y="228.2" text-anchor="middle" font-size="10" fill="#0097A7">导出镜像</text>

  <rect x="568" y="190" width="112" height="56" rx="8" fill="#F0F4C3" stroke="#9E9D24" stroke-width="1.2" filter="url(#s1)"/>
  <text x="624" y="215.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#827717">docker load</text>
  <text x="624" y="228.2" text-anchor="middle" font-size="10" fill="#9E9D24">导入镜像</text>

  <!-- 连接箭头（最后绘制，保证在最上层） -->
  <line x1="178" y1="88" x2="207" y2="88" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="322" y1="88" x2="351" y2="88" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="466" y1="88" x2="495" y2="88" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="610" y1="88" x2="639" y2="88" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="754" y1="88" x2="783" y2="88" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <path d="M390,117.2 L390,140 Q390,152 378,152 L348,152 Q336,152 336,164 L336,189.6" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M426,117.2 L426,140 Q426,152 438,152 L468,152 Q480,152 480,164 L480,189.6" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="538" y1="218" x2="567" y2="218" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="480" y="274" text-anchor="middle" font-size="10.5" fill="#757575">镜像操作围绕本地镜像展开：build 构建与 pull 拉取的镜像经 tag 标记后由 push 发布，rmi 删除本地镜像，save 与 load 通过 tar 包离线迁移镜像</text>
</svg>
