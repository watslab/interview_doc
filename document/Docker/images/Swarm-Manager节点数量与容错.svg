<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="570" height="360" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- ===== Manager 节点数量（左） ===== -->
  <rect x="55" y="60" width="190" height="260" rx="10" fill="#F8FAFB" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="71" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#37474F">Manager 节点数量</text>

  <rect x="75" y="108" width="150" height="52" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="150" y="131.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B5E20">3 个节点</text>
  <text x="150" y="144.8" text-anchor="middle" font-size="10.5" fill="#388E3C">容忍 1 个故障</text>

  <rect x="75" y="178" width="150" height="52" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="150" y="201.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E65100">5 个节点</text>
  <text x="150" y="214.8" text-anchor="middle" font-size="10.5" fill="#F57C00">容忍 2 个故障</text>

  <rect x="75" y="248" width="150" height="52" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="150" y="271.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B71C1C">7 个节点</text>
  <text x="150" y="284.8" text-anchor="middle" font-size="10.5" fill="#C62828">容忍 3 个故障</text>

  <!-- ===== 计算公式（右） ===== -->
  <rect x="325" y="122" width="210" height="136" rx="10" fill="#F8FAFB" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="341" y="152" text-anchor="start" font-size="13" font-weight="bold" fill="#37474F">计算公式</text>

  <rect x="345" y="170" width="170" height="68" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="430" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#37474F">容忍故障数 = (n-1)/2</text>
  <text x="430" y="208.8" text-anchor="middle" font-size="10.5" fill="#607D8B">n 为 Manager 节点数</text>
  <text x="430" y="225.3" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E65100">n 取奇数（偶数不提升容错）</text>

  <!-- ===== 面板间转换箭头（最后绘制，保证置于顶层） ===== -->
  <line x1="245.75" y1="190" x2="324.25" y2="190" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="295" y="348.8" text-anchor="middle" font-size="10.5" fill="#757575">左侧为可选的 Manager 节点数量，右侧为对应的容忍故障数计算公式</text>
</svg>
