<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="394" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 外部网络 -->
  <rect x="370" y="30" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">外部网络</text>

  <!-- 宿主机网络命名空间（共享） -->
  <rect x="100" y="110" width="760" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="130" y="140" text-anchor="start" font-size="13" font-weight="bold" fill="#1565C0">宿主机网络命名空间（共享）</text>

  <rect x="370" y="150" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">eth0</text>
  <text x="480" y="190" text-anchor="middle" font-size="10" fill="#666666">192.168.1.100</text>

  <rect x="130" y="262" width="180" height="56" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="220" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">docker0</text>
  <text x="220" y="302" text-anchor="middle" font-size="10" fill="#C62828">172.17.0.1</text>

  <!-- 容器（共享宿主机网络栈） -->
  <rect x="340" y="249" width="280" height="82" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="355" y="271" text-anchor="start" font-size="11" font-weight="600" fill="#B71C1C">容器</text>
  <rect x="370" y="281" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="294" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">应用进程</text>
  <text x="480" y="311" text-anchor="middle" font-size="10" fill="#666666">直接使用宿主机端口</text>

  <!-- 连接箭头（外部网络与 eth0 双向；应用进程直接绑定 eth0；内外箭头等长 75px） -->
  <line x1="472" y1="150" x2="472" y2="75" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="488" y1="75" x2="488" y2="150" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="281" x2="480" y2="206" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="495" y="231" text-anchor="start" font-size="10" fill="#757575">直接绑定</text>

  <!-- 底部说明 -->
  <text x="480" y="380" text-anchor="middle" font-size="10.5" fill="#757575">容器与宿主机共享网络栈，直接使用宿主机 IP 与端口；docker0 仍存在但容器流量不经过它</text>
</svg>
