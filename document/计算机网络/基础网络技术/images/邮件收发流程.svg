<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah-blue" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#1E88E5"/></marker>
    <marker id="ah-orange" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#F57C00"/></marker>
    <marker id="ah-green" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#43A047"/></marker>
    <marker id="ah-purple" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#7B1FA2"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="980" height="248" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H978 Q990,10 990,22 V50 H10 Z" fill="#37474F"/>
  <text x="500" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">邮件收发工作流程</text>

  <!-- Entity A: 发件人 MUA -->
  <rect x="40" y="110" width="140" height="60" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="110" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">发件人 MUA</text>

  <!-- Entity B: 发件方 MTA -->
  <rect x="250" y="110" width="140" height="60" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#E65100">发件方 MTA</text>

  <!-- Entity C: 收件方邮件服务器（容器，含 MTA / MDA / 收件人邮箱） -->
  <rect x="460" y="95" width="290" height="90" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="107" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20">收件方邮件服务器</text>
  <rect x="475" y="115" width="60" height="50" rx="4" fill="#FFFFFF" stroke="#43A047" stroke-width="1"/>
  <text x="505" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">MTA</text>
  <rect x="575" y="115" width="60" height="50" rx="4" fill="#FFFFFF" stroke="#43A047" stroke-width="1"/>
  <text x="605" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">MDA</text>
  <rect x="675" y="115" width="60" height="50" rx="4" fill="#C8E6C9" stroke="#43A047" stroke-width="1"/>
  <text x="705" y="140" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">收件人邮箱</text>

  <!-- Entity D: 收件人 MUA -->
  <rect x="820" y="110" width="140" height="60" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="890" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#4A148C">收件人 MUA</text>

  <!-- 步骤 1: 发件人 MUA → 发件方 MTA（SMTP 提交） -->
  <path d="M180,140 L249,140" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="215" cy="140" r="8" fill="#1E88E5"/>
  <text x="215" y="140" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="215" y="163" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">SMTP 提交</text>
  <text x="215" y="177" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#999999">端口 587</text>

  <!-- 步骤 2: 发件方 MTA → 收件方 MTA（SMTP 传输） -->
  <path d="M390,140 L474,140" stroke="#F57C00" stroke-width="2" marker-end="url(#ah-orange)"/>
  <circle cx="432" cy="140" r="8" fill="#F57C00"/>
  <text x="432" y="140" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="432" y="163" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">SMTP 传输</text>
  <text x="432" y="177" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#999999">端口 25</text>

  <!-- 步骤 3: 收件方 MTA → MDA → 收件人邮箱（本地投递） -->
  <path d="M535,140 L574,140" stroke="#43A047" stroke-width="2" marker-end="url(#ah-green)"/>
  <circle cx="545" cy="140" r="8" fill="#43A047"/>
  <text x="545" y="140" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">3</text>
  <path d="M635,140 L674,140" stroke="#43A047" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 步骤 4: 收件人邮箱 → 收件人 MUA（IMAP/POP3 读取） -->
  <path d="M750,140 L819,140" stroke="#7B1FA2" stroke-width="2" marker-end="url(#ah-purple)"/>
  <circle cx="785" cy="140" r="8" fill="#7B1FA2"/>
  <text x="785" y="140" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="785" y="163" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#4A148C">IMAP/POP3</text>
  <text x="785" y="177" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#999999">读取（143/110）</text>

  <!-- 说明注记 -->
  <rect x="40" y="212" width="520" height="34" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="300" y="229" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">步骤 2：目的邮件服务器地址由发件方 MTA 经 DNS MX 记录查询获得（见 3.3 节）</text>
  <rect x="580" y="212" width="380" height="34" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="770" y="229" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">步骤 3（本地投递）：MDA 将邮件写入收件人邮箱，无网络协议参与</text>
</svg>
