  <text x="460" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">需要原子性的场景</text>
  <rect x="348" y="200" width="224" height="46" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">命令间有依赖</text>
  <rect x="348" y="285" width="224" height="46" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">超大批量（&gt; 10000）</text>

