  <text x="190" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="224" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">集群架构</text>

  <rect x="300" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="318" cy="296" r="9" fill="#43A047"/>
  <text x="318" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="352" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">工作负载对象</text>

  <rect x="428" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="446" cy="296" r="9" fill="#43A047"/>
  <text x="446" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="480" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">服务路由与存储</text>

  <rect x="556" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="574" cy="296" r="9" fill="#43A047"/>
  <text x="574" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="608" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">调度与资源</text>

  <rect x="684" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="702" cy="296" r="9" fill="#43A047"/>
  <text x="702" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="736" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">安全与访问控制</text>

  <rect x="812" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="830" cy="296" r="9" fill="#43A047"/>
  <text x="830" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">7</text>
  <text x="864" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">部署与运维</text>

  <!-- 下行箭头 y=312 -->
  <line x1="150" y1="312" x2="170" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="278" y1="312" x2="298" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="406" y1="312" x2="426" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="534" y1="312" x2="554" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="662" y1="312" x2="682" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="790" y1="312" x2="810" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部图注 -->
  <text x="480" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9E9E9E">上：Kubernetes 作为交付链路落点　|　下：本文档体系的七篇学习路径</text>
