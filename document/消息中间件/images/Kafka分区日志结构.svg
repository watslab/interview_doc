<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="310" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 分区标题 -->
  <text x="60" y="52" font-size="13" font-weight="bold" fill="#333333">主题 orders · 分区 0</text>
  <text x="60" y="70" font-size="10.5" fill="#888888">只追加、不可修改的消息序列（日志）</text>

  <!-- 段划分 -->
  <line x1="60" y1="96" x2="444" y2="96" stroke="#F57C00" stroke-width="1.2"/>
  <line x1="60" y1="96" x2="60" y2="102" stroke="#F57C00" stroke-width="1.2"/>
  <line x1="444" y1="96" x2="444" y2="102" stroke="#F57C00" stroke-width="1.2"/>
  <text x="252" y="90" text-anchor="middle" font-size="10" fill="#B26A00">段 0（segment，按大小或时间切分落盘）</text>
  <line x1="483" y1="96" x2="754" y2="96" stroke="#F57C00" stroke-width="1.2"/>
  <line x1="483" y1="96" x2="483" y2="102" stroke="#F57C00" stroke-width="1.2"/>
  <line x1="754" y1="96" x2="754" y2="102" stroke="#F57C00" stroke-width="1.2"/>
  <text x="618" y="90" text-anchor="middle" font-size="10" fill="#B26A00">段 1（活跃段，接收追加写入）</text>

  <!-- 消息盒 -->
  <rect x="60" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="95" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">0</text>
  <text x="95" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="138" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="173" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">1</text>
  <text x="173" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="216" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="251" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">2</text>
  <text x="251" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="294" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="329" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">3</text>
  <text x="329" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="372" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="407" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">4</text>
  <text x="407" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="450" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="485" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">5</text>
  <text x="485" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="528" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="563" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">6</text>
  <text x="563" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="606" y="108" width="70" height="48" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="641" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E88E5">7</text>
  <text x="641" y="146" text-anchor="middle" font-size="9.5" fill="#888888">消息</text>
  <rect x="684" y="108" width="70" height="48" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="719" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">8</text>
  <text x="719" y="146" text-anchor="middle" font-size="9.5" fill="#888888">最新消息</text>

  <!-- 追加箭头 -->
  <line x1="830" y1="132" x2="762" y2="132" stroke="#E65100" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="800" y="118" text-anchor="middle" font-size="10.5" fill="#B26A00">追加写入</text>

  <!-- 消费位移 -->
  <line x1="407" y1="196" x2="407" y2="162" stroke="#43A047" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="407" y="216" text-anchor="middle" font-size="10.5" fill="#2E7D32">消费位移 = 4（该消费者下一条从 offset 4 读取）</text>
  <text x="720" y="216" text-anchor="middle" font-size="10.5" fill="#757575">偏移量单调递增，消费者可任意回溯</text>

  <!-- 保留与压实 -->
  <rect x="60" y="244" width="370" height="56" rx="8" fill="#F0F7FF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="245" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">保留策略：按时间（默认 7 天）或按大小</text>
  <text x="245" y="286" text-anchor="middle" font-size="10" fill="#888888">到期后删除最旧的日志段，与消费者是否已读无关</text>
  <rect x="490" y="244" width="370" height="56" rx="8" fill="#F9F3FC" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="675" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">日志压实（log compaction）：按键保留最新值</text>
  <text x="675" y="286" text-anchor="middle" font-size="10" fill="#888888">适合保存每个键的最新状态，如数据库变更快照</text>
</svg>
