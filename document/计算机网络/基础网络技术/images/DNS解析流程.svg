<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="620" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H938 Q950,10 950,22 V50 H10 Z" fill="#37474F"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">DNS 解析流程时序图（www.example.com）</text>

  <!-- Entity headers -->
  <rect x="50" y="70" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="120" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">客户端浏览器</text>

  <rect x="250" y="70" width="140" height="40" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20">本地 DNS 缓存</text>

  <rect x="450" y="70" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="520" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#E65100">本地域名服务器</text>

  <rect x="650" y="70" width="140" height="40" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="720" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#4A148C">根域名服务器</text>

  <rect x="810" y="70" width="120" height="40" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="870" y="90" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#37474F">TLD/权威</text>

  <!-- Vertical lifelines -->
  <line x1="120" y1="110" x2="120" y2="580" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="320" y1="110" x2="320" y2="580" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="110" x2="520" y2="580" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="110" x2="720" y2="580" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="870" y1="110" x2="870" y2="580" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Step 1: Browser -> Local cache check -->
  <path d="M120,135 L320,135" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="160" y="120" width="120" height="20" rx="3" fill="#E3F2FD" stroke="#1E88E5" stroke-width="0.5"/>
  <text x="220" y="130" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">① 查询本地缓存</text>

  <!-- Cache miss return -->
  <path d="M320,160 L120,160" stroke="#F57C00" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="4,3"/>
  <rect x="160" y="145" width="120" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <text x="220" y="155" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">未命中</text>

  <!-- Step 2: Browser -> Local DNS -->
  <path d="M120,195 L520,195" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="240" y="180" width="160" height="20" rx="3" fill="#E3F2FD" stroke="#1E88E5" stroke-width="0.5"/>
  <text x="320" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">② 递归查询请求</text>

  <!-- Step 3: Local DNS -> Root -->
  <path d="M520,230 L720,230" stroke="#7B1FA2" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="540" y="215" width="160" height="20" rx="3" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="0.5"/>
  <text x="620" y="225" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#4A148C">③ 查询根服务器</text>

  <!-- Root -> Local DNS: TLD referral -->
  <path d="M720,265 L520,265" stroke="#F57C00" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="4,3"/>
  <rect x="540" y="250" width="160" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <text x="620" y="260" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">④ 返回 .com TLD 地址</text>

  <!-- Step 5: Local DNS -> TLD -->
  <path d="M520,300 L870,300" stroke="#7B1FA2" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="620" y="285" width="160" height="20" rx="3" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="0.5"/>
  <text x="700" y="295" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#4A148C">⑤ 查询 .com TLD</text>

  <!-- TLD -> Local DNS: authoritative referral -->
  <path d="M870,335 L520,335" stroke="#F57C00" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="4,3"/>
  <rect x="620" y="320" width="160" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <text x="700" y="330" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">⑥ 返回权威服务器地址</text>

  <!-- Step 7: Local DNS -> Authoritative -->
  <path d="M520,370 L870,370" stroke="#7B1FA2" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="610" y="355" width="180" height="20" rx="3" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="0.5"/>
  <text x="700" y="365" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#4A148C">⑦ 查询权威服务器</text>

  <!-- Authoritative -> Local DNS: final answer -->
  <path d="M870,405 L520,405" stroke="#1B5E20" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="600" y="390" width="200" height="20" rx="3" fill="#E8F5E9" stroke="#43A047" stroke-width="0.5"/>
  <text x="700" y="400" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">⑧ 返回 www.example.com 的 IP</text>

  <!-- Step 9: Local DNS -> Browser: final answer -->
  <path d="M520,445 L120,445" stroke="#1B5E20" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="240" y="430" width="160" height="20" rx="3" fill="#E8F5E9" stroke="#43A047" stroke-width="0.5"/>
  <text x="320" y="440" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">⑨ 返回解析结果</text>

  <!-- Step 10: Browser caches -->
  <rect x="60" y="475" width="120" height="36" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="120" y="493" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">⑩ 浏览器缓存结果</text>

  <!-- Query type note -->
  <rect x="50" y="530" width="880" height="60" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="490" y="548" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#5D4037">查询类型说明</text>
  <text x="490" y="566" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">客户端→本地 DNS：递归查询（由本地 DNS 代为完成全部解析）</text>
  <text x="490" y="582" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">本地 DNS→根/TLD/权威：迭代查询（逐级返回下一级地址，本地 DNS 自行再次查询）</text>

  <!-- Footer -->
  <text x="490" y="615" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">RFC 1034/1035：DNS 默认 UDP 53 端口；响应超过 512 字节改用 TCP；DNSSEC 提供身份验证与完整性保护</text>
</svg>
