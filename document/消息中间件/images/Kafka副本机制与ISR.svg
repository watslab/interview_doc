<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 454" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E88E5"/></marker>
  </defs>

  <rect x="10" y="10" width="1140" height="434" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 生产者 -->
  <rect x="515" y="28" width="130" height="38" rx="8" fill="#FFFFFF" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="580" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">生产者</text>

  <!-- ISR 边界 -->
  <rect x="25" y="102" width="1110" height="220" rx="12" fill="none" stroke="#43A047" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="45" y="124" font-size="12" font-weight="600" fill="#2E7D32">ISR：与 Leader 保持同步的副本集合（含 Leader 本身），随副本滞后情况动态伸缩</text>

  <!-- Broker 1（Follower） -->
  <rect x="40" y="140" width="330" height="164" rx="10" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <path d="M50,140 H360 Q370,140 370,150 V174 H40 V150 Q40,140 50,140Z" fill="#64B5F6"/>
  <text x="205" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Broker 1</text>
  <rect x="70" y="188" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="205" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1E88E5">分区 0 · Follower</text>
  <rect x="70" y="246" width="270" height="36" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="205" y="268" text-anchor="middle" font-size="11.5" fill="#555555">副本日志（同步中）</text>

  <!-- Broker 2（Leader） -->
  <rect x="415" y="140" width="330" height="164" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <path d="M425,140 H735 Q745,140 745,150 V174 H415 V150 Q415,140 425,140Z" fill="#1E88E5"/>
  <text x="580" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Broker 2</text>
  <rect x="445" y="188" width="270" height="44" rx="8" fill="#1E88E5" filter="url(#s1)"/>
  <text x="580" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">分区 0 · Leader</text>
  <rect x="445" y="246" width="270" height="36" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="580" y="268" text-anchor="middle" font-size="11.5" fill="#555555">副本日志（完整）</text>

  <!-- Broker 3（Follower） -->
  <rect x="790" y="140" width="330" height="164" rx="10" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
  <path d="M800,140 H1110 Q1120,140 1120,150 V174 H790 V150 Q790,140 800,140Z" fill="#64B5F6"/>
  <text x="955" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Broker 3</text>
  <rect x="820" y="188" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="955" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1E88E5">分区 0 · Follower</text>
  <rect x="820" y="246" width="270" height="36" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="955" y="268" text-anchor="middle" font-size="11.5" fill="#555555">副本日志（同步中）</text>

  <!-- 写入与同步 -->
  <line x1="580" y1="66" x2="580" y2="138" stroke="#1E88E5" stroke-width="1.8" marker-end="url(#ahb)"/>
  <text x="592" y="88" font-size="11" fill="#1565C0">acks=all 时等待全部 ISR 副本确认</text>

  <line x1="415" y1="210" x2="372" y2="210" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="745" y1="210" x2="788" y2="210" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="393" y="232" text-anchor="middle" font-size="11.5" fill="#757575">同步</text>
  <text x="767" y="232" text-anchor="middle" font-size="11.5" fill="#757575">同步</text>

  <!-- 动态说明 -->
  <rect x="40" y="346" width="1080" height="82" rx="8" fill="#F0F7FF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="580" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">副本落后超过 replica.lag.time.max.ms 会被移出 ISR，追上后重新加入；Leader 故障时仅从 ISR 中选新主</text>
  <text x="580" y="404" text-anchor="middle" font-size="11.5" fill="#757575">acks=all 与 min.insync.replicas 配合：若 ISR 收缩到低于该值，写入将被拒绝，以可用性换取可靠性</text>
</svg>
