<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#E53935"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
  </defs>

  <!-- Outer frame (standard rounded canvas) -->
  <rect x="10" y="10" width="780" height="370" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Column panels (bounded backgrounds, like 证书信任链 right panel) -->
  <rect x="25" y="25" width="360" height="300" rx="8" fill="#FFEBEE" opacity="0.35" stroke="#EF9A9A" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="415" y="25" width="360" height="300" rx="8" fill="#E8F5E9" opacity="0.35" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Left title bar (red: no forward secrecy, RSA) -->
  <path d="M43,35 H367 Q375,35 375,43 V65 H35 V43 Q35,35 43,35 Z" fill="#E53935" filter="url(#shadow1)"/>
  <text x="205" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFF">无前向保密（RSA）</text>

  <!-- Right title bar (green: forward secrecy, ECDHE) -->
  <path d="M433,35 H757 Q765,35 765,43 V65 H425 V43 Q425,35 433,35 Z" fill="#43A047" filter="url(#shadow1)"/>
  <text x="595" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFF">有前向保密（ECDHE）</text>

  <!-- Left step boxes (RSA flow, red borders) -->
  <rect x="55" y="80" width="300" height="28" rx="6" fill="#FFF" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="205" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">Client 生成预主密钥</text>

  <rect x="55" y="123" width="300" height="28" rx="6" fill="#FFF" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="205" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">用服务器公钥加密</text>

  <rect x="55" y="166" width="300" height="28" rx="6" fill="#FFF" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="205" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">发送给服务器</text>

  <rect x="55" y="209" width="300" height="28" rx="6" fill="#FFF" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="205" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">服务器用私钥解密</text>

  <rect x="55" y="252" width="300" height="28" rx="6" fill="#FFF" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="205" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">得到会话密钥</text>

  <!-- Left annotation (risk warning, red) -->
  <rect x="40" y="287" width="330" height="33" rx="6" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="205" y="297" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#C62828">风险：私钥泄露 → 攻击者可解密历史流量</text>
  <text x="205" y="311" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#C62828">（被截获的密文 + 私钥 = 明文）</text>

  <!-- Right step boxes (ECDHE flow, green borders) -->
  <rect x="445" y="80" width="300" height="28" rx="6" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">Client 生成临时密钥对（x, xP）</text>

  <rect x="445" y="123" width="300" height="28" rx="6" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="137" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">Server 生成临时密钥对（y, yP）</text>

  <rect x="445" y="166" width="300" height="28" rx="6" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">交换公钥</text>

  <rect x="445" y="209" width="300" height="28" rx="6" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">各自计算共享密钥</text>

  <rect x="445" y="252" width="300" height="28" rx="6" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">会话结束销毁临时私钥 x, y</text>

  <!-- Right annotation (safety, green) -->
  <rect x="430" y="287" width="330" height="33" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="595" y="297" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">安全：私钥泄露 → 无法解密历史流量</text>
  <text x="595" y="311" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#2E7D32">（临时私钥 x, y 已销毁）</text>

  <!-- Left arrows (vertical, red) -->
  <line x1="205" y1="108" x2="205" y2="121" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="205" y1="151" x2="205" y2="164" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="205" y1="194" x2="205" y2="207" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="205" y1="237" x2="205" y2="250" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Right arrows (vertical, green) -->
  <line x1="595" y1="108" x2="595" y2="121" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="595" y1="151" x2="595" y2="164" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="595" y1="194" x2="595" y2="207" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="595" y1="237" x2="595" y2="250" stroke="#43A047" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Bottom definition box (full width, gray) -->
  <rect x="40" y="335" width="720" height="34" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="400" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#37474F">前向保密定义：即使长期私钥泄露，过去会话仍安全</text>
</svg>
