<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="420" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 层叠堆栈 -->
  <rect x="300" y="60" width="320" height="58" rx="6" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="85" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">可写层（容器运行时）</text>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="#888888">容器修改数据</text>

  <rect x="300" y="130" width="320" height="58" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">配置层</text>
  <text x="460" y="175" text-anchor="middle" font-size="10" fill="#888888">EXPOSE | CMD</text>

  <rect x="300" y="200" width="320" height="58" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">应用层</text>
  <text x="460" y="245" text-anchor="middle" font-size="10" fill="#888888">COPY . /app</text>

  <rect x="300" y="270" width="320" height="58" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="295" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">依赖层</text>
  <text x="460" y="315" text-anchor="middle" font-size="10" fill="#888888">RUN apt-get install</text>

  <rect x="300" y="340" width="320" height="58" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="365" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">基础镜像层</text>
  <text x="460" y="385" text-anchor="middle" font-size="10" fill="#888888">ubuntu:22.04 (≈ 70MB)</text>

  <!-- 联合挂载方向 -->
  <line x1="655" y1="398" x2="655" y2="64" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="655" y="46" text-anchor="middle" font-size="10.5" fill="#757575">联合挂载</text>

  <!-- 左侧属性标注 -->
  <text x="280" y="93" text-anchor="end" font-size="10.5" font-weight="600" fill="#C2185B">读写</text>
  <text x="280" y="283" text-anchor="end" font-size="10.5" font-weight="600" fill="#1565C0">只读 | 镜像层</text>
  <line x1="288" y1="132" x2="288" y2="392" stroke="#CE93D8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="288" y1="60" x2="288" y2="118" stroke="#C2185B" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="460" y="426" text-anchor="middle" font-size="10.5" fill="#757575">相同的基础层在所有镜像间共享，只存储一份</text>
</svg>
