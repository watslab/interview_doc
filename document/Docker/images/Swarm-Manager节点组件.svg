<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 705" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="aho" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EF6C00"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="685" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Manager 节点面板 -->
  <rect x="145" y="30" width="670" height="526" rx="10" fill="#F8FAFB" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="161" y="56" text-anchor="start" font-size="14" font-weight="bold" fill="#37474F">Manager 节点</text>

  <!-- API 层 -->
  <rect x="175" y="72" width="290" height="104" rx="8" fill="#F3F8FE" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="191" y="88.5" text-anchor="start" font-size="12.5" font-weight="bold" fill="#0D47A1">API 层</text>
  <rect x="205" y="96" width="230" height="56" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="121.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Docker API</text>
  <text x="320" y="133.6" text-anchor="middle" font-size="9.5" fill="#546E7A">接收客户端请求</text>

  <!-- 编排层 -->
  <rect x="175" y="208" width="290" height="188" rx="8" fill="#F3FAF3" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="191" y="224.5" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1B5E20">编排层</text>
  <rect x="205" y="232" width="230" height="56" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">编排器</text>
  <text x="320" y="271.5" text-anchor="middle" font-size="9.5" fill="#388E3C">管理服务期望状态</text>
  <rect x="205" y="316" width="230" height="56" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="341.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">调度器</text>
  <text x="320" y="355.5" text-anchor="middle" font-size="9.5" fill="#388E3C">分配 Task 到节点</text>

  <!-- Raft 共识层 -->
  <rect x="495" y="208" width="290" height="188" rx="8" fill="#FEF3F3" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="511" y="224.5" text-anchor="start" font-size="12.5" font-weight="bold" fill="#B71C1C">Raft 共识层</text>
  <rect x="525" y="232" width="230" height="56" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="640" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">Raft 节点</text>
  <text x="640" y="271.5" text-anchor="middle" font-size="9.5" fill="#C62828">Leader / Follower</text>
  <rect x="525" y="316" width="230" height="56" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="640" y="341.5" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">日志存储</text>
  <text x="640" y="355.5" text-anchor="middle" font-size="9.5" fill="#C62828">集群状态日志</text>

  <!-- 分发器 -->
  <rect x="175" y="428" width="290" height="104" rx="8" fill="#FFF8F0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="191" y="444.5" text-anchor="start" font-size="12.5" font-weight="bold" fill="#E65100">分发器</text>
  <rect x="205" y="452" width="230" height="56" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="477.5" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">Task 分发</text>
  <text x="320" y="491.5" text-anchor="middle" font-size="9.5" fill="#F57C00">向 Worker 分配任务</text>

  <!-- Worker 节点（集群内，Manager 之外） -->
  <rect x="205" y="586" width="230" height="56" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="611.5" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F">Worker 节点</text>
  <text x="320" y="625.5" text-anchor="middle" font-size="9.5" fill="#607D8B">执行 Task | 运行容器</text>

  <!-- 连接箭头（最后绘制，保证置于顶层） -->
  <line x1="320" y1="153.2" x2="320" y2="230.9" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="320" y1="289.2" x2="320" y2="314.9" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="436.2" y1="252" x2="523.9" y2="252" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="524.7" y1="268" x2="436.2" y2="268" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="632" y1="289.2" x2="632" y2="314.9" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="648" y1="314.9" x2="648" y2="289.2" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="320" y1="373.2" x2="320" y2="450.9" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="320" y1="509.2" x2="320" y2="584.9" stroke="#EF6C00" stroke-width="2" marker-end="url(#aho)"/>
  <text x="333" y="575" text-anchor="start" font-size="10.5" font-weight="600" fill="#E65100">gRPC</text>

  <!-- 底部说明 -->
  <text x="480" y="672" text-anchor="middle" font-size="10.5" fill="#757575">请求经 API 层接入；编排器维护服务期望状态，集群状态经 Raft 共识层在多 Manager 间保持一致；调度器完成节点选择后，分发器经 gRPC 将 Task 发送至 Worker 节点执行</text>
</svg>
