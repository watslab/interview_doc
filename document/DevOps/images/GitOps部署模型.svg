<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/>
    </filter>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6Z" fill="#F57C00"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6Z" fill="#43A047"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="780" height="360" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#263238">Push vs Pull 部署模型对比</text>

  <!-- Center divider -->
  <line x1="400" y1="62" x2="400" y2="354" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Left panel: Push 模型 -->
  <rect x="30" y="62" width="350" height="292" rx="10" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M40,62 H370 Q380,62 380,72 V92 H30 V72 Q30,62 40,62Z" fill="#F57C00"/>
  <text x="205" y="77" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Push 模型（传统 CI / CD）</text>

  <rect x="95" y="106" width="220" height="45" rx="6" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="205" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333333">代码仓库（Git）</text>
  <text x="205" y="137" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">源代码版本控制</text>

  <rect x="95" y="185" width="220" height="59" rx="6" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="205" y="199" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333333">CI 流水线（Jenkins）</text>
  <text x="205" y="215" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">构建 + 部署</text>
  <g transform="translate(177,231)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#F57C00" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="15" y2="0" stroke="#F57C00" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="3" stroke="#F57C00" stroke-width="1.5"/>
    <line x1="15" y1="0" x2="15" y2="3" stroke="#F57C00" stroke-width="1.5"/>
  </g>
  <text x="198" y="231" text-anchor="start" dominant-baseline="central" font-size="10" fill="#F57C00">持有凭证</text>

  <rect x="95" y="278" width="220" height="62" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="205" y="302" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333333">Kubernetes 集群</text>
  <text x="205" y="316" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">生产环境</text>

  <!-- Right panel: Pull 模型 -->
  <rect x="420" y="62" width="350" height="292" rx="10" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M430,62 H760 Q770,62 770,72 V92 H420 V72 Q420,62 430,62Z" fill="#43A047"/>
  <text x="595" y="77" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">Pull 模型（GitOps）</text>

  <rect x="485" y="106" width="220" height="45" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="595" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333333">代码仓库（Git）</text>
  <text x="595" y="137" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">声明式配置（期望状态）</text>

  <rect x="485" y="220" width="220" height="120" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="595" y="234" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#333333">Kubernetes 集群</text>
  <text x="595" y="250" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">生产环境</text>
  <rect x="525" y="264" width="140" height="46" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="595" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">Agent</text>
  <text x="595" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#999999">ArgoCD / Flux</text>
  <g transform="translate(551,325)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#43A047" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="15" y2="0" stroke="#43A047" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="3" stroke="#43A047" stroke-width="1.5"/>
    <line x1="15" y1="0" x2="15" y2="3" stroke="#43A047" stroke-width="1.5"/>
  </g>
  <text x="573" y="325" text-anchor="start" dominant-baseline="central" font-size="10" fill="#43A047">凭证留存集群内</text>

  <!-- Connection arrows (drawn last for z-order) -->
  <line x1="205" y1="152" x2="205" y2="184" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <line x1="205" y1="245" x2="205" y2="277" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="215" y="255" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#F57C00">Push</text>
  <text x="215" y="269" text-anchor="start" dominant-baseline="central" font-size="10" fill="#F57C00">+ 集群凭证外泄</text>

  <line x1="595" y1="219" x2="595" y2="152" stroke="#43A047" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="605" y="178" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#43A047">Pull</text>
  <text x="605" y="192" text-anchor="start" dominant-baseline="central" font-size="10" fill="#43A047">凭证不出集群</text>
</svg>
