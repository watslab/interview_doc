<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="600" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H938 Q950,10 950,22 V50 H10 Z" fill="#37474F"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">IPv4 与 IPv6 首部对比</text>

  <!-- Column headers -->
  <rect x="50" y="65" width="220" height="30" rx="4" fill="#37474F"/>
  <text x="160" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">对比维度</text>

  <rect x="280" y="65" width="320" height="30" rx="4" fill="#1565C0"/>
  <text x="440" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">IPv4 首部（RFC 791）</text>

  <rect x="610" y="65" width="300" height="30" rx="4" fill="#1B5E20"/>
  <text x="760" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">IPv6 首部（RFC 8200）</text>

  <!-- Row 1: 基本首部长度 -->
  <rect x="50" y="100" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">基本首部长度</text>

  <rect x="280" y="100" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">20~60 字节（IHL 可变）</text>

  <rect x="610" y="100" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">固定 40 字节</text>

  <!-- Row 2: 地址长度 -->
  <rect x="50" y="145" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">地址长度</text>

  <rect x="280" y="145" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">32 位（源/目的各 4 字节）</text>

  <rect x="610" y="145" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">128 位（源/目的各 16 字节）</text>

  <!-- Row 3: 分片字段 -->
  <rect x="50" y="190" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">分片字段</text>

  <rect x="280" y="190" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">基本首部内（Flags + Offset）</text>

  <rect x="610" y="190" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">移至扩展首部（Fragment Header）</text>

  <!-- Row 4: 校验和 -->
  <rect x="50" y="235" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="255" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">首部校验和</text>

  <rect x="280" y="235" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="255" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">有（16 位，每跳重算）</text>

  <rect x="610" y="235" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="255" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">取消（由二层/传输层负责）</text>

  <!-- Row 5: 选项 -->
  <rect x="50" y="280" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">选项字段</text>

  <rect x="280" y="280" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">基本首部内可变长度</text>

  <rect x="610" y="280" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">移至扩展首部链</text>

  <!-- Row 6: 流标签 -->
  <rect x="50" y="325" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="345" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">流标签</text>

  <rect x="280" y="325" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="345" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">无（需五元组识别流）</text>

  <rect x="610" y="325" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="345" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">有（20 位 Flow Label）</text>

  <!-- Row 7: 服务类型 -->
  <rect x="50" y="370" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">QoS 字段</text>

  <rect x="280" y="370" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">DSCP(6) + ECN(2)</text>

  <rect x="610" y="370" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">Traffic Class(8) = DSCP+ECN</text>

  <!-- Row 8: 地址配置 -->
  <rect x="50" y="415" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="435" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">地址配置</text>

  <rect x="280" y="415" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="435" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">手动或 DHCPv4</text>

  <rect x="610" y="415" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="435" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">SLAAC（无状态）或 DHCPv6</text>

  <!-- Row 9: 广播 -->
  <rect x="50" y="460" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">广播地址</text>

  <rect x="280" y="460" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">支持（全 1 广播）</text>

  <rect x="610" y="460" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">取消（仅组播，无广播）</text>

  <!-- Row 10: 安全 -->
  <rect x="50" y="505" width="220" height="40" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="160" y="525" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">IPSec 支持</text>

  <rect x="280" y="505" width="320" height="40" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="440" y="525" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1565C0">可选（需额外实现）</text>

  <rect x="610" y="505" width="300" height="40" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="760" y="525" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1B5E20">内建支持（RFC 4301）</text>

  <!-- Footer note -->
  <rect x="50" y="555" width="860" height="40" rx="6" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="480" y="575" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5D4037">设计要点：IPv6 简化基本首部、固定长度，提升转发效率；扩展首部链按需追加，支持端到端选项</text>
</svg>
