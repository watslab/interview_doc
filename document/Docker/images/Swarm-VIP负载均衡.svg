<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <style><![CDATA[
      @media (prefers-reduced-motion: no-preference) {
        .flow { stroke-dasharray: 6 5; animation: vipflow 1.6s linear infinite; }
      }
      @keyframes vipflow { to { stroke-dashoffset: -22; } }
    ]]></style>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1565C0"/></marker>
    <marker id="ahO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EF6C00"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="440" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 节点 A：客户端所在节点（30-570） -->
  <rect x="30" y="70" width="540" height="310" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="300" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">节点 A（客户端所在节点）</text>
  <text x="300" y="113" text-anchor="middle" font-size="10" fill="#546E7A">内置 DNS 与 IPVS 均由本节点维护（每个接入 overlay 网络的节点各有一份）</text>

  <!-- 客户端容器（左右 margin 70 / 70） -->
  <rect x="100" y="132" width="160" height="64" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="180" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E65100">客户端</text>
  <text x="180" y="176" text-anchor="middle" font-size="9.5" fill="#EF6C00">请求 web 服务</text>

  <!-- 内置 DNS -->
  <rect x="340" y="132" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="420" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">内置 DNS</text>
  <text x="420" y="176" text-anchor="middle" font-size="9.5" fill="#888888">127.0.0.11（本节点）</text>

  <!-- IPVS 负载均衡器（左右 margin 60 / 60） -->
  <rect x="90" y="246" width="420" height="90" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="2" filter="url(#s1)"/>
  <text x="300" y="285" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">IPVS 负载均衡器（内核态）</text>
  <text x="300" y="304" text-anchor="middle" font-size="9.5" fill="#888888">负载均衡沙箱 · 持有 VIP 10.0.0.100</text>

  <!-- 节点 B：副本所在节点（660-920） -->
  <rect x="660" y="70" width="260" height="310" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">节点 B（副本所在节点）</text>
  <text x="790" y="113" text-anchor="middle" font-size="10" fill="#546E7A">服务副本（Task）调度在集群各节点</text>

  <!-- Task 列表（左右 margin 20 / 20，纵向间距 17 / 17） -->
  <rect x="680" y="140" width="220" height="48" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="790" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Task 1 · 10.0.0.2</text>
  <rect x="680" y="205" width="220" height="48" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="790" y="233" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Task 2 · 10.0.0.3</text>
  <rect x="680" y="270" width="220" height="48" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="790" y="298" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Task 3 · 10.0.0.4</text>

  <!-- ① DNS 查询（客户端发出，橙色）：261 → 339，两端无缝衔接 -->
  <path d="M261,164 L339,164" fill="none" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#ahO)"/>

  <!-- ② VIP 包被本节点内核 IPVS 拦截（终点抵达 IPVS 框顶边 245） -->
  <path class="flow" d="M180,197 L180,245" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ahB)"/>

  <!-- ③ IPVS 轮询分发：出口 266/290/314（等距），竖直段 598/615/632（等距，距两侧容器边各 28） -->
  <path class="flow" d="M510,266 L592,266 Q598,266 598,260 L598,170 Q598,164 604,164 L679,164" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ahB)"/>
  <path class="flow" d="M510,290 L609,290 Q615,290 615,284 L615,235 Q615,229 621,229 L679,229" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ahB)"/>
  <path class="flow" d="M510,314 L626,314 Q632,314 632,308 L632,300 Q632,294 638,294 L679,294" fill="none" stroke="#1565C0" stroke-width="1.8" marker-end="url(#ahB)"/>
  <text x="615" y="338" text-anchor="middle" font-size="10" fill="#757575">Round-Robin 轮询</text>

  <!-- 步骤编号（画在线路之上） -->
  <circle cx="300" cy="164" r="9" fill="#EF6C00"/><text x="300" y="168" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="180" cy="221" r="9" fill="#1565C0"/><text x="180" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">2</text>
  <circle cx="555" cy="290" r="9" fill="#1565C0"/><text x="555" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- 底部步骤图例（三列等宽排布，列锚点 55 / 365 / 675） -->
  <circle cx="55" cy="404" r="9" fill="#EF6C00"/><text x="73" y="408" font-size="11" font-weight="600" fill="#333333">DNS 解析（本节点）</text>
  <text x="73" y="425" font-size="10" fill="#757575">客户端向本节点内置 DNS 查询服务名，解析到 VIP</text>

  <circle cx="365" cy="404" r="9" fill="#1565C0"/><text x="383" y="408" font-size="11" font-weight="600" fill="#333333">IPVS 拦截改写（本节点内核）</text>
  <text x="383" y="425" font-size="10" fill="#757575">目的地址为 VIP 的数据包被改写为某个 Task IP</text>

  <circle cx="675" cy="404" r="9" fill="#1565C0"/><text x="693" y="408" font-size="11" font-weight="600" fill="#333333">VXLAN 跨网传输</text>
  <text x="693" y="425" font-size="10" fill="#757575">封装后以宿主机 IP 经 overlay 网络到达副本节点</text>
</svg>
