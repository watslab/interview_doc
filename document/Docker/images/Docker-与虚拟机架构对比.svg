  <text x="680" y="300" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Docker Engine</text>

  <rect x="496" y="348" width="368" height="50" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="680" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Host OS</text>

  <rect x="496" y="426" width="368" height="50" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="680" y="456" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">硬件</text>

