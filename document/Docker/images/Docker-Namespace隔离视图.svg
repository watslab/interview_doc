<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="530" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 宿主机 -->
  <rect x="280" y="50" width="400" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">宿主机</text>
  <rect x="300" y="116" width="112" height="96" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="356" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">PID</text>
  <text x="356" y="178" text-anchor="middle" font-size="9.5" fill="#666666">1, 2, 3…</text>
  <rect x="424" y="116" width="112" height="96" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">NET</text>
  <text x="480" y="178" text-anchor="middle" font-size="9.5" fill="#666666">eth0, lo</text>
  <rect x="548" y="116" width="112" height="96" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="604" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">MNT</text>
  <text x="604" y="178" text-anchor="middle" font-size="9.5" fill="#666666">/, /home…</text>

  <!-- Namespace 隔离虚线 -->
  <path d="M390,252 C390,290 275,296 275,316 L275,328" fill="none" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <path d="M570,252 C570,290 685,296 685,316 L685,328" fill="none" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="480" y="296" text-anchor="middle" font-size="10.5" fill="#757575">Namespace 隔离</text>

  <!-- 容器 1 -->
  <rect x="100" y="330" width="350" height="170" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="275" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1B5E20">容器 1</text>
  <rect x="115" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="165" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">PID</text>
  <text x="165" y="444" text-anchor="middle" font-size="9" fill="#666666">1, 2, 3…</text>
  <rect x="225" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="275" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">NET</text>
  <text x="275" y="444" text-anchor="middle" font-size="9" fill="#666666">eth0, lo</text>
  <rect x="335" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="385" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">MNT</text>
  <text x="385" y="444" text-anchor="middle" font-size="9" fill="#666666">/, /app…</text>

  <!-- 容器 2 -->
  <rect x="510" y="330" width="350" height="170" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="685" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#E65100">容器 2</text>
  <rect x="525" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="575" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">PID</text>
  <text x="575" y="444" text-anchor="middle" font-size="9" fill="#666666">1, 2, 3…</text>
  <rect x="635" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="685" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">NET</text>
  <text x="685" y="444" text-anchor="middle" font-size="9" fill="#666666">eth0, lo</text>
  <rect x="745" y="386" width="100" height="88" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="795" y="423" text-anchor="middle" font-size="11" font-weight="600" fill="#333333">MNT</text>
  <text x="795" y="444" text-anchor="middle" font-size="9" fill="#666666">/, /data…</text>

  <!-- 底部说明 -->
  <text x="480" y="524" text-anchor="middle" font-size="10.5" fill="#757575">经 Namespace 隔离，每个容器拥有独立的进程编号、网络设备与挂载点视图，彼此互不可见</text>
</svg>
