<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
  </defs>

  <rect x="10" y="10" width="960" height="540" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="490" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">iproute2（ip/ss）替代 net-tools（ifconfig/netstat 等）</text>

  <!-- 列标题 -->
  <rect x="60" y="62" width="240" height="32" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#455A64">旧工具 net-tools（已废弃）</text>
  <rect x="680" y="62" width="240" height="32" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="800" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">新工具 iproute2（推荐）</text>

  <!-- 第1行 ifconfig → ip addr / ip link -->
  <rect x="60" y="110" width="240" height="34" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#546E7A">ifconfig</text>
  <line x1="300" y1="127" x2="676" y2="127" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="120" text-anchor="middle" font-size="10" fill="#757575">查看/配置 IP 地址与网卡</text>
  <rect x="680" y="110" width="240" height="34" rx="5" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="800" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">ip addr / ip link</text>

  <!-- 第2行 route → ip route -->
  <rect x="60" y="160" width="240" height="34" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#546E7A">route</text>
  <line x1="300" y1="177" x2="676" y2="177" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="170" text-anchor="middle" font-size="10" fill="#757575">路由表管理</text>
  <rect x="680" y="160" width="240" height="34" rx="5" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="800" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">ip route</text>

  <!-- 第3行 arp → ip neigh -->
  <rect x="60" y="210" width="240" height="34" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#546E7A">arp</text>
  <line x1="300" y1="227" x2="676" y2="227" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="220" text-anchor="middle" font-size="10" fill="#757575">ARP / 邻居表</text>
  <rect x="680" y="210" width="240" height="34" rx="5" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="800" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">ip neigh</text>

  <!-- 第4行 netstat -tulpn → ss -tulpn -->
  <rect x="60" y="260" width="240" height="34" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#546E7A">netstat -tulpn</text>
  <line x1="300" y1="277" x2="676" y2="277" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="270" text-anchor="middle" font-size="10" fill="#757575">查看监听端口与连接</text>
  <rect x="680" y="260" width="240" height="34" rx="5" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="800" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">ss -tulpn</text>

  <!-- 第5行 netstat -rn → ip route -->
  <rect x="60" y="310" width="240" height="34" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="331" text-anchor="middle" font-size="12" font-weight="600" fill="#546E7A">netstat -rn</text>
  <line x1="300" y1="327" x2="676" y2="327" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="488" y="320" text-anchor="middle" font-size="10" fill="#757575">查看路由表</text>
  <rect x="680" y="310" width="240" height="34" rx="5" fill="#FFF" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="800" y="331" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">ip route</text>

  <!-- 底部对比表格 -->
  <text x="490" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">为什么使用新工具 iproute2？</text>

  <!-- 表头 -->
  <rect x="80" y="392" width="820" height="30" fill="#546E7A"/>
  <text x="170" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">维度</text>
  <text x="420" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">net-tools（旧）</text>
  <text x="740" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">iproute2（新）</text>

  <!-- 数据行1 -->
  <rect x="80" y="422" width="820" height="30" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="170" y="441" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">数据来源</text>
  <text x="420" y="441" text-anchor="middle" font-size="11" fill="#C62828">解析 /proc 文件（/proc/net/*）</text>
  <text x="740" y="441" text-anchor="middle" font-size="11" fill="#2E7D32">Netlink socket 直连内核</text>

  <!-- 数据行2 -->
  <rect x="80" y="452" width="820" height="30" fill="#FFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="170" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">性能</text>
  <text x="420" y="471" text-anchor="middle" font-size="11" fill="#C62828">大量连接时解析慢、内存高</text>
  <text x="740" y="471" text-anchor="middle" font-size="11" fill="#2E7D32">内核直接推送，高并发显著更优</text>

  <!-- 数据行3 -->
  <rect x="80" y="482" width="820" height="30" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="170" y="501" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">维护状态</text>
  <text x="420" y="501" text-anchor="middle" font-size="11" fill="#C62828">已停止维护（deprecated）</text>
  <text x="740" y="501" text-anchor="middle" font-size="11" fill="#2E7D32">Linux 标准网络套件，活跃维护</text>

  <!-- 列分隔线 -->
  <line x1="260" y1="392" x2="260" y2="512" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="580" y1="392" x2="580" y2="512" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="80" y="392" width="820" height="120" fill="none" stroke="#546E7A" stroke-width="1"/>
</svg>
