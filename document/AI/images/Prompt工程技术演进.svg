<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1280" height="660" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="650" y="40" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#263238">Prompt 工程技术演进</text>
  <text x="650" y="68" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">从写指令到设计思维框架：四次范式跃迁（2019 — 2025）</text>

  <!-- ========== Stage 1: Zero-Shot / Few-Shot (Gray) ========== -->
  <rect x="45" y="100" width="280" height="340" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M53,100 H317 Q325,100 325,108 V150 H45 V108 Q45,100 53,100Z" fill="#546E7A"/>
  <text x="185" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ECEFF1">阶段 1</text>
  <text x="185" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#CFD8DC">2019 — 2020</text>

  <text x="185" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#546E7A">Zero-Shot / Few-Shot</text>
  <text x="185" y="195" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#90A4AE">零样本 / 少样本提示</text>
  <line x1="65" y1="212" x2="305" y2="212" stroke="#ECEFF1" stroke-width="1"/>

  <circle cx="70" cy="238" r="3" fill="#546E7A"/>
  <text x="82" y="238" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">GPT-2 / GPT-3 时代</text>

  <circle cx="70" cy="265" r="3" fill="#546E7A"/>
  <text x="82" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">"给模型看范文"</text>

  <circle cx="70" cy="292" r="3" fill="#546E7A"/>
  <text x="82" y="292" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">控制输出模式</text>

  <line x1="65" y1="315" x2="305" y2="315" stroke="#ECEFF1" stroke-width="1"/>
  <text x="65" y="335" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">核心手段</text>
  <text x="65" y="355" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="bold" fill="#546E7A">示例驱动 · 模式模仿</text>
  <text x="65" y="378" text-anchor="start" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">"告诉模型要什么样子"</text>
  <text x="65" y="415" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">代表</text>
  <text x="65" y="432" text-anchor="start" dominant-baseline="central" font-size="11" fill="#546E7A">In-Context Learning</text>

  <!-- ========== Stage 2: Chain-of-Thought (Blue) ========== -->
  <rect x="350" y="100" width="280" height="340" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M358,100 H622 Q630,100 630,108 V150 H350 V108 Q350,100 358,100Z" fill="#1E88E5"/>
  <text x="490" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#E3F2FD">阶段 2</text>
  <text x="490" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BBDEFB">2022</text>

  <text x="490" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#1E88E5">Chain-of-Thought</text>
  <text x="490" y="195" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#90A4AE">思维链推理</text>
  <line x1="370" y1="212" x2="610" y2="212" stroke="#E3F2FD" stroke-width="1"/>

  <circle cx="375" cy="238" r="3" fill="#1E88E5"/>
  <text x="387" y="238" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">Wei et al. 提出 CoT</text>

  <circle cx="375" cy="265" r="3" fill="#1E88E5"/>
  <text x="387" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">"设计思维链"</text>

  <circle cx="375" cy="292" r="3" fill="#1E88E5"/>
  <text x="387" y="292" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">控制思考过程</text>

  <line x1="370" y1="315" x2="610" y2="315" stroke="#E3F2FD" stroke-width="1"/>
  <text x="370" y="335" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">效果</text>
  <text x="370" y="355" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="bold" fill="#1E88E5">GSM8K: 17.9% → 58%</text>
  <text x="370" y="378" text-anchor="start" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">"Let's think step by step"</text>
  <text x="370" y="415" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">代表</text>
  <text x="370" y="432" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1E88E5">CoT · Zero-Shot-CoT</text>

  <!-- ========== Stage 3: ReAct & Tool-Using (Orange) ========== -->
  <rect x="655" y="100" width="280" height="340" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M663,100 H927 Q935,100 935,108 V150 H655 V108 Q655,100 663,100Z" fill="#F57C00"/>
  <text x="795" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#FFF3E0">阶段 3</text>
  <text x="795" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFE0B2">2023</text>

  <text x="795" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#F57C00">ReAct &amp; Tool-Using</text>
  <text x="795" y="195" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#90A4AE">推理 + 行动</text>
  <line x1="675" y1="212" x2="915" y2="212" stroke="#FFF3E0" stroke-width="1"/>

  <circle cx="680" cy="238" r="3" fill="#F57C00"/>
  <text x="692" y="238" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">Reasoning + Acting</text>

  <circle cx="680" cy="265" r="3" fill="#F57C00"/>
  <text x="692" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">"推理 + 行动"交替</text>

  <circle cx="680" cy="292" r="3" fill="#F57C00"/>
  <text x="692" y="292" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">控制工具调用</text>

  <line x1="675" y1="315" x2="915" y2="315" stroke="#FFF3E0" stroke-width="1"/>
  <text x="675" y="335" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">关键里程碑</text>
  <text x="675" y="355" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="bold" fill="#F57C00">Function Calling 标准化</text>
  <text x="675" y="378" text-anchor="start" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">"让模型调用外部能力"</text>
  <text x="675" y="415" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">代表</text>
  <text x="675" y="432" text-anchor="start" dominant-baseline="central" font-size="11" fill="#F57C00">ReAct · OpenAI Tools API</text>

  <!-- ========== Stage 4: Agentic Prompt (Green) ========== -->
  <rect x="960" y="100" width="280" height="340" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M968,100 H1232 Q1240,100 1240,108 V150 H960 V108 Q960,100 968,100Z" fill="#43A047"/>
  <text x="1100" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#E8F5E9">阶段 4</text>
  <text x="1100" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#C8E6C9">2024 — 2025</text>

  <text x="1100" y="175" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="bold" fill="#43A047">Agentic Prompt</text>
  <text x="1100" y="195" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#90A4AE">智能体提示工程</text>
  <line x1="980" y1="212" x2="1220" y2="212" stroke="#E8F5E9" stroke-width="1"/>

  <circle cx="985" cy="238" r="3" fill="#43A047"/>
  <text x="997" y="238" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">System Prompt 工程化</text>

  <circle cx="985" cy="265" r="3" fill="#43A047"/>
  <text x="997" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">"设计智能体行为"</text>

  <circle cx="985" cy="292" r="3" fill="#43A047"/>
  <text x="997" y="292" text-anchor="start" dominant-baseline="central" font-size="12" fill="#37474F">控制自主循环</text>

  <line x1="980" y1="315" x2="1220" y2="315" stroke="#E8F5E9" stroke-width="1"/>
  <text x="980" y="335" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">关键能力</text>
  <text x="980" y="355" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="bold" fill="#43A047">多 Agent 协作</text>
  <text x="980" y="378" text-anchor="start" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">"设计角色与协作流程"</text>
  <text x="980" y="415" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">代表</text>
  <text x="980" y="432" text-anchor="start" dominant-baseline="central" font-size="11" fill="#43A047">AutoGen · CrewAI · MetaGPT</text>

  <!-- ========== Dashed arrows between stages ========== -->
  <line x1="330" y1="270" x2="346" y2="270" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="338" y="255" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">演进</text>

  <line x1="635" y1="270" x2="651" y2="270" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="643" y="255" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">演进</text>

  <line x1="940" y1="270" x2="956" y2="270" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="948" y="255" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">演进</text>

  <!-- ========== Bottom timeline arrow ========== -->
  <line x1="60" y1="480" x2="1230" y2="480" stroke="#546E7A" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="185" cy="480" r="5" fill="#546E7A"/>
  <text x="185" y="500" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A" font-weight="600">2019</text>
  <circle cx="490" cy="480" r="5" fill="#1E88E5"/>
  <text x="490" y="500" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#1E88E5" font-weight="600">2022</text>
  <circle cx="795" cy="480" r="5" fill="#F57C00"/>
  <text x="795" y="500" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#F57C00" font-weight="600">2023</text>
  <circle cx="1100" cy="480" r="5" fill="#43A047"/>
  <text x="1100" y="500" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#43A047" font-weight="600">2024-2025</text>

  <!-- ========== Bottom summary ========== -->
  <rect x="45" y="520" width="1200" height="120" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="65" y="545" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">范式演进核心趋势：从写指令到设计思维框架</text>

  <circle cx="73" cy="575" r="3" fill="#546E7A"/>
  <text x="85" y="575" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">控制对象：输出模式 → 思考过程 → 工具调用 → 自主循环，控制粒度从文本到行为再到系统</text>

  <circle cx="73" cy="600" r="3" fill="#1E88E5"/>
  <text x="85" y="600" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">设计单位：单条指令 → 思维链条 → 工具编排 → 智能体行为协议，Prompt 从一次性输入演化为系统设计产物</text>

  <circle cx="73" cy="625" r="3" fill="#43A047"/>
  <text x="85" y="625" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">工程化程度：经验技巧 → 可复现方法 → 标准接口 → 多 Agent 协议，逐步具备工程化与可维护性</text>
</svg>
