  <line x1="808" y1="242" x2="808" y2="270" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="552" y1="320" x2="552" y2="348" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="680" y1="320" x2="680" y2="348" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="808" y1="320" x2="808" y2="348" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="552" y1="398" x2="552" y2="426" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="680" y1="398" x2="680" y2="426" stroke="#B0BEC5" stroke-width="1.2"/>
