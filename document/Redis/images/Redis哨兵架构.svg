<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="460" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <text x="460" y="44" text-anchor="middle" font-size="10.5" fill="#757575">哨兵之间自动发现：订阅主节点 __sentinel__:hello 频道，无需手工登记</text>

  <!-- 哨兵 -->
  <rect x="100" y="56" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="185" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S1</text>
  <text x="185" y="96" text-anchor="middle" font-size="10" fill="#888888">默认端口 26379</text>

  <rect x="375" y="56" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S2</text>
  <text x="460" y="96" text-anchor="middle" font-size="10" fill="#888888">默认端口 26379</text>

  <rect x="650" y="56" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="735" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S3</text>
  <text x="735" y="96" text-anchor="middle" font-size="10" fill="#888888">默认端口 26379</text>

  <!-- 哨兵互连 -->
  <line x1="270" y1="82" x2="372" y2="82" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="545" y1="82" x2="647" y2="82" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- 监控线 -->
  <line x1="190" y1="108" x2="430" y2="225" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="460" y1="108" x2="460" y2="225" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="730" y1="108" x2="490" y2="225" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="478" y="170" text-anchor="start" font-size="10" fill="#757575">持续监控（周期 PING）</text>

  <!-- 主节点 -->
  <rect x="370" y="228" width="180" height="56" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">主节点 M（读写）</text>
  <text x="460" y="270" text-anchor="middle" font-size="10.5" fill="#888888">端口 6379</text>

  <!-- 从节点 -->
  <rect x="100" y="376" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">从节点 R1（只读）</text>
  <text x="190" y="418" text-anchor="middle" font-size="10.5" fill="#888888">端口 6379</text>

  <rect x="640" y="376" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="730" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">从节点 R2（只读）</text>
  <text x="730" y="418" text-anchor="middle" font-size="10.5" fill="#888888">端口 6379</text>

  <!-- 复制箭头 -->
  <line x1="392" y1="284" x2="193" y2="373" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="528" y1="284" x2="727" y2="373" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="255" y="336" text-anchor="middle" font-size="10" fill="#757575">复制</text>
  <text x="665" y="336" text-anchor="middle" font-size="10" fill="#757575">复制</text>

  <text x="460" y="458" text-anchor="middle" font-size="10.5" fill="#757575">哨兵同时监控从节点；主节点故障时经多数派哨兵选出 Leader，执行故障转移</text>
</svg>
