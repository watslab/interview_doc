<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="400" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#1565C0" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">事务 AOP 代理调用机制</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">客户端调用经动态代理拦截，由事务拦截器编排开启、执行与提交 / 回滚</text>

  <!-- ============ 客户端 ============ -->
  <rect x="40" y="170" width="110" height="56" rx="6" fill="#FAFAFA" stroke="#455A64" stroke-width="1.5"/>
  <text x="95" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#37474F">客户端</text>

  <!-- ============ 代理层 ============ -->
  <rect x="200" y="110" width="220" height="176" rx="8" fill="#F4F9FE" stroke="#BBDEFB" stroke-width="1"/>
  <rect x="215" y="120" width="90" height="22" rx="11" fill="#1E88E5"/>
  <text x="260" y="131" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">代理层</text>
  <rect x="215" y="155" width="190" height="52" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="310" y="175" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">JDK 动态代理</text>
  <text x="310" y="193" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#78909C">实现接口 · InvocationHandler</text>
  <rect x="215" y="221" width="190" height="52" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="310" y="241" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">CGLib 代理</text>
  <text x="310" y="259" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#78909C">继承类 · MethodInterceptor</text>

  <!-- ============ TransactionInterceptor ============ -->
  <rect x="470" y="170" width="160" height="56" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" filter="url(#s1)"/>
  <text x="550" y="192" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#6A1B9A">TransactionInterceptor</text>
  <text x="550" y="210" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务拦截器</text>

  <!-- ============ 事务处理流程 ============ -->
  <rect x="680" y="100" width="250" height="280" rx="8" fill="#FFF9F2" stroke="#FFCC80" stroke-width="1"/>
  <rect x="695" y="110" width="120" height="22" rx="11" fill="#F57C00"/>
  <text x="755" y="121" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">事务处理流程</text>

  <rect x="695" y="146" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
  <text x="805" y="162" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">1. 开启事务</text>
  <rect x="695" y="206" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
  <text x="805" y="222" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">2. 执行目标方法</text>
  <rect x="695" y="266" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
  <text x="805" y="282" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">业务方法（目标对象）</text>
  <rect x="695" y="326" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
  <text x="805" y="342" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">3. 提交 / 回滚事务</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M152,198 L197,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M422,198 L467,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M632,198 L678,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M805,180 L805,204" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M805,240 L805,264" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M805,300 L805,324" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M693,342 C540,405 95,390 95,229" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ah)"/>

  <!-- ============ Annotations ============ -->
  <text x="174" y="184" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">方法调用</text>
  <text x="444" y="184" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">事务拦截</text>
  <text x="337" y="356" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">返回调用结果</text>
</svg>
