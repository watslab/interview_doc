<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1120" height="700" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="570" y="33" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#333">inode 机制与软硬链接关系</text>

  <!-- Column headers -->
  <text x="190" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">普通文件</text>
  <text x="570" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">硬链接（ln）</text>
  <text x="940" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">软链接（ln -s）</text>

  <!-- ============ Column 1: normal file ============ -->
  <rect x="110" y="80" width="160" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1565C0">file.txt</text>
  <line x1="190" y1="120" x2="190" y2="146" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="90" y="148" width="200" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="170" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#6A1B9A">inode #12345</text>
  <text x="190" y="190" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#8E24AA">元数据（权限/大小/时间）</text>
  <line x1="190" y1="212" x2="190" y2="238" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="110" y="240" width="160" height="46" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="263" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2E7D32">数据块</text>

  <!-- ============ Column 2: hard link ============ -->
  <rect x="410" y="80" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1565C0">file.txt</text>
  <rect x="590" y="80" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="660" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1565C0">hard.txt</text>
  <!-- converging connectors (bus) -->
  <line x1="480" y1="120" x2="480" y2="140" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="660" y1="120" x2="660" y2="140" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="480" y1="140" x2="660" y2="140" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="570" y1="140" x2="570" y2="154" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="450" y="156" width="240" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="570" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#6A1B9A">inode #12345</text>
  <text x="570" y="198" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#8E24AA">link count = 2（共享 inode）</text>
  <line x1="570" y1="220" x2="570" y2="246" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="470" y="248" width="200" height="46" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="570" y="271" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2E7D32">数据块（共享）</text>

  <!-- ============ Column 3: soft link ============ -->
  <rect x="860" y="80" width="160" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="940" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1565C0">soft.txt</text>
  <line x1="940" y1="120" x2="940" y2="146" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="840" y="148" width="200" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="940" y="170" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#6A1B9A">inode #67890</text>
  <text x="940" y="190" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#8E24AA">（独立 inode）</text>
  <line x1="940" y1="212" x2="940" y2="238" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="820" y="240" width="240" height="46" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="940" y="263" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">数据块：存储路径 "file.txt"</text>
  <line x1="940" y1="286" x2="940" y2="312" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="955" y="299" text-anchor="start" dominant-baseline="central" font-size="10" fill="#757575">指向</text>
  <rect x="840" y="314" width="200" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#s1)"/>
  <text x="940" y="336" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#6A1B9A">inode #12345</text>
  <text x="940" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#8E24AA">（目标 inode）</text>
  <line x1="940" y1="378" x2="940" y2="404" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="860" y="406" width="160" height="46" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="940" y="429" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2E7D32">数据块</text>

  <!-- Separator + table title -->
  <line x1="40" y1="470" x2="1100" y2="470" stroke="#E0E0E0" stroke-width="1"/>
  <text x="570" y="486" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#333">硬链接 vs 软链接 对比</text>

  <!-- ============ Comparison table ============ -->
  <!-- outer border -->
  <rect x="80" y="500" width="980" height="198" rx="6" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <!-- header row -->
  <path d="M86,500 H1054 Q1060,500 1060,506 V538 H80 V506 Q80,500 86,500Z" fill="#546E7A"/>
  <!-- column dividers -->
  <line x1="320" y1="500" x2="320" y2="698" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="690" y1="500" x2="690" y2="698" stroke="#B0BEC5" stroke-width="1"/>
  <!-- row dividers -->
  <line x1="80" y1="538" x2="1060" y2="538" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="80" y1="578" x2="1060" y2="578" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="80" y1="618" x2="1060" y2="618" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="80" y1="658" x2="1060" y2="658" stroke="#B0BEC5" stroke-width="1"/>

  <!-- header text -->
  <text x="200" y="519" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="white">对比项</text>
  <text x="505" y="519" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="white">硬链接（Hard Link）</text>
  <text x="875" y="519" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="white">软链接（Soft Link）</text>

  <!-- row 1 -->
  <text x="200" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">跨文件系统</text>
  <text x="505" y="558" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E53935">不支持（各文件系统 inode 表独立）</text>
  <text x="875" y="558" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#43A047">支持（仅存储路径字符串）</text>

  <!-- row 2 -->
  <text x="200" y="598" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">删除原文件</text>
  <text x="505" y="598" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#43A047">不影响（链接计数减 1，数据保留）</text>
  <text x="875" y="598" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E53935">链接失效（成为死链）</text>

  <!-- row 3 -->
  <text x="200" y="638" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">inode 号</text>
  <text x="505" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">与原文件相同</text>
  <text x="875" y="638" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">不同（拥有独立 inode）</text>

  <!-- row 4 -->
  <text x="200" y="678" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333">创建命令</text>
  <text x="505" y="678" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">ln 源文件 链接名</text>
  <text x="875" y="678" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">ln -s 源文件 链接名</text>
</svg>
