<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="640" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#1565C0" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Spring 事务管理架构</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">应用程序经代理拦截，由事务管理器接口委托具体实现完成事务控制</text>

  <!-- ============ Band 1: 应用程序 ============ -->
  <rect x="30" y="88" width="900" height="76" rx="8" fill="#F9F4FB" stroke="#E1BEE7" stroke-width="1"/>
  <rect x="50" y="98" width="100" height="24" rx="12" fill="#7B1FA2"/>
  <text x="100" y="110" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">应用程序</text>
  <rect x="340" y="104" width="280" height="46" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.8" filter="url(#s1)"/>
  <text x="480" y="127" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#6A1B9A">Service 层（@Transactional）</text>

  <!-- ============ Band 2: 代理机制 ============ -->
  <rect x="30" y="186" width="900" height="100" rx="8" fill="#F5F7F8" stroke="#CFD8DC" stroke-width="1"/>
  <rect x="50" y="196" width="100" height="24" rx="12" fill="#546E7A"/>
  <text x="100" y="208" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">代理机制</text>
  <rect x="190" y="218" width="250" height="52" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="315" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#37474F">JDK 动态代理</text>
  <text x="315" y="254" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">基于接口 · InvocationHandler</text>
  <rect x="520" y="218" width="250" height="52" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="645" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#37474F">CGLib 代理</text>
  <text x="645" y="254" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">基于继承 · MethodInterceptor</text>

  <!-- ============ Band 3: 核心 API ============ -->
  <rect x="30" y="308" width="900" height="110" rx="8" fill="#F4F9FE" stroke="#BBDEFB" stroke-width="1"/>
  <rect x="50" y="318" width="100" height="24" rx="12" fill="#1E88E5"/>
  <text x="100" y="330" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">核心 API</text>
  <rect x="100" y="344" width="220" height="56" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="210" y="364" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">TransactionDefinition</text>
  <text x="210" y="382" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务定义</text>
  <rect x="370" y="344" width="220" height="56" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2.2" filter="url(#s1)"/>
  <text x="480" y="364" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#1565C0">PlatformTransactionManager</text>
  <text x="480" y="382" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务管理器接口</text>
  <rect x="640" y="344" width="220" height="56" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="750" y="364" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">TransactionStatus</text>
  <text x="750" y="382" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">事务状态</text>

  <!-- ============ Band 4: 事务管理器实现 ============ -->
  <rect x="30" y="440" width="900" height="100" rx="8" fill="#F1F9F8" stroke="#B2DFDB" stroke-width="1"/>
  <rect x="50" y="450" width="130" height="24" rx="12" fill="#00897B"/>
  <text x="115" y="462" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">事务管理器实现</text>
  <rect x="90" y="476" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.5"/>
  <text x="210" y="495" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#00695C">DataSourceTransactionManager</text>
  <text x="210" y="512" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">JDBC / MyBatis</text>
  <rect x="360" y="476" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.5"/>
  <text x="480" y="495" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#00695C">JtaTransactionManager</text>
  <text x="480" y="512" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">分布式事务</text>
  <rect x="630" y="476" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.5"/>
  <text x="750" y="495" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#00695C">HibernateTransactionManager</text>
  <text x="750" y="512" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">Hibernate</text>

  <!-- ============ Band 5: 数据源 ============ -->
  <rect x="30" y="562" width="900" height="76" rx="8" fill="#F4FAF5" stroke="#C8E6C9" stroke-width="1"/>
  <rect x="50" y="572" width="90" height="24" rx="12" fill="#43A047"/>
  <text x="95" y="584" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">数据源</text>
  <rect x="360" y="576" width="240" height="46" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.8"/>
  <text x="480" y="599" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#2E7D32">数据库连接（Connection）</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M480,152 L480,184" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,272 L480,306" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,402 L480,438" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,530 L480,560" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M368,372 L322,372" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M592,372 L638,372" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- ============ Annotations ============ -->
  <text x="492" y="170" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">方法调用</text>
  <text x="492" y="292" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">事务拦截</text>
  <text x="492" y="422" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">委托具体实现</text>
  <text x="492" y="548" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">获取连接</text>
  <text x="345" y="336" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">读取事务定义</text>
  <text x="615" y="336" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">返回事务状态</text>
</svg>
