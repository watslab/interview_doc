<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 413" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="393" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 左侧：docker-compose.yml 定义文件 -->
  <rect x="30" y="30" width="290" height="320" rx="10" fill="#F9F3FC" stroke="#7B1FA2" stroke-width="1.2" filter="url(#s1)"/>
  <text x="175" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A1B9A">docker-compose.yml</text>
  <g font-family="Consolas,'Courier New',monospace" font-size="11" fill="#4527A0">
    <text x="46" y="105">services:</text>
    <text x="64" y="123">web:</text>
    <text x="82" y="141">image: nginx</text>
    <text x="82" y="159">deploy:</text>
    <text x="100" y="177">replicas: 3</text>
    <text x="64" y="195">db:</text>
    <text x="82" y="213">image: mysql</text>
    <text x="82" y="231">deploy:</text>
    <text x="100" y="249">replicas: 1</text>
    <text x="64" y="267">redis:</text>
    <text x="82" y="285">image: redis</text>
    <text x="82" y="303">deploy:</text>
    <text x="100" y="321">replicas: 2</text>
  </g>

  <!-- 中部：部署命令 -->
  <rect x="380" y="158" width="200" height="64" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="184" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#283593">docker stack deploy</text>
  <text x="480" y="204" text-anchor="middle" font-size="9.5" fill="#5C6BC0">部署命令</text>

  <!-- 右侧：myapp Stack 与其中的 Service -->
  <rect x="640" y="30" width="290" height="320" rx="10" fill="#F3F8FE" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="785" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">myapp Stack</text>

  <rect x="670" y="96" width="230" height="56" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="785" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">web Service</text>
  <text x="785" y="138" text-anchor="middle" font-size="9.5" fill="#546E7A">3 副本</text>

  <rect x="670" y="182" width="230" height="56" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="785" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">db Service</text>
  <text x="785" y="224" text-anchor="middle" font-size="9.5" fill="#546E7A">1 副本</text>

  <rect x="670" y="268" width="230" height="56" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="785" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">redis Service</text>
  <text x="785" y="310" text-anchor="middle" font-size="9.5" fill="#546E7A">2 副本</text>

  <!-- 连接箭头（最后绘制，保证置于顶层） -->
  <line x1="321" y1="190" x2="379" y2="190" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="581" y1="190" x2="639" y2="190" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="480" y="380" text-anchor="middle" font-size="10.5" fill="#757575">一份 docker-compose.yml 经 docker stack deploy 部署为一个 Stack，文件中每个 services 条目对应一个 Service，deploy.replicas 指定其副本数</text>
</svg>
