<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#C62828"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2E7D32"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1565C0"/></marker>
  </defs>

  <rect x="10" y="10" width="840" height="520" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 左侧面板：Dockerfile 指令序列 -->
  <rect x="40" y="70" width="300" height="420" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M52,70 H328 Q340,70 340,82 V104 H40 V82 Q40,70 52,70 Z" fill="#1565C0"/>
  <text x="190" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Dockerfile</text>

  <rect x="60" y="117" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="136" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">FROM</tspan><tspan fill="#333333"> ubuntu:22.04</tspan></text>
  <text x="190" y="156" text-anchor="middle" font-size="10" fill="#888888">基础镜像</text>

  <rect x="60" y="179" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="198" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">RUN</tspan><tspan fill="#333333"> apt-get update</tspan></text>
  <text x="190" y="218" text-anchor="middle" font-size="10" fill="#888888">更新软件源索引</text>

  <rect x="60" y="241" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="260" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">RUN</tspan><tspan fill="#333333"> apt-get install -y python3</tspan></text>
  <text x="190" y="280" text-anchor="middle" font-size="10" fill="#888888">安装 Python3</text>

  <rect x="60" y="303" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="322" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">COPY</tspan><tspan fill="#333333"> . /app</tspan></text>
  <text x="190" y="342" text-anchor="middle" font-size="10" fill="#888888">复制项目文件</text>

  <rect x="60" y="365" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="384" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">RUN</tspan><tspan fill="#333333"> pip install -r requirements.txt</tspan></text>
  <text x="190" y="404" text-anchor="middle" font-size="10" fill="#888888">安装 Python 依赖</text>

  <rect x="60" y="427" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.2" filter="url(#s1)"/>
  <text x="190" y="446" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#1565C0" font-weight="700">CMD</tspan><tspan fill="#333333"> python3 app.py</tspan></text>
  <text x="190" y="466" text-anchor="middle" font-size="10" fill="#888888">容器启动命令</text>

  <!-- 右侧面板：缓存检查流程 -->
  <rect x="460" y="70" width="360" height="420" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M472,70 H808 Q820,70 820,82 V104 H460 V82 Q460,70 472,70 Z" fill="#2E7D32"/>
  <text x="640" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">缓存检查流程</text>

  <rect x="540" y="144" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="640" y="159" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">检查<tspan fill="#2E7D32" font-weight="700">基础镜像</tspan>缓存</text>
  <text x="640" y="177" text-anchor="middle" font-size="10" fill="#888888">基础镜像 ID 是否相同</text>

  <rect x="540" y="229" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="640" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">检查 <tspan fill="#2E7D32" font-weight="700">RUN</tspan> 指令缓存</text>
  <text x="640" y="262" text-anchor="middle" font-size="10" fill="#888888">命令字符串是否相同</text>

  <rect x="540" y="314" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="640" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">检查 <tspan fill="#2E7D32" font-weight="700">COPY</tspan> 文件变化</text>
  <text x="640" y="347" text-anchor="middle" font-size="10" fill="#888888">源文件 checksum 是否相同</text>

  <rect x="480" y="410" width="150" height="40" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="555" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#C62828">缓存失效</text>
  <text x="555" y="443" text-anchor="middle" font-size="10" fill="#888888">重新构建该层及后续层</text>

  <rect x="650" y="410" width="150" height="40" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="725" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">使用缓存</text>
  <text x="725" y="443" text-anchor="middle" font-size="10" fill="#888888">指令与输入均未变化</text>

  <!-- 面板级衔接：Dockerfile 整体 → 缓存检查流程整体 -->
  <path d="M341,280 L445,280" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ahb)"/>
  <text x="393" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#1565C0">构建时逐条指令检查</text>

  <!-- 连接线（最后绘制，保证在最上层） -->
  <line x1="640" y1="184" x2="640" y2="228" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="640" y1="269" x2="640" y2="313" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M640,354 C640,372 555,376 555,394 L555,409" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#ahr)"/>
  <path d="M640,354 C640,372 725,376 725,394 L725,409" fill="none" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#ahg)"/>

  <text x="548" y="378" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C62828">文件变化</text>
  <text x="732" y="378" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E7D32">文件未变</text>
</svg>
