<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow2"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="680" height="440" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#263238">CI / CD 工具全景</text>

  <!-- Column 1: CI 引擎 (blue) -->
  <rect x="30" y="68" width="190" height="360" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#shadow2)"/>
  <path d="M38,68 H212 Q220,68 220,76 V108 H30 V76 Q30,68 38,68 Z" fill="#1E88E5"/>
  <text x="125" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">CI 引擎</text>

  <!-- Column 2: CD 工具 (green) -->
  <rect x="255" y="68" width="190" height="360" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#shadow2)"/>
  <path d="M263,68 H437 Q445,68 445,76 V108 H255 V76 Q255,68 263,68 Z" fill="#43A047"/>
  <text x="350" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">CD 工具</text>

  <!-- Column 3: 一体化平台 (purple) -->
  <rect x="480" y="68" width="190" height="360" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#shadow2)"/>
  <path d="M488,68 H662 Q670,68 670,76 V108 H480 V76 Q480,68 488,68 Z" fill="#7B1FA2"/>
  <text x="575" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">一体化平台</text>

  <!-- CI 引擎 tool cards (6 cards) -->
  <rect x="40" y="115" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="131" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Jenkins</text>
  <text x="125" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">插件生态丰富</text>

  <rect x="40" y="167" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="183" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">GitHub Actions</text>
  <text x="125" y="199" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">GitHub 原生集成</text>

  <rect x="40" y="219" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">GitLab CI</text>
  <text x="125" y="251" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">内建于 GitLab 平台</text>

  <rect x="40" y="271" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Tekton</text>
  <text x="125" y="303" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">Kubernetes 原生</text>

  <rect x="40" y="323" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">CircleCI</text>
  <text x="125" y="355" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">云原生 SaaS</text>

  <rect x="40" y="375" width="170" height="46" rx="4" fill="#F5F9FF" stroke="#64B5F6" stroke-width="1"/>
  <text x="125" y="391" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Drone</text>
  <text x="125" y="407" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">轻量级，容器原生</text>

  <!-- CD 工具 tool cards (3 cards, centered) -->
  <rect x="265" y="181" width="170" height="50" rx="4" fill="#F1F8F2" stroke="#66BB6A" stroke-width="1"/>
  <text x="350" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2E7D32">ArgoCD</text>
  <text x="350" y="215" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">GitOps 持续部署</text>

  <rect x="265" y="243" width="170" height="50" rx="4" fill="#F1F8F2" stroke="#66BB6A" stroke-width="1"/>
  <text x="350" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2E7D32">Flux</text>
  <text x="350" y="277" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">GitOps 自动化</text>

  <rect x="265" y="305" width="170" height="50" rx="4" fill="#F1F8F2" stroke="#66BB6A" stroke-width="1"/>
  <text x="350" y="322" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2E7D32">Spinnaker</text>
  <text x="350" y="339" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">多云持续交付</text>

  <!-- 一体化平台 tool cards (1 card, centered) -->
  <rect x="490" y="243" width="170" height="50" rx="4" fill="#FAF4FC" stroke="#AB47BC" stroke-width="1"/>
  <text x="575" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#6A1B9A">Azure DevOps</text>
  <text x="575" y="277" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">微软一体化平台</text>
</svg>
