<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="540" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H938 Q950,10 950,22 V50 H10 Z" fill="#37474F"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">UDP 与 TCP 首部对比</text>

  <!-- Section labels -->
  <rect x="40" y="70" width="200" height="30" rx="4" fill="#1B5E20"/>
  <text x="140" y="85" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">UDP 首部（8 字节）</text>

  <rect x="500" y="70" width="420" height="30" rx="4" fill="#1565C0"/>
  <text x="710" y="85" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">TCP 首部（20 字节起，RFC 9293）</text>

  <!-- UDP Header (8 bytes) -->
  <!-- Row 1: Source Port (16) | Destination Port (16) -->
  <rect x="40" y="110" width="100" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="90" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Source Port</text>
  <text x="90" y="148" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="140" y="110" width="100" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Dest Port</text>
  <text x="190" y="148" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- Row 2: Length (16) | Checksum (16) -->
  <rect x="40" y="154" width="100" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="90" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Length</text>
  <text x="90" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="140" y="154" width="100" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Checksum</text>
  <text x="190" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- UDP note -->
  <rect x="40" y="208" width="200" height="36" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="140" y="226" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">总计 8 字节，固定长度</text>

  <!-- UDP field details -->
  <rect x="40" y="254" width="200" height="28" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="140" y="268" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">字段说明</text>

  <rect x="40" y="282" width="200" height="24" rx="4" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="50" y="294" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">Source Port: 源端口（可选，全 0）</text>

  <rect x="40" y="306" width="200" height="24" rx="4" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="50" y="318" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">Dest Port: 目的端口</text>

  <rect x="40" y="330" width="200" height="24" rx="4" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="50" y="342" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">Length: UDP 长度（首部+数据）</text>

  <rect x="40" y="354" width="200" height="24" rx="4" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="50" y="366" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">Checksum: 校验和（IPv4 可选）</text>

  <!-- TCP Header (20 bytes minimum) -->
  <!-- Row 1: Source Port (16) | Destination Port (16) -->
  <rect x="500" y="110" width="210" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1565C0">Source Port（16 位）</text>

  <rect x="710" y="110" width="210" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1565C0">Dest Port（16 位）</text>

  <!-- Row 2: Sequence Number (32) -->
  <rect x="500" y="154" width="420" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="710" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Sequence Number（32 位）</text>

  <!-- Row 3: Acknowledgment Number (32) -->
  <rect x="500" y="198" width="420" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="710" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Acknowledgment Number（32 位）</text>

  <!-- Row 4: Data Offset(4)+Reserved(3)+Flags(9) | Window(16) -->
  <rect x="500" y="242" width="210" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="260" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Data Offset(4)+Reserved+Flags</text>
  <text x="605" y="276" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="710" y="242" width="210" height="44" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="260" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#4A148C">Window Size（16 位）</text>

  <!-- Row 5: Checksum(16) | Urgent Pointer(16) -->
  <rect x="500" y="286" width="210" height="44" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="308" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#B71C1C">Checksum（16 位）</text>

  <rect x="710" y="286" width="210" height="44" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="308" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#B71C1C">Urgent Pointer（16 位）</text>

  <!-- Row 6: Options (variable) -->
  <rect x="500" y="330" width="420" height="44" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="710" y="352" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#37474F">Options（可选，0~40 字节，需 4 字节对齐）</text>

  <!-- TCP flags detail -->
  <rect x="500" y="384" width="420" height="120" rx="4" fill="#FFFFFF" stroke="#F57C00" stroke-width="1"/>
  <text x="710" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">TCP 标志位（9 位）</text>

  <rect x="510" y="410" width="40" height="28" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="530" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">NS</text>

  <rect x="555" y="410" width="40" height="28" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="575" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">CWR</text>

  <rect x="600" y="410" width="40" height="28" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="620" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">ECE</text>

  <rect x="645" y="410" width="40" height="28" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="665" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">URG</text>

  <rect x="690" y="410" width="40" height="28" rx="3" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="710" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#B71C1C">ACK</text>

  <rect x="735" y="410" width="40" height="28" rx="3" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="755" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#B71C1C">PSH</text>

  <rect x="780" y="410" width="40" height="28" rx="3" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="800" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#B71C1C">RST</text>

  <rect x="825" y="410" width="40" height="28" rx="3" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="845" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#B71C1C">SYN</text>

  <rect x="870" y="410" width="40" height="28" rx="3" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="890" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#B71C1C">FIN</text>

  <text x="710" y="455" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#333">SYN: 同步序号  ACK: 确认号有效  FIN: 关闭连接</text>
  <text x="710" y="473" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#333">RST: 重置连接  PSH: 立即推送  URG: 紧急指针有效</text>
  <text x="710" y="491" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#333">ECE/CWR: ECN 拥塞通知  NS: ECN Nonce</text>

  <!-- Comparison summary at bottom -->
  <rect x="270" y="384" width="220" height="60" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="380" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#5D4037">核心差异</text>
  <text x="380" y="418" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">UDP: 8 字节，无连接，不可靠</text>
  <text x="380" y="434" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">TCP: 20+ 字节，面向连接，可靠</text>
</svg>
