<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="316" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 容器网络命名空间 -->
  <rect x="280" y="64" width="400" height="208" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="295" y="92" text-anchor="start" font-size="12" font-weight="600" fill="#B71C1C">容器网络命名空间</text>

  <rect x="340" y="116" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">应用进程</text>

  <rect x="340" y="200" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">lo · 仅回环接口</text>
  <text x="480" y="240" text-anchor="middle" font-size="10" fill="#666666">127.0.0.1</text>

  <!-- 连接箭头 -->
  <line x1="480" y1="168" x2="480" y2="200" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="480" y="302" text-anchor="middle" font-size="10.5" fill="#757575">容器仅保留回环接口，无法与容器外通信；需手动添加网卡并配置 IP 后才能联网</text>
</svg>
