  <text x="195" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#FFFFFF">场景一 · ClusterIP（集群内访问）</text>

  <rect x="60" y="165" width="130" height="50" rx="6" fill="#FAFAFA" stroke="#455A64" stroke-width="1.5"/>
  <text x="125" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">集群内客户端</text>

  <rect x="235" y="165" width="175" height="50" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.8" filter="url(#s1)"/>
  <text x="323" y="182" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">Service · ClusterIP</text>
  <text x="323" y="198" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#546E7A">10.96.x.x : Port</text>

