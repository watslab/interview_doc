<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="740" height="430" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- ===== 调度约束类型（左） ===== -->
  <rect x="55" y="60" width="230" height="330" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="71" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#0D47A1">调度约束类型</text>

  <rect x="75" y="108" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="170" y="131.1" text-anchor="middle" font-size="11.5" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#0D47A1">node.id</text>
  <text x="170" y="144.8" text-anchor="middle" font-size="10.5" fill="#546E7A">指定节点 ID</text>

  <rect x="75" y="178" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="170" y="201.1" text-anchor="middle" font-size="11.5" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#0D47A1">node.hostname</text>
  <text x="170" y="214.8" text-anchor="middle" font-size="10.5" fill="#546E7A">指定主机名</text>

  <rect x="75" y="248" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="170" y="271.1" text-anchor="middle" font-size="11.5" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#0D47A1">node.labels</text>
  <text x="170" y="284.8" text-anchor="middle" font-size="10.5" fill="#546E7A">节点标签</text>

  <rect x="75" y="318" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="170" y="341.1" text-anchor="middle" font-size="11.5" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#0D47A1">engine.labels</text>
  <text x="170" y="354.8" text-anchor="middle" font-size="10.5" fill="#546E7A">引擎标签</text>

  <!-- ===== 示例（右，与左面板等高、节奏对齐） ===== -->
  <rect x="365" y="60" width="340" height="330" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="381" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#1B5E20">示例</text>

  <rect x="385" y="108" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="535" y="131" text-anchor="middle" font-size="11" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#1B5E20">--constraint 'node.role==worker'</text>
  <text x="535" y="144.8" text-anchor="middle" font-size="10.5" fill="#546E7A">只在 Worker 节点运行</text>

  <rect x="385" y="178" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="535" y="201" text-anchor="middle" font-size="11" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#1B5E20">--constraint 'node.labels.zone==us-east'</text>
  <text x="535" y="214.8" text-anchor="middle" font-size="10.5" fill="#546E7A">在特定区域运行</text>

  <rect x="385" y="248" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="535" y="271" text-anchor="middle" font-size="11" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#1B5E20">--constraint 'node.hostname!=node1'</text>
  <text x="535" y="284.8" text-anchor="middle" font-size="10.5" fill="#546E7A">排除特定节点</text>

  <rect x="385" y="318" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="535" y="341" text-anchor="middle" font-size="11" font-weight="600" font-family="Consolas,'Courier New',monospace" fill="#1B5E20">--constraint 'engine.labels.disk==ssd'</text>
  <text x="535" y="354.8" text-anchor="middle" font-size="10.5" fill="#546E7A">在配备 SSD 的节点运行</text>

  <!-- ===== 面板间转换箭头（最后绘制，保证置于顶层） ===== -->
  <line x1="285.75" y1="225" x2="364.25" y2="225" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="380" y="418.8" text-anchor="middle" font-size="10.5" fill="#757575">左侧为可用的调度约束属性，右侧为对应的 --constraint 表达式示例</text>
</svg>
