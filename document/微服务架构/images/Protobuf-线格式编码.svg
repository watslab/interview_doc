<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1180" height="700" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="#263238">Protobuf 线格式编码：标签-值结构</text>
  <text x="600" y="80" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78909C">示例：契约字段 int32 a = 1，赋值 a = 150，编码结果为 3 个字节</text>

  <!-- Source message box -->
  <rect x="380" y="105" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="600" y="126" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#37474F" font-family="Consolas,monospace">契约：int32 a = 1;</text>
  <text x="600" y="148" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#37474F" font-family="Consolas,monospace">赋值：a = 150</text>

  <!-- arrow down: serialize -->
  <line x1="600" y1="169" x2="600" y2="224" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="612" y="196" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#78909C">序列化</text>

  <!-- Encoded byte strip -->
  <rect x="476" y="225" width="72" height="60" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="512" y="247" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">08</text>
  <text x="512" y="267" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">标签</text>
  <rect x="564" y="225" width="72" height="60" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="600" y="247" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">96</text>
  <text x="600" y="267" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">varint</text>
  <rect x="652" y="225" width="72" height="60" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="688" y="247" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">01</text>
  <text x="688" y="267" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">varint</text>

  <!-- brackets under byte strip -->
  <line x1="476" y1="312" x2="548" y2="312" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="476" y1="312" x2="476" y2="306" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="548" y1="312" x2="548" y2="306" stroke="#1565C0" stroke-width="1.5"/>
  <text x="512" y="330" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#1565C0">标签</text>
  <line x1="564" y1="312" x2="724" y2="312" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="564" y1="312" x2="564" y2="306" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="724" y1="312" x2="724" y2="306" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="644" y="330" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#2E7D32">varint(150)</text>

  <!-- solid leader curves to anatomy panels -->
  <path d="M512,338 C474,378 356,371 322,388 L310,394" fill="none" stroke="#B0BEC5" stroke-width="1.2" marker-end="url(#ah)"/>
  <path d="M644,338 C682,378 844,371 878,388 L890,394" fill="none" stroke="#B0BEC5" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- Left panel: tag byte anatomy (shifted down 35 via group transform) -->
  <g transform="translate(0 35)">
  <rect x="60" y="360" width="500" height="280" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,360 H552 Q560,360 560,368 V400 H60 V368 Q60,360 68,360Z" fill="#1E88E5"/>
  <text x="310" y="380" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#FFFFFF">标签字节 0x08 的构成</text>

  <!-- bit cells: field number (5 bits) + wire type (3 bits) -->
  <rect x="203" y="425" width="24" height="32" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="215" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">0</text>
  <rect x="229" y="425" width="24" height="32" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="241" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">0</text>
  <rect x="255" y="425" width="24" height="32" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="267" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">0</text>
  <rect x="281" y="425" width="24" height="32" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="293" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">0</text>
  <rect x="307" y="425" width="24" height="32" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="319" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">1</text>
  <rect x="341" y="425" width="24" height="32" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="353" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E65100" font-family="Consolas,monospace">0</text>
  <rect x="367" y="425" width="24" height="32" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="379" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E65100" font-family="Consolas,monospace">0</text>
  <rect x="393" y="425" width="24" height="32" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="405" y="441" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E65100" font-family="Consolas,monospace">0</text>

  <!-- brackets under bit groups -->
  <line x1="203" y1="468" x2="331" y2="468" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="203" y1="468" x2="203" y2="462" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="331" y1="468" x2="331" y2="462" stroke="#1565C0" stroke-width="1.5"/>
  <text x="267" y="486" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#1565C0">字段编号 = 1</text>
  <line x1="341" y1="468" x2="417" y2="468" stroke="#E65100" stroke-width="1.5"/>
  <line x1="341" y1="468" x2="341" y2="462" stroke="#E65100" stroke-width="1.5"/>
  <line x1="417" y1="468" x2="417" y2="462" stroke="#E65100" stroke-width="1.5"/>
  <text x="379" y="486" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#E65100">线类型 = 0</text>

  <text x="310" y="514" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#78909C">线类型 0 表示 varint 编码</text>

  <!-- formula box -->
  <rect x="110" y="535" width="400" height="70" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="310" y="557" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#37474F" font-family="Consolas,monospace">标签 = (字段编号 &lt;&lt; 3) | 线类型</text>
  <text x="310" y="583" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0" font-family="Consolas,monospace">= (1 &lt;&lt; 3) | 0 = 0x08</text>
  </g>

  <!-- Right panel: varint anatomy (shifted down 35 via group transform) -->
  <g transform="translate(0 35)">
  <rect x="640" y="360" width="500" height="280" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M648,360 H1132 Q1140,360 1140,368 V400 H640 V368 Q640,360 648,360Z" fill="#43A047"/>
  <text x="890" y="380" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#FFFFFF">值字节 96 01：varint 编码</text>

  <!-- Bit-anatomy rows: shifted +54 to center within panel -->
  <g transform="translate(54 0)">
  <!-- Row 1: 0x96 -->
  <text x="668" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0x96</text>
  <rect x="740" y="415" width="24" height="32" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="752" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E65100" font-family="Consolas,monospace">1</text>
  <rect x="772" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="784" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="798" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="810" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="824" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="836" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">1</text>
  <rect x="850" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="862" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="876" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="888" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">1</text>
  <rect x="902" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="914" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">1</text>
  <rect x="928" y="415" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="940" y="431" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <text x="962" y="425" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#E65100">MSB = 1</text>
  <text x="962" y="441" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#78909C">后续还有字节</text>
  <line x1="740" y1="457" x2="764" y2="457" stroke="#E65100" stroke-width="1.5"/>
  <text x="752" y="473" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#E65100">连续位</text>
  <line x1="772" y1="457" x2="952" y2="457" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="862" y="473" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#2E7D32">有效 7 位（低位组）</text>

  <!-- Row 2: 0x01 -->
  <text x="668" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0x01</text>
  <rect x="740" y="505" width="24" height="32" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1"/>
  <text x="752" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#546E7A" font-family="Consolas,monospace">0</text>
  <rect x="772" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="784" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="798" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="810" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="824" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="836" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="850" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="862" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="876" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="888" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="902" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="914" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">0</text>
  <rect x="928" y="505" width="24" height="32" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="940" y="521" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">1</text>
  <text x="962" y="515" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#546E7A">MSB = 0</text>
  <text x="962" y="531" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#78909C">字节序列结束</text>
  <line x1="740" y1="547" x2="764" y2="547" stroke="#546E7A" stroke-width="1.5"/>
  <text x="752" y="563" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#546E7A">连续位</text>
  <line x1="772" y1="547" x2="952" y2="547" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="862" y="563" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#2E7D32">有效 7 位（高位组）</text>
  </g>

  <!-- reassembly -->
  <line x1="660" y1="582" x2="1120" y2="582" stroke="#ECEFF1" stroke-width="1"/>
  <text x="890" y="602" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#37474F" font-family="Consolas,monospace">拼接（高位组在前）：0000001 0010110</text>
  <text x="890" y="624" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#2E7D32" font-family="Consolas,monospace">→ 10010110₂ = 150</text>
  </g>
</svg>
