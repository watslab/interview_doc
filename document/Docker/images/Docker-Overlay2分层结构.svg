<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="440" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 层叠堆栈 -->
  <rect x="300" y="60" width="320" height="58" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="85" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Merged Dir（合并视图）</text>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="#888888">容器看到的完整文件系统</text>

  <rect x="300" y="130" width="320" height="58" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Upper Dir（可写层）</text>
  <text x="460" y="175" text-anchor="middle" font-size="10" fill="#888888">容器运行时的所有修改</text>

  <rect x="300" y="200" width="320" height="58" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Lower Dir 3（只读）</text>
  <text x="460" y="245" text-anchor="middle" font-size="10" fill="#888888">应用层</text>

  <rect x="300" y="270" width="320" height="58" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="295" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Lower Dir 2（只读）</text>
  <text x="460" y="315" text-anchor="middle" font-size="10" fill="#888888">依赖层</text>

  <rect x="300" y="340" width="320" height="58" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="365" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Lower Dir 1（只读）</text>
  <text x="460" y="385" text-anchor="middle" font-size="10" fill="#888888">基础镜像层</text>

  <!-- 层间连接 -->
  <line x1="460" y1="118" x2="460" y2="127" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="460" y1="188" x2="460" y2="197" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="460" y1="258" x2="460" y2="267" stroke="#B0BEC5" stroke-width="1.2"/>
  <line x1="460" y1="328" x2="460" y2="337" stroke="#B0BEC5" stroke-width="1.2"/>

  <!-- 联合挂载方向 -->
  <line x1="655" y1="398" x2="655" y2="64" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="655" y="46" text-anchor="middle" font-size="10.5" fill="#757575">联合挂载</text>

  <!-- Work Dir：OverlayFS 内部目录，参与挂载机制但不属于堆叠层 -->
  <line x1="657" y1="159" x2="688" y2="159" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="690" y="130" width="200" height="58" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#s1)"/>
  <text x="790" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Work Dir</text>
  <text x="790" y="175" text-anchor="middle" font-size="10" fill="#888888">OverlayFS 内部使用</text>

  <!-- 左侧属性标注 -->
  <text x="280" y="93" text-anchor="end" font-size="10.5" font-weight="600" fill="#2E7D32">统一视图</text>
  <text x="280" y="163" text-anchor="end" font-size="10.5" font-weight="600" fill="#EF6C00">读写</text>
  <text x="280" y="303" text-anchor="end" font-size="10.5" font-weight="600" fill="#1565C0">只读 | 镜像层</text>
  <line x1="288" y1="60" x2="288" y2="118" stroke="#2E7D32" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="288" y1="130" x2="288" y2="188" stroke="#EF6C00" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="288" y1="200" x2="288" y2="398" stroke="#1565C0" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="460" y="428" text-anchor="middle" font-size="10.5" fill="#757575">写时复制（CoW）：修改 Lower 层文件时，先将该文件复制到 Upper Dir，再在 Upper Dir 中修改</text>
</svg>
