<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 618" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1060" height="598" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H1058 Q1070,10 1070,22 V50 H10 Z" fill="#37474F"/>
  <text x="540" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">IPv4 首部结构（RFC 791）</text>

  <!-- Bit position scale (30px per bit) -->
  <text x="60" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="180" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">4</text>
  <text x="300" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">8</text>
  <text x="540" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">16</text>
  <text x="1020" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">31</text>
  <line x1="60" y1="80" x2="60" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="180" y1="80" x2="180" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="300" y1="80" x2="300" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="540" y1="80" x2="540" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="1020" y1="80" x2="1020" y2="87" stroke="#90A4AE" stroke-width="0.5"/>

  <!-- Row 1: Version(4) | IHL(4) | DSCP(6) | ECN(2) | Total Length(16) -->
  <rect x="60" y="87" width="120" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="120" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Version（4 位）</text>

  <rect x="180" y="87" width="120" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="240" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">IHL（4 位）</text>

  <rect x="300" y="87" width="180" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="390" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">DSCP（6 位）</text>

  <rect x="480" y="87" width="60" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="510" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">ECN</text>
  <text x="510" y="118" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#E65100">2 位</text>

  <rect x="540" y="87" width="480" height="44" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="780" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#4A148C">Total Length（16 位）</text>

  <!-- Row 2: Identification(16) | Flags(3) | Fragment Offset(13) -->
  <rect x="60" y="131" width="480" height="44" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="300" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">Identification（16 位）</text>

  <rect x="540" y="131" width="90" height="44" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#s1)"/>
  <text x="585" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#B71C1C">Flags（3 位）</text>

  <rect x="630" y="131" width="390" height="44" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#s1)"/>
  <text x="825" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#B71C1C">Fragment Offset（13 位）</text>

  <!-- Row 3: TTL(8) | Protocol(8) | Header Checksum(16) -->
  <rect x="60" y="175" width="240" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="180" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">TTL（8 位）</text>

  <rect x="300" y="175" width="240" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="420" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">Protocol（8 位）</text>

  <rect x="540" y="175" width="480" height="44" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="780" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#4A148C">Header Checksum（16 位）</text>

  <!-- Row 4: Source Address (32) -->
  <rect x="60" y="219" width="960" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="540" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Source Address（32 位）</text>

  <!-- Row 5: Destination Address (32) -->
  <rect x="60" y="263" width="960" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="540" y="285" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Destination Address（32 位）</text>

  <!-- Row 6: Options (variable, 0~40 bytes) -->
  <rect x="60" y="307" width="960" height="44" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="540" y="329" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">Options（可选，0~40 字节，IHL 决定实际长度）</text>

  <!-- Separator -->
  <line x1="60" y1="371" x2="1020" y2="371" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Field detail table title -->
  <text x="540" y="392" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#37474F">关键字段说明</text>

  <!-- Detail rows -->
  <rect x="60" y="407" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="407" width="160" height="30" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="140" y="422" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1565C0">Version</text>
  <text x="240" y="422" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">IP 协议版本，IPv4 固定为 4</text>

  <rect x="60" y="437" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="437" width="160" height="30" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="140" y="452" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">IHL</text>
  <text x="240" y="452" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">首部长度，单位 4 字节；最小 5（20 字节），最大 15（60 字节）</text>

  <rect x="60" y="467" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="467" width="160" height="30" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="140" y="482" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">DSCP + ECN</text>
  <text x="240" y="482" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">DSCP 区分服务优先级；ECN 显式拥塞通知（RFC 3168）</text>

  <rect x="60" y="497" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="497" width="160" height="30" rx="4" fill="#FFEBEE" stroke="#E53935" stroke-width="1"/>
  <text x="140" y="512" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#B71C1C">Flags + Offset</text>
  <text x="240" y="512" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">MF/DF/保留位 + 分片偏移，支持大于 MTU 的报文分片重组</text>

  <rect x="60" y="527" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="527" width="160" height="30" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="140" y="542" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">TTL</text>
  <text x="240" y="542" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">生存时间，每经过一跳减 1，为 0 时丢弃，防止环路</text>

  <rect x="60" y="557" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="557" width="160" height="30" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="140" y="572" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Protocol</text>
  <text x="240" y="572" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">上层协议号：6=TCP, 17=UDP, 1=ICMP, 89=OSPF</text>
</svg>
