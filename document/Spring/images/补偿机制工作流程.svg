<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="580" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#43A047" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">补偿机制工作流程</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">业务失败记录补偿日志，由定时任务重试保证最终一致性</text>

  <!-- ============ 左：业务处理流程 ============ -->
  <rect x="30" y="90" width="390" height="470" rx="8" fill="#F4F9FE" stroke="#BBDEFB" stroke-width="1"/>
  <rect x="45" y="100" width="120" height="24" rx="12" fill="#1E88E5"/>
  <text x="105" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">业务处理流程</text>

  <rect x="140" y="148" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="225" y="168" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">创建订单</text>

  <polygon points="225,216 272,250 225,284 178,250" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="225" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">是否成功?</text>

  <rect x="312" y="226" width="94" height="48" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="359" y="243" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#2E7D32">事务提交</text>
  <text x="359" y="261" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">订单保存成功</text>

  <rect x="140" y="322" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="225" y="342" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">捕获异常</text>

  <rect x="140" y="396" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="225" y="416" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">记录补偿日志</text>

  <rect x="140" y="470" width="170" height="56" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="225" y="492" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#2E7D32">事务提交</text>
  <text x="225" y="514" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">补偿日志保存成功</text>

  <!-- ============ 右：补偿处理流程 ============ -->
  <rect x="480" y="90" width="450" height="470" rx="8" fill="#F4FAF5" stroke="#C8E6C9" stroke-width="1"/>
  <rect x="495" y="100" width="120" height="24" rx="12" fill="#43A047"/>
  <text x="555" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">补偿处理流程</text>

  <rect x="590" y="148" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="705" y="168" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">定时任务扫描 PENDING 日志</text>

  <rect x="620" y="222" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="705" y="242" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">重试创建订单</text>

  <polygon points="705,296 770,330 705,364 640,330" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="705" y="330" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#37474F">重试是否成功?</text>

  <rect x="800" y="306" width="115" height="48" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="857" y="323" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#2E7D32">更新日志状态</text>
  <text x="857" y="341" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">SUCCESS</text>

  <rect x="620" y="402" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="705" y="422" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">重试次数 +1</text>

  <polygon points="705,476 758,510 705,544 652,510" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="705" y="510" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#37474F">超过最大重试次数?</text>

  <rect x="800" y="486" width="115" height="48" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="857" y="503" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#2E7D32">状态改为 FAILED</text>
  <text x="857" y="521" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#78909C">人工处理</text>

  <rect x="490" y="486" width="100" height="48" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <text x="540" y="510" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#37474F">等待下次重试</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M225,190 L225,214" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M274,250 L309,250" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M225,286 L225,319" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M225,364 L225,393" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M225,438 L225,467" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M705,190 L705,219" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M705,264 L705,293" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M772,330 L797,330" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M705,366 L705,399" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M705,444 L705,473" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M760,510 L797,510" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M650,510 L593,510" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M312,498 L444,498 Q462,498 462,480 L462,186 Q462,168 480,168 L588,168" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ah)"/>

  <!-- ============ Annotations ============ -->
  <text x="291" y="238" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">成功</text>
  <text x="238" y="304" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">失败</text>
  <text x="785" y="318" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">成功</text>
  <text x="718" y="384" text-anchor="start" dominant-baseline="central" font-size="9.5" fill="#757575">失败</text>
  <text x="778" y="498" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">是</text>
  <text x="621" y="498" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575">否</text>
  <text x="452" y="330" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#757575" transform="rotate(-90 452 330)">触发补偿</text>
</svg>
