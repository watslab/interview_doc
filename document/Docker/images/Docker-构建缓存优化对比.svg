<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="440" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 优化前面板 -->
  <rect x="40" y="50" width="420" height="360" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="70" y="80" text-anchor="start" font-size="13" font-weight="bold" fill="#B71C1C">优化前</text>

  <rect x="120" y="138" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" filter="url(#s1)"/>
  <text x="250" y="164" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">COPY . .</text>

  <rect x="120" y="218" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" filter="url(#s1)"/>
  <text x="250" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">RUN pip install</text>

  <rect x="120" y="298" width="260" height="44" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="250" y="324" text-anchor="middle" font-size="11.5" font-weight="600" fill="#B71C1C">代码变化触发依赖重新安装</text>

  <!-- 优化后面板 -->
  <rect x="500" y="50" width="420" height="360" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="530" y="80" text-anchor="start" font-size="13" font-weight="bold" fill="#1B5E20">优化后</text>

  <rect x="580" y="98" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" filter="url(#s1)"/>
  <text x="710" y="124" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">COPY requirements.txt .</text>

  <rect x="580" y="178" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" filter="url(#s1)"/>
  <text x="710" y="204" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">RUN pip install</text>

  <rect x="580" y="258" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.2" filter="url(#s1)"/>
  <text x="710" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">COPY . .</text>

  <rect x="580" y="338" width="260" height="44" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="710" y="364" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B5E20">代码变化不触发依赖重新安装</text>

  <!-- 连接箭头（最后绘制，保证在最上层） -->
  <line x1="250" y1="183" x2="250" y2="217" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="250" y1="263" x2="250" y2="297" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="710" y1="143" x2="710" y2="177" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="710" y1="223" x2="710" y2="257" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="710" y1="303" x2="710" y2="337" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="480" y="434" text-anchor="middle" font-size="10.5" fill="#757575">优化后仅调整指令顺序：先复制依赖清单再安装依赖，使该层缓存仅取决于 requirements.txt 的内容，代码变化不再触发依赖重新安装</text>
</svg>
