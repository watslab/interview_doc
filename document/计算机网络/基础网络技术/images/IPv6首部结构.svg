<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1060" height="640" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H1058 Q1070,10 1070,22 V50 H10 Z" fill="#37474F"/>
  <text x="540" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">IPv6 首部结构（RFC 8200）</text>

  <!--
    Bit scale: 128 bits per 32-bit row-group NOT used; instead compressed layout:
    Row 1 (0~31):   Version(4) Traffic Class(8) Flow Label(20)  -> 32 bits mapped to full width
    Row 2 (32~63):  Payload Length(16) Next Header(8) Hop Limit(8) -> 32 bits mapped to full width
    Row 3 (64~191): Source Address(128)
    Row 4 (192~319): Destination Address(128)
    Uniform px/bit within each 32-bit row: 960px / 32bit = 30px per bit (same as IPv4 diagram)
  -->

  <!-- Bit position scale (row 1 & 2): 30px per bit, x = 60 + bit*30 -->
  <text x="60" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="180" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">4</text>
  <text x="300" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">8</text>
  <text x="600" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">16</text>
  <text x="1020" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">31</text>
  <line x1="60" y1="80" x2="60" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="180" y1="80" x2="180" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="300" y1="80" x2="300" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="600" y1="80" x2="600" y2="87" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="1020" y1="80" x2="1020" y2="87" stroke="#90A4AE" stroke-width="0.5"/>

  <!-- Row 1 (bits 0~31): Version(4) | Traffic Class(8) | Flow Label(20) -->
  <rect x="60" y="87" width="120" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="120" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Version（4 位）</text>

  <rect x="180" y="87" width="240" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="300" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">Traffic Class（8 位）</text>

  <rect x="420" y="87" width="600" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="720" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">Flow Label（20 位）</text>

  <!-- Row 2 (bits 32~63): Payload Length(16) | Next Header(8) | Hop Limit(8) -->
  <rect x="60" y="131" width="480" height="44" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="300" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#4A148C">Payload Length（16 位）</text>

  <rect x="540" y="131" width="240" height="44" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="660" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">Next Header（8 位）</text>

  <rect x="780" y="131" width="240" height="44" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="900" y="153" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">Hop Limit（8 位）</text>

  <!-- Row 3 (bits 64~191): Source Address (128) -->
  <rect x="60" y="175" width="960" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="540" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Source Address（128 位）</text>

  <!-- Row 4 (bits 192~319): Destination Address (128) -->
  <rect x="60" y="219" width="960" height="44" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="540" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Destination Address（128 位）</text>

  <!-- Row 5: Extension headers (dashed, optional) -->
  <rect x="60" y="263" width="960" height="44" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="540" y="285" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">扩展首部（可选，由 Next Header 串联，长度可变）</text>

  <!-- Separator -->
  <line x1="60" y1="329" x2="1020" y2="329" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Field detail table title -->
  <text x="540" y="350" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#37474F">关键字段说明</text>

  <!-- Detail rows -->
  <rect x="60" y="365" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="365" width="160" height="30" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="140" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1565C0">Version</text>
  <text x="240" y="380" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">协议版本，IPv6 固定为 6</text>

  <rect x="60" y="395" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="395" width="160" height="30" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="140" y="410" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Traffic Class</text>
  <text x="240" y="410" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">流量类别，等价于 IPv4 的 DSCP + ECN，用于 QoS 标记与拥塞通知</text>

  <rect x="60" y="425" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="425" width="160" height="30" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="140" y="440" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Flow Label</text>
  <text x="240" y="440" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">流标签，标识同一流，便于沿途设备识别并作一致性处理（QoS）</text>

  <rect x="60" y="455" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="455" width="160" height="30" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="140" y="470" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#4A148C">Payload Length</text>
  <text x="240" y="470" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">载荷长度（不含基本首部），单位字节，最大 65535；超长时置 0 并由 Hop-by-Hop 扩展首部表示</text>

  <rect x="60" y="485" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="485" width="160" height="30" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="140" y="500" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Next Header</text>
  <text x="240" y="500" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">下一首部，标识紧随本首部之后的首部类型（扩展首部或上层协议首部），串联首部链</text>

  <rect x="60" y="515" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="515" width="160" height="30" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="140" y="530" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Hop Limit</text>
  <text x="240" y="530" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">跳数限制，等价 IPv4 的 TTL：每跳减 1，为 0 时丢弃，防止环路</text>

  <rect x="60" y="545" width="960" height="30" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="545" width="160" height="30" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="140" y="560" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1565C0">Source/Dest Addr</text>
  <text x="240" y="560" text-anchor="start" dominant-baseline="central" font-size="11" fill="#333">源/目的地址，各 128 位，提供海量地址空间</text>

  <!-- Removed-fields note -->
  <rect x="60" y="585" width="960" height="36" rx="4" fill="#FFF8E1" stroke="#FFB300" stroke-width="1"/>
  <text x="540" y="603" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#795548">IPv6 取消了 IPv4 的 IHL、分片相关字段与首部校验和：分片交由源端扩展首部处理，校验和交由链路层与传输层承担</text>
</svg>
