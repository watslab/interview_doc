<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="520" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 源节点 / 目标节点 -->
  <rect x="170" y="50" width="220" height="52" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">源节点 A</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="#888888">槽 8 迁出</text>

  <rect x="530" y="50" width="220" height="52" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="640" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">目标节点 D</text>
  <text x="640" y="90" text-anchor="middle" font-size="10.5" fill="#888888">槽 8 迁入</text>

  <!-- 关联虚线 -->
  <line x1="280" y1="102" x2="280" y2="136" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="640" y1="102" x2="640" y2="136" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 步骤 -->
  <rect x="230" y="140" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="254" cy="166" r="11" fill="#546E7A"/>
  <text x="254" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="460" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">源节点 A 标记槽 8 为 MIGRATING</text>

  <rect x="230" y="226" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="254" cy="252" r="11" fill="#546E7A"/>
  <text x="254" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="460" y="256" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">目标节点 D 标记槽 8 为 IMPORTING</text>

  <rect x="230" y="312" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="254" cy="338" r="11" fill="#546E7A"/>
  <text x="254" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="460" y="342" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">逐键执行 MIGRATE，键从 A 原子搬移到 D</text>

  <rect x="230" y="398" width="460" height="52" rx="8" fill="#1E88E5" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="254" cy="424" r="11" fill="#FFFFFF"/>
  <text x="254" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E88E5">4</text>
  <text x="460" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">CLUSTER SETSLOT 8 NODE D，归属广播生效</text>

  <!-- 连接线 -->
  <line x1="460" y1="192" x2="460" y2="225" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="460" y1="278" x2="460" y2="311" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="460" y1="364" x2="460" y2="397" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 底部说明 -->
  <text x="460" y="496" text-anchor="middle" font-size="10.5" fill="#757575">redis-cli --cluster reshard 可自动完成上述流程，全程在线进行，不阻塞读写</text>
</svg>
