<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E88E5"/></marker>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="860" height="280" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 主流程三节点 -->
  <rect x="159" y="45" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="234" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#333">输入文本</text>

  <rect x="365" y="45" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="440" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Token 序列</text>

  <rect x="571" y="45" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="646" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#333">模型处理</text>

  <!-- 分词示例容器 -->
  <rect x="80" y="131" width="720" height="124" rx="10" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1"/>
  <rect x="96" y="124.5" width="54" height="6.5" fill="#FAFAFA"/>
  <rect x="96" y="131" width="54" height="6.5" fill="#ECEFF1"/>
  <text x="100" y="131" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#546E7A">分词示例</text>

  <!-- 示例行1：人工智能 -->
  <rect x="286" y="161" width="68" height="24" rx="12" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" filter="url(#s1)"/>
  <text x="320" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">人工智能</text>
  <rect x="392" y="156" width="152" height="34" rx="8" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="400" y="161" width="60" height="24" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="430" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">人工</text>
  <rect x="476" y="161" width="60" height="24" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="506" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">智能</text>
  <text x="556" y="177" font-size="10" fill="#757575">2 tokens</text>

  <!-- 示例行2：Hello world -->
  <rect x="269" y="201" width="85" height="24" rx="12" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" filter="url(#s1)"/>
  <text x="312" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Hello world</text>
  <rect x="392" y="196" width="152" height="34" rx="8" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="400" y="201" width="60" height="24" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="430" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">Hello</text>
  <rect x="476" y="201" width="60" height="24" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="506" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#1565C0">world</text>
  <text x="556" y="217" font-size="10" fill="#757575">2 tokens</text>

  <!-- 连接线（最后绘制） -->
  <line x1="310" y1="73" x2="364" y2="73" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#ahb)"/>
  <line x1="516" y1="73" x2="570" y2="73" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#ahb)"/>
  <line x1="362" y1="173" x2="379" y2="173" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="362" y1="213" x2="379" y2="213" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah2)"/>
</svg>
