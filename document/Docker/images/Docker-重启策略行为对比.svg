<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI',Arial,sans-serif">
  <rect x="10" y="10" width="900" height="420" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 表头行 -->
  <rect x="60" y="56" width="220" height="44" fill="#ECEFF1" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="82.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474F">触发事件</text>
  <rect x="280" y="56" width="145" height="44" fill="#ECEFF1" stroke="#E0E0E0" stroke-width="1"/>
  <text x="352.5" y="82.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474F">no</text>
  <rect x="425" y="56" width="145" height="44" fill="#ECEFF1" stroke="#E0E0E0" stroke-width="1"/>
  <text x="497.5" y="82.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474F">on-failure</text>
  <rect x="570" y="56" width="145" height="44" fill="#ECEFF1" stroke="#E0E0E0" stroke-width="1"/>
  <text x="642.5" y="82.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474F">always</text>
  <rect x="715" y="56" width="145" height="44" fill="#ECEFF1" stroke="#E0E0E0" stroke-width="1"/>
  <text x="787.5" y="82.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474F">unless-stopped</text>

  <!-- 行 1：容器异常退出 -->
  <rect x="60" y="100" width="220" height="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="132.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">容器异常退出</text>
  <text x="170" y="146.7" text-anchor="middle" font-size="10" fill="#888888">exit code 非 0</text>
  <rect x="280" y="100" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="352.5" y="139.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不重启</text>
  <rect x="425" y="100" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="497.5" y="139.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">重启</text>
  <rect x="570" y="100" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="642.5" y="139.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">重启</text>
  <rect x="715" y="100" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="787.5" y="139.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">重启</text>

  <!-- 行 2：容器正常退出 -->
  <rect x="60" y="170" width="220" height="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="202.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">容器正常退出</text>
  <text x="170" y="216.7" text-anchor="middle" font-size="10" fill="#888888">exit 0</text>
  <rect x="280" y="170" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="352.5" y="209.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不重启</text>
  <rect x="425" y="170" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="497.5" y="209.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不重启</text>
  <rect x="570" y="170" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="642.5" y="209.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">重启</text>
  <rect x="715" y="170" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="787.5" y="209.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">重启</text>

  <!-- 行 3：宿主机重启（容器之前运行中） -->
  <rect x="60" y="240" width="220" height="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="272.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">宿主机重启</text>
  <text x="170" y="286.7" text-anchor="middle" font-size="10" fill="#888888">容器之前处于运行中</text>
  <rect x="280" y="240" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="352.5" y="279.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不启动</text>
  <rect x="425" y="240" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="497.5" y="279.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不启动</text>
  <rect x="570" y="240" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="642.5" y="279.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">自动启动</text>
  <rect x="715" y="240" width="145" height="70" fill="#E8F5E9" stroke="#E0E0E0" stroke-width="1"/>
  <text x="787.5" y="279.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">自动启动</text>

  <!-- 行 4：宿主机重启（容器之前手动停止）— always 与 unless-stopped 的关键差异行（琥珀框标注） -->
  <rect x="60" y="310" width="220" height="70" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="170" y="342.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">宿主机重启</text>
  <text x="170" y="356.7" text-anchor="middle" font-size="10" fill="#888888">容器之前被手动停止</text>
  <rect x="280" y="310" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="352.5" y="349.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不启动</text>
  <rect x="425" y="310" width="145" height="70" fill="#FFEBEE" stroke="#E0E0E0" stroke-width="1"/>
  <text x="497.5" y="349.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C62828">不启动</text>
  <rect x="570" y="310" width="145" height="70" fill="#E8F5E9" stroke="#F57F17" stroke-width="2"/>
  <text x="642.5" y="349.2" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E7D32">自动启动</text>
  <rect x="715" y="310" width="145" height="70" fill="#FFEBEE" stroke="#F57F17" stroke-width="2"/>
  <text x="787.5" y="349.2" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C62828">保持停止</text>

  <!-- 底部说明 -->
  <text x="460" y="409" text-anchor="middle" font-size="10.5" fill="#757575">关键差异（橙框标注）：手动停止后宿主机重启，always 忽略手动停止自动启动，unless-stopped 尊重手动停止保持停止</text>
</svg>
