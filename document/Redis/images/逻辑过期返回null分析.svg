<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="556" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#1565C0" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">缓存不存在返回 null 分析</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">逻辑过期方案下，缓存不存在的原因分类与对应处理</text>

  <!-- ============ Band 1: 场景分析 ============ -->
  <rect x="30" y="90" width="900" height="160" rx="8" fill="#F4F9FE" stroke="#BBDEFB" stroke-width="1"/>
  <rect x="50" y="100" width="100" height="24" rx="12" fill="#1E88E5"/>
  <text x="100" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">场景分析</text>

  <rect x="390" y="134" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="480" y="152" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#1565C0">缓存不存在的原因</text>

  <rect x="185" y="200" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="260" y="218" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">数据本身不存在</text>
  <rect x="405" y="200" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="480" y="218" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">缓存未预热</text>
  <rect x="625" y="200" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="700" y="218" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">缓存被清空</text>

  <!-- ============ Band 2: 设计原因 ============ -->
  <rect x="30" y="278" width="900" height="120" rx="8" fill="#FFF9F2" stroke="#FFCC80" stroke-width="1"/>
  <rect x="50" y="288" width="100" height="24" rx="12" fill="#F57C00"/>
  <text x="100" y="300" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">设计原因</text>

  <rect x="40" y="322" width="205" height="60" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.2"/>
  <text x="142" y="342" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#455A64">逻辑过期方案</text>
  <text x="142" y="364" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C">适用于热点数据</text>

  <rect x="265" y="322" width="205" height="60" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.2"/>
  <text x="367" y="342" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#455A64">热点数据</text>
  <text x="367" y="364" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C">应提前预热到缓存</text>

  <rect x="490" y="322" width="205" height="60" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.2"/>
  <text x="592" y="342" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#455A64">缓存不存在说明</text>
  <text x="592" y="364" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C">非热点或数据无效</text>

  <rect x="715" y="322" width="205" height="60" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.2"/>
  <text x="817" y="342" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#455A64">直接返回 null</text>
  <text x="817" y="364" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C">避免缓存穿透</text>

  <!-- ============ Band 3: 解决方案 ============ -->
  <rect x="30" y="426" width="900" height="120" rx="8" fill="#F4FAF5" stroke="#C8E6C9" stroke-width="1"/>
  <rect x="50" y="436" width="100" height="24" rx="12" fill="#43A047"/>
  <text x="100" y="448" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">解决方案</text>

  <rect x="50" y="470" width="270" height="52" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="185" y="496" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">数据不存在 → 返回 null 正确</text>

  <rect x="345" y="470" width="270" height="52" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="480" y="496" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">缓存未预热 → 需要提前预热</text>

  <rect x="640" y="470" width="270" height="52" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="775" y="496" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">缓存清空 → 需要重新预热</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M480,172 L480,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,172 C480,186 260,184 260,186 L260,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,172 C480,186 700,184 700,186 L700,198" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,252 L480,276" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,400 L480,424" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
</svg>
