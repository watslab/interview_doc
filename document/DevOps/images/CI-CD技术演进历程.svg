<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="300" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#263238">CI / CD 技术演进历程</text>

  <!-- Stage 1: 手动部署时代 -->
  <rect x="34" y="78" width="140" height="204" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#shadow1)"/>
  <path d="M42,78 H166 Q174,78 174,86 V128 H34 V86 Q34,78 42,78 Z" fill="#BBDEFB"/>
  <text x="104" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">手动部署时代</text>
  <text x="104" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#1565C0">2000 前</text>
  <text x="104" y="163" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">手工部署</text>
  <text x="104" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">Shell 脚本</text>
  <text x="104" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">人工运维</text>
  <text x="104" y="247" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">无统一标准</text>

  <!-- Stage 2: 持续集成萌芽 -->
  <rect x="222" y="78" width="140" height="204" rx="8" fill="#FFFFFF" stroke="#64B5F6" stroke-width="1.5" filter="url(#shadow1)"/>
  <path d="M230,78 H354 Q362,78 362,86 V128 H222 V86 Q222,78 230,78 Z" fill="#90CAF9"/>
  <text x="292" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">持续集成萌芽</text>
  <text x="292" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#1565C0">2001-2010</text>
  <text x="292" y="163" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">CruiseControl</text>
  <text x="292" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">Jenkins / Hudson</text>
  <text x="292" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">每日集成</text>
  <text x="292" y="247" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">自动构建</text>

  <!-- Stage 3: DevOps 与 CD 兴起 -->
  <rect x="410" y="78" width="140" height="204" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="1.5" filter="url(#shadow1)"/>
  <path d="M418,78 H542 Q550,78 550,86 V128 H410 V86 Q410,78 418,78 Z" fill="#64B5F6"/>
  <text x="480" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">DevOps 与 CD 兴起</text>
  <text x="480" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#1565C0">2011-2015</text>
  <text x="480" y="163" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">DevOps 文化</text>
  <text x="480" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">持续交付</text>
  <text x="480" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">Docker 容器化</text>
  <text x="480" y="247" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">基础设施即代码</text>

  <!-- Stage 4: 云原生 CI / CD -->
  <rect x="598" y="78" width="140" height="204" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow1)"/>
  <path d="M606,78 H730 Q738,78 738,86 V128 H598 V86 Q598,78 606,78 Z" fill="#42A5F5"/>
  <text x="668" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">云原生 CI / CD</text>
  <text x="668" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#E3F2FD">2016-2020</text>
  <text x="668" y="163" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">Kubernetes</text>
  <text x="668" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">Tekton</text>
  <text x="668" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">微服务架构</text>
  <text x="668" y="247" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">声明式流水线</text>

  <!-- Stage 5: 智能化与 GitOps -->
  <rect x="786" y="78" width="140" height="204" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5" filter="url(#shadow1)"/>
  <path d="M794,78 H918 Q926,78 926,86 V128 H786 V86 Q786,78 794,78 Z" fill="#1E88E5"/>
  <text x="856" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">智能化与 GitOps</text>
  <text x="856" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#E3F2FD">2021 至今</text>
  <text x="856" y="163" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">GitOps 模型</text>
  <text x="856" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">ArgoCD / Flux</text>
  <text x="856" y="219" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">AI 辅助运维</text>
  <text x="856" y="247" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555555">渐进式发布</text>

  <!-- Arrows and driver labels (drawn last for z-order) -->
  <line x1="177" y1="180" x2="219" y2="180" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="198" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">自动化</text>

  <line x1="365" y1="180" x2="407" y2="180" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="386" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">DevOps</text>

  <line x1="553" y1="180" x2="595" y2="180" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="574" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">容器化</text>

  <line x1="741" y1="180" x2="783" y2="180" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="762" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">GitOps</text>
</svg>
