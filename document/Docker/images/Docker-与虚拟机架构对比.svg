  <text x="552" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">App 1</text>
  <text x="552" y="154" text-anchor="middle" font-size="10" fill="#888888">Libs</text>
  <rect x="624" y="114" width="112" height="50" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="680" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">App 2</text>
  <text x="680" y="154" text-anchor="middle" font-size="10" fill="#888888">Libs</text>
  <rect x="752" y="114" width="112" height="50" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="808" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">App 3</text>
