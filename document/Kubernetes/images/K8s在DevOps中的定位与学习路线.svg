  <text x="480" y="216" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#757575">本文档体系以 Kubernetes 集群为核心，覆盖其学习与生产运维的完整路径</text>

  <!-- 下：Kubernetes 学习路径 -->
  <rect x="30" y="232" width="900" height="140" rx="8" fill="#E8F5E9" filter="url(#s1)"/>
  <path d="M38,232 H922 Q930,232 930,240 V258 H30 V240 Q30,232 38,232 Z" fill="#43A047"/>
  <rect x="30" y="232" width="900" height="140" rx="8" fill="none" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="480" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">Kubernetes 学习路径（本文档体系）</text>

