<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="880" height="710" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H860 Q870,20 870,30 V62 H30 V30 Q30,20 40,20Z" fill="#1E88E5" filter="url(#s1)"/>
  <text x="450" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">Service 与 Endpoint 流量转发</text>
  <text x="450" y="72" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">客户端经 Service 虚拟 IP 访问，kube-proxy 依据 EndpointSlice 将流量负载均衡至后端 Pod</text>

  <!-- ============ Row 1: ClusterIP (cy=90) ============ -->
  <rect x="30" y="90" width="840" height="180" rx="8" fill="#F7F9FC" stroke="#DDE3EA" stroke-width="1"/>
