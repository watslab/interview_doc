<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/>
    </filter>
    <marker id="axisArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#78909C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="880" height="280" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="460" y="46" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#263238">Next-Key Lock 锁定区间</text>

  <!-- Row caption: data records -->
  <text x="60" y="98" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#546E7A">数据记录（id 唯一索引）</text>

  <!-- Key-space axis -->
  <line x1="60" y1="152" x2="860" y2="152" stroke="#78909C" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="72" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">-∞</text>
  <text x="848" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">+∞</text>

  <!-- Data records -->
  <text x="220" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#37474F">id=1</text>
  <text x="380" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#37474F">id=5</text>
  <text x="540" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#37474F">id=8</text>
  <text x="700" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#37474F">id=15</text>
  <circle cx="220" cy="152" r="6.5" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <circle cx="380" cy="152" r="6.5" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <circle cx="540" cy="152" r="6.5" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <circle cx="700" cy="152" r="6.5" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>

  <!-- Boundary guides: each record sits on the edge of the interval partition -->
  <line x1="220" y1="160" x2="220" y2="196" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="380" y1="160" x2="380" y2="196" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="540" y1="160" x2="540" y2="196" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="700" y1="160" x2="700" y2="196" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Next-Key Lock intervals: conceptual partition of the key space -->
  <rect x="60" y="202" width="160" height="48" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="220" y="202" width="160" height="48" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="202" width="160" height="48" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="540" y="202" width="160" height="48" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="202" width="160" height="48" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#C62828">(-∞, 1]</text>
  <text x="300" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#EF6C00">(1, 5]</text>
  <text x="460" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2E7D32">(5, 8]</text>
  <text x="620" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1565C0">(8, 15]</text>
  <text x="780" y="226" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#6A1B9A">(15, +∞)</text>

  <!-- Note -->
  <text x="460" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#78909C">注：本图为索引键空间的概念分区，并非单次查询的实际加锁范围</text>
</svg>
