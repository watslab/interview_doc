<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#546E7A"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6Z" fill="#E53935"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="900" height="320" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#263238">DevSecOps 安全左移</text>

  <!-- Shift-Left Arrow (right to left, red) -->
  <line x1="860" y1="58" x2="70" y2="58" stroke="#E53935" stroke-width="2" marker-end="url(#ahr)"/>
  <text x="460" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#E53935">安全左移：越早发现，修复成本越低</text>

  <!-- SDLC Stage Boxes (blue) -->
  <rect x="20" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">编码</text>

  <rect x="170" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">代码审查</text>

  <rect x="320" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">构建</text>

  <rect x="470" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">测试</text>

  <rect x="620" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="685" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">部署</text>

  <rect x="770" y="80" width="130" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="835" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">运行时</text>

  <!-- Security Check Boxes (orange) -->
  <rect x="20" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Pre-commit</text>
  <text x="85" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Gitleaks</text>

  <rect x="170" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">SAST</text>
  <text x="235" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">SonarQube</text>

  <rect x="320" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">SCA</text>
  <text x="385" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Trivy</text>

  <rect x="470" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">DAST</text>
  <text x="535" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">OWASP ZAP</text>

  <rect x="620" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="685" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">IaC 扫描</text>
  <text x="685" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Kyverno</text>

  <rect x="770" y="155" width="130" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="835" y="173" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">运行时安全</text>
  <text x="835" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Falco / Tetragon</text>

  <!-- Cost labels (red, increasing) -->
  <text x="85" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#43A047">$60</text>
  <text x="235" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7CB342">$300</text>
  <text x="385" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FBC02D">$1,000</text>
  <text x="535" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#F57C00">$3,000</text>
  <text x="685" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E53935">$10,000</text>
  <text x="835" y="245" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#B71C1C">$30,000+</text>

  <!-- Cost trend line -->
  <path d="M85,260 Q460,270 835,265" fill="none" stroke="#E53935" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="460" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#B71C1C">修复成本递增趋势</text>

  <!-- Connection Lines (drawn last for z-order) -->
  <!-- Stage arrows (horizontal) -->
  <line x1="150" y1="98" x2="168" y2="98" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="300" y1="98" x2="318" y2="98" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="450" y1="98" x2="468" y2="98" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="600" y1="98" x2="618" y2="98" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="750" y1="98" x2="768" y2="98" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>

  <!-- Dashed lines connecting stages to security checks -->
  <line x1="85" y1="116" x2="85" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="235" y1="116" x2="235" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="385" y1="116" x2="385" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="535" y1="116" x2="535" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="685" y1="116" x2="685" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="835" y1="116" x2="835" y2="153" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
