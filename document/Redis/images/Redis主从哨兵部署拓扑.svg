<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 412" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="392" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <text x="460" y="34" text-anchor="middle" font-size="10.5" fill="#757575">哨兵之间经主节点的 __sentinel__:hello 频道自动发现彼此</text>

  <!-- 哨兵 -->
  <rect x="100" y="50" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="185" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S1</text>
  <text x="185" y="90" text-anchor="middle" font-size="10" fill="#888888">端口 26379</text>

  <rect x="375" y="50" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S2</text>
  <text x="460" y="90" text-anchor="middle" font-size="10" fill="#888888">端口 26380</text>

  <rect x="650" y="50" width="170" height="52" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="735" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">哨兵 S3</text>
  <text x="735" y="90" text-anchor="middle" font-size="10" fill="#888888">端口 26381</text>

  <!-- 哨兵互连 -->
  <line x1="270" y1="76" x2="372" y2="76" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="545" y1="76" x2="647" y2="76" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- 监控 -->
  <line x1="185" y1="102" x2="430" y2="173" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="460" y1="102" x2="460" y2="173" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="735" y1="102" x2="490" y2="173" stroke="#90A4AE" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="478" y="142" text-anchor="start" font-size="10" fill="#757575">监控（周期 PING）</text>

  <!-- 主节点 -->
  <rect x="370" y="176" width="180" height="56" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="460" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">主节点 M</text>
  <text x="460" y="218" text-anchor="middle" font-size="10.5" fill="#888888">端口 6379</text>

  <!-- 复制 -->
  <line x1="400" y1="232" x2="193" y2="303" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="520" y1="232" x2="727" y2="303" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="255" y="275" text-anchor="middle" font-size="10" fill="#757575">复制</text>
  <text x="665" y="275" text-anchor="middle" font-size="10" fill="#757575">复制</text>

  <!-- 从节点 -->
  <rect x="100" y="306" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="190" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">从节点 R1</text>
  <text x="190" y="348" text-anchor="middle" font-size="10.5" fill="#888888">端口 6380</text>

  <rect x="640" y="306" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="730" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">从节点 R2</text>
  <text x="730" y="348" text-anchor="middle" font-size="10.5" fill="#888888">端口 6381</text>
</svg>
