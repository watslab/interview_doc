<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1380" height="790" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="700" y="55" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#263238">Protobuf 发展历程</text>
  <text x="700" y="88" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">从 Google 内部基础设施协议到跨语言序列化标准 · 2001 — 2026</text>

  <!-- Year labels above axis -->
  <text x="130" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#546E7A">2001</text>
  <text x="358" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1E88E5">2008</text>
  <text x="586" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#7B1FA2">2016</text>
  <text x="814" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#F57C00">2023</text>
  <text x="1042" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#43A047">2024</text>
  <text x="1270" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E53935">2026</text>

  <!-- Timeline axis -->
  <line x1="40" y1="160" x2="1360" y2="160" stroke="#90A4AE" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Stage markers on axis -->
  <circle cx="130" cy="160" r="7" fill="#FFFFFF" stroke="#546E7A" stroke-width="2.5"/>
  <circle cx="130" cy="160" r="3" fill="#546E7A"/>
  <circle cx="358" cy="160" r="7" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2.5"/>
  <circle cx="358" cy="160" r="3" fill="#1E88E5"/>
  <circle cx="586" cy="160" r="7" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="2.5"/>
  <circle cx="586" cy="160" r="3" fill="#7B1FA2"/>
  <circle cx="814" cy="160" r="7" fill="#FFFFFF" stroke="#F57C00" stroke-width="2.5"/>
  <circle cx="814" cy="160" r="3" fill="#F57C00"/>
  <circle cx="1042" cy="160" r="7" fill="#FFFFFF" stroke="#43A047" stroke-width="2.5"/>
  <circle cx="1042" cy="160" r="3" fill="#43A047"/>
  <circle cx="1270" cy="160" r="7" fill="#FFFFFF" stroke="#E53935" stroke-width="2.5"/>
  <circle cx="1270" cy="160" r="3" fill="#E53935"/>

  <!-- Connectors from axis to cards -->
  <line x1="130" y1="167" x2="130" y2="200" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="358" y1="167" x2="358" y2="200" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="586" y1="167" x2="586" y2="200" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="814" y1="167" x2="814" y2="200" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="1042" y1="167" x2="1042" y2="200" stroke="#A5D6A7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="1270" y1="167" x2="1270" y2="200" stroke="#EF9A9A" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Card 1: Proto1 (Gray) -->
  <rect x="30" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M38,200 H222 Q230,200 230,208 V256 H30 V208 Q30,200 38,200Z" fill="#546E7A"/>
  <text x="130" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2001</text>
  <text x="130" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ECEFF1">Google 内部</text>
  <text x="130" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#546E7A">Proto1</text>
  <line x1="50" y1="296" x2="210" y2="296" stroke="#ECEFF1" stroke-width="1"/>
  <text x="130" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">诞生于 Google 搜索业务</text>
  <text x="130" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">索引服务器间数据交换</text>
  <text x="130" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">按需生长，未对外发布</text>
  <text x="130" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">内部基础设施协议</text>

  <!-- Card 2: proto2 (Blue) -->
  <rect x="258" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M266,200 H450 Q458,200 458,208 V256 H258 V208 Q258,200 266,200Z" fill="#1E88E5"/>
  <text x="358" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2008</text>
  <text x="358" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E3F2FD">对外开源</text>
  <text x="358" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E88E5">proto2</text>
  <line x1="278" y1="296" x2="438" y2="296" stroke="#E3F2FD" stroke-width="1"/>
  <text x="358" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">2008 年 7 月开源</text>
  <text x="358" y="348" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#37474F">required/optional/repeated</text>
  <text x="358" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">扩展机制、自定义默认值</text>
  <text x="358" y="404" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">C++ / Java / Python</text>
  <text x="358" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">首个公开版本</text>

  <!-- Card 3: proto3 (Purple) -->
  <rect x="486" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M494,200 H678 Q686,200 686,208 V256 H486 V208 Q486,200 494,200Z" fill="#7B1FA2"/>
  <text x="586" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2016</text>
  <text x="586" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#F3E5F5">语法简化</text>
  <text x="586" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7B1FA2">proto3</text>
  <line x1="506" y1="296" x2="666" y2="296" stroke="#F3E5F5" stroke-width="1"/>
  <text x="586" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">移除 required</text>
  <text x="586" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">标量字段隐式存在性</text>
  <text x="586" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">开放枚举、默认 packed</text>
  <text x="586" y="404" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">标准化 JSON 映射</text>
  <text x="586" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">语法简化、生态扩张</text>

  <!-- Card 4: Edition 2023 (Orange) -->
  <rect x="714" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M722,200 H906 Q914,200 914,208 V256 H714 V208 Q714,200 722,200Z" fill="#F57C00"/>
  <text x="814" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2023</text>
  <text x="814" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFF3E0">版本模型重构</text>
  <text x="814" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#F57C00">Edition 2023</text>
  <line x1="734" y1="296" x2="894" y2="296" stroke="#FFF3E0" stroke-width="1"/>
  <text x="814" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">特性开关取代语法关键字</text>
  <text x="814" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">统一 proto2 / proto3 模型</text>
  <text x="814" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">行为按 features 声明</text>
  <text x="814" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">线格式保持不变</text>

  <!-- Card 5: Edition 2024 (Green) -->
  <rect x="942" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M950,200 H1134 Q1142,200 1142,208 V256 H942 V208 Q942,200 950,200Z" fill="#43A047"/>
  <text x="1042" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2024</text>
  <text x="1042" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E8F5E9">治理增强</text>
  <text x="1042" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#43A047">Edition 2024</text>
  <line x1="962" y1="296" x2="1122" y2="296" stroke="#E8F5E9" stroke-width="1"/>
  <text x="1042" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">符号可见性控制</text>
  <text x="1042" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">import option</text>
  <text x="1042" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">命名风格强制</text>
  <text x="1042" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">语言治理增强</text>

  <!-- Card 6: Edition 2026 (Red) -->
  <rect x="1170" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M1178,200 H1362 Q1370,200 1370,208 V256 H1170 V208 Q1170,200 1178,200Z" fill="#E53935"/>
  <text x="1270" y="220" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2026</text>
  <text x="1270" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFEBEE">最新版本</text>
  <text x="1270" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E53935">Edition 2026</text>
  <line x1="1190" y1="296" x2="1350" y2="296" stroke="#FFEBEE" stroke-width="1"/>
  <text x="1270" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">收紧命名规则</text>
  <text x="1270" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">默认严格符号可见性</text>
  <text x="1270" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">枚举值自定义 JSON 名</text>
  <text x="1270" y="452" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">截至 2026 年最新</text>

  <!-- Bottom panel: Key insights -->
  <rect x="30" y="540" width="1340" height="220" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="50" y="568" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">关键演进洞察</text>
  <line x1="50" y1="590" x2="1350" y2="590" stroke="#ECEFF1" stroke-width="1"/>

  <circle cx="58" cy="620" r="3" fill="#F57C00"/>
  <text x="70" y="620" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">版本模型：语法关键字整体切换（proto2 → proto3）演进为特性开关按版本渐进启用（Editions），新行为不再要求一次性迁移</text>

  <circle cx="58" cy="658" r="3" fill="#1E88E5"/>
  <text x="70" y="658" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">线格式稳定：语言版本演进不改变线格式，任一版本生成的字节流均可被其他版本的代码正确解码</text>

  <circle cx="58" cy="696" r="3" fill="#43A047"/>
  <text x="70" y="696" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">定位演进：Google 内部基础设施协议 → 通用开源序列化标准 → gRPC 的默认 IDL</text>
</svg>
