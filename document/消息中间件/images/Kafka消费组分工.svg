<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 492" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="472" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 分区 -->
  <rect x="130" y="70" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="200" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">分区 0</text>
  <rect x="130" y="130" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="200" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">分区 1</text>
  <rect x="130" y="190" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="200" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">分区 2</text>
  <rect x="130" y="250" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="200" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">分区 3</text>

  <!-- 消费组 A -->
  <rect x="530" y="60" width="260" height="240" rx="10" fill="#F2FAF2" stroke="#81C784" stroke-width="1.5"/>
  <path d="M540,60 H780 Q790,60 790,70 V96 H530 V70 Q530,60 540,60Z" fill="#43A047"/>
  <text x="660" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">消费组 A：组内负载均衡</text>
  <rect x="550" y="120" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="660" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 A1</text>
  <rect x="550" y="190" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="660" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 A2</text>
  <text x="660" y="271" text-anchor="middle" font-size="10" fill="#757575">每个实例消费 2 个分区，互不重复</text>

  <!-- 消费组 B -->
  <rect x="530" y="330" width="260" height="102" rx="10" fill="#F9F3FC" stroke="#CE93D8" stroke-width="1.5"/>
  <path d="M540,330 H780 Q790,330 790,340 V366 H530 V340 Q530,330 540,330Z" fill="#7B1FA2"/>
  <text x="660" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">消费组 B：独立全量消费</text>
  <rect x="550" y="378" width="220" height="42" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <text x="660" y="403" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">消费实例 B1</text>

  <!-- 组 A 分配箭头 -->
  <line x1="270" y1="90" x2="527" y2="137" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="270" y1="150" x2="527" y2="149" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="270" y1="210" x2="527" y2="207" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="270" y1="270" x2="527" y2="219" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 组 B 消费箭头 -->
  <line x1="270" y1="90" x2="527" y2="393" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <line x1="270" y1="150" x2="527" y2="397" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <line x1="270" y1="210" x2="527" y2="401" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <line x1="270" y1="270" x2="527" y2="405" stroke="#CE93D8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah)"/>

  <text x="460" y="461" text-anchor="middle" font-size="10.5" fill="#757575">同一分区在同一消费组内只会分配给一个实例；组数决定每条消息被消费的份数</text>
</svg>
