<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1180" height="680" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#263238">Transformer 架构演进</text>
  <text x="600" y="75" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">从原始 Transformer 到现代 LLM 的关键组件变迁</text>

  <!-- ========== Column 1: 原始Transformer (2017) - Light Blue ========== -->
  <rect x="45" y="110" width="340" height="400" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M53,110 H327 Q335,110 335,118 V160 H45 V118 Q45,110 53,110Z" fill="#64B5F6"/>
  <text x="215" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">原始 Transformer</text>
  <text x="215" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E3F2FD">2017 · Vaswani et al.</text>

  <!-- Attribute rows -->
  <text x="65" y="185" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">归一化</text>
  <text x="65" y="208" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">Post-LN</text>
  <text x="365" y="208" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">残差后归一化</text>
  <line x1="65" y1="225" x2="365" y2="225" stroke="#E3F2FD" stroke-width="1"/>

  <text x="65" y="245" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">位置编码</text>
  <text x="65" y="268" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">正弦波 Sinusoidal</text>
  <text x="365" y="268" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">固定不可学</text>
  <line x1="65" y1="285" x2="365" y2="285" stroke="#E3F2FD" stroke-width="1"/>

  <text x="65" y="305" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">激活函数</text>
  <text x="65" y="328" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">ReLU FFN</text>
  <text x="365" y="328" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">两线性层+ReLU</text>
  <line x1="65" y1="345" x2="365" y2="345" stroke="#E3F2FD" stroke-width="1"/>

  <text x="65" y="365" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">注意力机制</text>
  <text x="65" y="388" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">标准 MHA</text>
  <text x="365" y="388" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">Multi-Head Attn</text>
  <line x1="65" y1="405" x2="365" y2="405" stroke="#E3F2FD" stroke-width="1"/>

  <text x="65" y="425" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">架构类型</text>
  <text x="65" y="448" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">Encoder-Decoder</text>
  <text x="365" y="448" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">翻译任务为主</text>

  <text x="215" y="488" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">代表：原始 Transformer · 机器翻译</text>

  <!-- ========== Column 2: GPT-2/BERT时代 (2018-2020) - Medium Blue ========== -->
  <rect x="430" y="110" width="340" height="400" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M438,110 H722 Q730,110 730,118 V160 H430 V118 Q430,110 438,110Z" fill="#1E88E5"/>
  <text x="600" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">GPT-2 / BERT 时代</text>
  <text x="600" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BBDEFB">2018 — 2020 · OpenAI / Google</text>

  <text x="450" y="185" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">归一化</text>
  <text x="450" y="208" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">Pre-LN</text>
  <text x="750" y="208" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">残差前归一化</text>
  <line x1="450" y1="225" x2="750" y2="225" stroke="#BBDEFB" stroke-width="1"/>

  <text x="450" y="245" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">位置编码</text>
  <text x="450" y="268" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">可学习 Learned</text>
  <text x="750" y="268" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">参数化嵌入</text>
  <line x1="450" y1="285" x2="750" y2="285" stroke="#BBDEFB" stroke-width="1"/>

  <text x="450" y="305" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">激活函数</text>
  <text x="450" y="328" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">GELU</text>
  <text x="750" y="328" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">高斯误差线性</text>
  <line x1="450" y1="345" x2="750" y2="345" stroke="#BBDEFB" stroke-width="1"/>

  <text x="450" y="365" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">注意力机制</text>
  <text x="450" y="388" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">标准 MHA</text>
  <text x="750" y="388" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">沿用原版注意力</text>
  <line x1="450" y1="405" x2="750" y2="405" stroke="#BBDEFB" stroke-width="1"/>

  <text x="450" y="425" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">架构类型</text>
  <text x="450" y="448" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">Decoder-Only / Encoder-Only</text>
  <text x="750" y="448" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">单向/双向分叉</text>

  <text x="600" y="488" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">代表：GPT-2 · BERT · RoBERTa · T5</text>

  <!-- ========== Column 3: 现代LLM (2021-2025) - Deep Blue ========== -->
  <rect x="815" y="110" width="340" height="400" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M823,110 H1107 Q1115,110 1115,118 V160 H815 V118 Q815,110 823,110Z" fill="#0D47A1"/>
  <text x="985" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#FFFFFF">现代 LLM</text>
  <text x="985" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E3F2FD">2021 — 2025 · LLaMA / Qwen / DeepSeek</text>

  <text x="835" y="185" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">归一化</text>
  <text x="835" y="208" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">RMSNorm</text>
  <text x="1135" y="208" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">无均值中心化</text>
  <line x1="835" y1="225" x2="1135" y2="225" stroke="#E3F2FD" stroke-width="1"/>

  <text x="835" y="245" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">位置编码</text>
  <text x="835" y="268" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">RoPE 旋转位置编码</text>
  <text x="1135" y="268" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">外推性强</text>
  <line x1="835" y1="285" x2="1135" y2="285" stroke="#E3F2FD" stroke-width="1"/>

  <text x="835" y="305" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">激活函数</text>
  <text x="835" y="328" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">SwiGLU</text>
  <text x="1135" y="328" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">门控线性单元</text>
  <line x1="835" y1="345" x2="1135" y2="345" stroke="#E3F2FD" stroke-width="1"/>

  <text x="835" y="365" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">注意力机制</text>
  <text x="835" y="388" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">GQA / MLA + FlashAttention</text>
  <text x="1135" y="388" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">分组/潜在+IO感知</text>
  <line x1="835" y1="405" x2="1135" y2="405" stroke="#E3F2FD" stroke-width="1"/>

  <text x="835" y="425" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-weight="600">架构类型</text>
  <text x="835" y="448" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#0D47A1">Decoder-Only（统一）</text>
  <text x="1135" y="448" text-anchor="end" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">自回归生成</text>

  <text x="985" y="488" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">代表：LLaMA · Qwen · DeepSeek · Mistral</text>

  <!-- ========== Evolution arrows between columns ========== -->
  <line x1="395" y1="305" x2="425" y2="305" stroke="#90A4AE" stroke-width="2" marker-end="url(#ah)"/>
  <text x="410" y="290" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">演进</text>

  <line x1="780" y1="305" x2="810" y2="305" stroke="#90A4AE" stroke-width="2" marker-end="url(#ah)"/>
  <text x="795" y="290" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">演进</text>

  <!-- ========== Bottom evolution direction bar ========== -->
  <rect x="45" y="540" width="1110" height="100" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="65" y="565" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">架构演进方向</text>

  <!-- Horizontal evolution arrow -->
  <line x1="100" y1="600" x2="1100" y2="600" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6,3"/>
  <circle cx="215" cy="600" r="5" fill="#64B5F6"/>
  <circle cx="600" cy="600" r="5" fill="#1E88E5"/>
  <circle cx="985" cy="600" r="5" fill="#0D47A1"/>

  <text x="215" y="625" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">2017 原始架构</text>
  <text x="600" y="625" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">2018-2020 预训练时代</text>
  <text x="985" y="625" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">2021-2025 现代架构</text>

  <!-- Footer note -->
  <text x="600" y="675" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">核心趋势：归一化前置化 · 位置编码外推化 · 激活函数门控化 · 注意力机制高效化 · 架构统一为 Decoder-Only</text>
</svg>
