<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#546E7A"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1220" height="510" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="620" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">Bash 命令解析流水线</text>

  <!-- ===== Row 1: steps 1-4 (y=90) ===== -->
  <!-- step 1 -->
  <rect x="40" y="90" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="68" cy="120" r="15" fill="#1E88E5"/><text x="68" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="92" y="120" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">读取输入</text>
  <text x="60" y="148" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">从终端或脚本读取命令行</text>

  <!-- step 2 -->
  <rect x="340" y="90" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="368" cy="120" r="15" fill="#1E88E5"/><text x="368" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="392" y="120" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">词法分析（分词）</text>
  <text x="360" y="148" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">按引用规则切分为单词与算符</text>

  <!-- step 3 -->
  <rect x="640" y="90" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="668" cy="120" r="15" fill="#1E88E5"/><text x="668" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="692" y="120" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">语法分析</text>
  <text x="660" y="148" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">构建 AST（抽象语法树）</text>

  <!-- step 4 -->
  <rect x="940" y="90" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="968" cy="120" r="15" fill="#1E88E5"/><text x="968" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="992" y="120" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">展开操作</text>
  <text x="960" y="146" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">~ $ $() $(()) glob 等</text>
  <text x="960" y="164" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">（5 类展开依次进行）</text>

  <!-- ===== Row 2: steps 5-8 (y=330) ===== -->
  <!-- step 5 -->
  <rect x="40" y="330" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="68" cy="360" r="15" fill="#1E88E5"/><text x="68" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="92" y="360" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">重定向处理</text>
  <text x="60" y="388" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">设置 FD 0/1/2 指向</text>

  <!-- step 6 -->
  <rect x="340" y="330" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="368" cy="360" r="15" fill="#1E88E5"/><text x="368" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="392" y="360" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">命令查找</text>
  <text x="360" y="386" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">alias→keyword→function</text>
  <text x="360" y="404" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">→builtin→$PATH</text>

  <!-- step 7 -->
  <rect x="640" y="330" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="668" cy="360" r="15" fill="#1E88E5"/><text x="668" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
  <text x="692" y="360" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">执行</text>
  <text x="660" y="386" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">内建：直接执行</text>
  <text x="660" y="404" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">外部：fork + exec</text>

  <!-- step 8 -->
  <rect x="940" y="330" width="260" height="90" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="968" cy="360" r="15" fill="#1E88E5"/><text x="968" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">8</text>
  <text x="992" y="360" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1565C0">返回退出状态码</text>
  <text x="960" y="388" text-anchor="start" dominant-baseline="central" font-size="11" fill="#555">$? 记录退出状态</text>

  <!-- ===== Arrows (drawn last) ===== -->
  <!-- Row1 horizontal: 1->2, 2->3, 3->4 at y=135 -->
  <line x1="302" y1="135" x2="338" y2="135" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="602" y1="135" x2="638" y2="135" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="902" y1="135" x2="938" y2="135" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Connector 4 -> 5: down, left, down into box5 top -->
  <path d="M1070,180 V255 H170 V328" fill="none" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Row2 horizontal: 5->6, 6->7, 7->8 at y=375 -->
  <line x1="302" y1="375" x2="338" y2="375" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="602" y1="375" x2="638" y2="375" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="902" y1="375" x2="938" y2="375" stroke="#546E7A" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Loopback 8 -> 1: down, left across bottom, up left side, right into box1 -->
  <path d="M1070,420 V478 H24 V135 H38" fill="none" stroke="#43A047" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ahg)"/>
  <text x="620" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#43A047">循环：读取下一条命令（回到步骤 1）</text>
</svg>
