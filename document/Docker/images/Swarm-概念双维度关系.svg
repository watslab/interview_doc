<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="aho" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#E65100"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="490" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 左侧面板：物理（运行）维度 -->
  <rect x="30" y="30" width="400" height="376" rx="10" fill="#F5F9FF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="230" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">物理（运行）维度</text>
  <text x="230" y="81" text-anchor="middle" font-size="10" fill="#546E7A">集群由什么组成 · 容器在哪里运行</text>

  <!-- Swarm -->
  <rect x="110" y="102" width="240" height="60" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="230" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6A1B9A">Swarm（集群）</text>
  <text x="230" y="146" text-anchor="middle" font-size="9.5" fill="#8E24AA">集群级别</text>
  <line x1="230" y1="162" x2="230" y2="213" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="243" y="191" text-anchor="start" font-size="9.5" fill="#757575">1 : N</text>

  <!-- Node -->
  <rect x="110" y="214" width="240" height="60" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="230" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#37474F">Node（节点）</text>
  <text x="230" y="258" text-anchor="middle" font-size="9.5" fill="#607D8B">运行 Docker Engine 的机器</text>
  <line x1="230" y1="274" x2="230" y2="325" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="243" y="303" text-anchor="start" font-size="9.5" fill="#757575">1 : N</text>

  <!-- Container -->
  <rect x="110" y="326" width="240" height="60" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="230" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E65100">Container（容器）</text>
  <text x="230" y="370" text-anchor="middle" font-size="9.5" fill="#F57C00">最小执行单元</text>

  <!-- 右侧面板：逻辑（编排）维度 -->
  <rect x="530" y="30" width="400" height="376" rx="10" fill="#F7F8FE" stroke="#3F51B5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="730" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">逻辑（编排）维度</text>
  <text x="730" y="81" text-anchor="middle" font-size="10" fill="#5C6BC0">应用由什么组成 · 要运行什么</text>

  <!-- Stack -->
  <rect x="610" y="102" width="240" height="60" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="730" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#283593">Stack（栈）</text>
  <text x="730" y="146" text-anchor="middle" font-size="9.5" fill="#5C6BC0">docker-compose.yml 定义的服务集合</text>
  <line x1="730" y1="162" x2="730" y2="213" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="743" y="191" text-anchor="start" font-size="9.5" fill="#757575">1 : N</text>

  <!-- Service -->
  <rect x="610" y="214" width="240" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="730" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0D47A1">Service（服务）</text>
  <text x="730" y="258" text-anchor="middle" font-size="9.5" fill="#546E7A">镜像 · 端口 · 副本数</text>
  <line x1="730" y1="274" x2="730" y2="325" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="743" y="303" text-anchor="start" font-size="9.5" fill="#757575">1 : N（副本数）</text>

  <!-- Task -->
  <rect x="610" y="326" width="240" height="60" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="730" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B5E20">Task（任务）</text>
  <text x="730" y="370" text-anchor="middle" font-size="9.5" fill="#388E3C">调度的最小单元</text>

  <!-- 衔接箭头（最后绘制，保证置于顶层）：Task → Container -->
  <path d="M730,386 L730,428 L230,428 L230,387" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#aho)"/>
  <text x="480" y="450" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E65100">调度到某个 Node，启动 1 : 1 对应的 Container</text>

  <!-- 底部说明 -->
  <text x="480" y="477" text-anchor="middle" font-size="10.5" fill="#757575">Task 是两个维度的衔接点：Service 按副本数生成 Task，Task 被调度到节点后启动一一对应的容器</text>
</svg>
