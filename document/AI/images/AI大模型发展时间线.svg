<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1380" height="880" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="700" y="55" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="bold" fill="#263238">AI 大模型发展时间线</text>
  <text x="700" y="88" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78909C">从反向传播到 Agentic AI · 1986 — 2025</text>

  <!-- Year labels above axis -->
  <text x="130" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#546E7A">1986</text>
  <text x="358" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1E88E5">2006</text>
  <text x="586" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#7B1FA2">2017</text>
  <text x="814" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#F57C00">2018</text>
  <text x="1042" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#43A047">2022</text>
  <text x="1270" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E53935">2024</text>

  <!-- Timeline axis -->
  <line x1="40" y1="160" x2="1360" y2="160" stroke="#90A4AE" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Stage markers on axis -->
  <circle cx="130" cy="160" r="7" fill="#FFFFFF" stroke="#546E7A" stroke-width="2.5"/>
  <circle cx="130" cy="160" r="3" fill="#546E7A"/>
  <circle cx="358" cy="160" r="7" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2.5"/>
  <circle cx="358" cy="160" r="3" fill="#1E88E5"/>
  <circle cx="586" cy="160" r="7" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="2.5"/>
  <circle cx="586" cy="160" r="3" fill="#7B1FA2"/>
  <circle cx="814" cy="160" r="7" fill="#FFFFFF" stroke="#F57C00" stroke-width="2.5"/>
  <circle cx="814" cy="160" r="3" fill="#F57C00"/>
  <circle cx="1042" cy="160" r="7" fill="#FFFFFF" stroke="#43A047" stroke-width="2.5"/>
  <circle cx="1042" cy="160" r="3" fill="#43A047"/>
  <circle cx="1270" cy="160" r="7" fill="#FFFFFF" stroke="#E53935" stroke-width="2.5"/>
  <circle cx="1270" cy="160" r="3" fill="#E53935"/>

  <!-- Connectors from axis to containers -->
  <line x1="130" y1="167" x2="130" y2="200" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="358" y1="167" x2="358" y2="200" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="586" y1="167" x2="586" y2="200" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="814" y1="167" x2="814" y2="200" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="1042" y1="167" x2="1042" y2="200" stroke="#A5D6A7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="1270" y1="167" x2="1270" y2="200" stroke="#EF9A9A" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 1: 前深度学习时代 (Gray) -->
  <rect x="30" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M38,200 H222 Q230,200 230,208 V256 H30 V208 Q30,200 38,200Z" fill="#546E7A"/>
  <text x="130" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ECEFF1">阶段 1</text>
  <text x="130" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">1986 — 2006</text>
  <text x="130" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#546E7A">前深度学习时代</text>
  <line x1="50" y1="296" x2="210" y2="296" stroke="#ECEFF1" stroke-width="1"/>
  <text x="130" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">反向传播 BP (1986)</text>
  <text x="130" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">深度信念网络 (2006)</text>
  <text x="130" y="400" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">神经网络奠基期</text>

  <!-- Stage 2: 深度学习复兴 (Blue) -->
  <rect x="258" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M266,200 H450 Q458,200 458,208 V256 H258 V208 Q258,200 266,200Z" fill="#1E88E5"/>
  <text x="358" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E3F2FD">阶段 2</text>
  <text x="358" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2006 — 2017</text>
  <text x="358" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E88E5">深度学习复兴</text>
  <line x1="278" y1="296" x2="438" y2="296" stroke="#E3F2FD" stroke-width="1"/>
  <text x="358" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">AlexNet (2012)</text>
  <text x="358" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">GAN (2014)</text>
  <text x="358" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">Seq2Seq+Attn (2014)</text>
  <text x="358" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">CNN/RNN 黄金期</text>

  <!-- Stage 3: Transformer革命 (Purple) -->
  <rect x="486" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M494,200 H678 Q686,200 686,208 V256 H486 V208 Q486,200 494,200Z" fill="#7B1FA2"/>
  <text x="586" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#F3E5F5">阶段 3</text>
  <text x="586" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2017 — 2018</text>
  <text x="586" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7B1FA2">Transformer 革命</text>
  <line x1="506" y1="296" x2="666" y2="296" stroke="#F3E5F5" stroke-width="1"/>
  <text x="586" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">Transformer (2017)</text>
  <text x="586" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">GPT-1 / BERT (2018)</text>
  <text x="586" y="400" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">注意力一统天下</text>

  <!-- Stage 4: 预训练规模化 (Orange) -->
  <rect x="714" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M722,200 H906 Q914,200 914,208 V256 H714 V208 Q714,200 722,200Z" fill="#F57C00"/>
  <text x="814" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFF3E0">阶段 4</text>
  <text x="814" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2018 — 2022</text>
  <text x="814" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#F57C00">预训练规模化</text>
  <line x1="734" y1="296" x2="894" y2="296" stroke="#FFF3E0" stroke-width="1"/>
  <text x="814" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">GPT-2 (2019)</text>
  <text x="814" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">GPT-3 (2020)</text>
  <text x="814" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">Scaling Law (2020)</text>
  <text x="814" y="410" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">Chinchilla (2022)</text>
  <text x="814" y="455" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">"大即美" 时代</text>

  <!-- Stage 5: 对齐与爆发 (Green) -->
  <rect x="942" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M950,200 H1134 Q1142,200 1142,208 V256 H942 V208 Q942,200 950,200Z" fill="#43A047"/>
  <text x="1042" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E8F5E9">阶段 5</text>
  <text x="1042" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2022 — 2023</text>
  <text x="1042" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#43A047">对齐与爆发</text>
  <line x1="962" y1="296" x2="1122" y2="296" stroke="#E8F5E9" stroke-width="1"/>
  <text x="1042" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">ChatGPT (2022.11)</text>
  <text x="1042" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">GPT-4 (2023)</text>
  <text x="1042" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">LLaMA (2023)</text>
  <text x="1042" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">RLHF 与开源浪潮</text>

  <!-- Stage 6: 推理与智能体 (Red) -->
  <rect x="1170" y="200" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M1178,200 H1362 Q1370,200 1370,208 V256 H1170 V208 Q1170,200 1178,200Z" fill="#E53935"/>
  <text x="1270" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFEBEE">阶段 6</text>
  <text x="1270" y="240" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">2024 — 2025</text>
  <text x="1270" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E53935">推理与智能体</text>
  <line x1="1190" y1="296" x2="1350" y2="296" stroke="#FFEBEE" stroke-width="1"/>
  <text x="1270" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">o1 (2024.9)</text>
  <text x="1270" y="350" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">DeepSeek-R1 (2025.1)</text>
  <text x="1270" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">Agentic AI (2025)</text>
  <text x="1270" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#78909C" font-style="italic">推理 + 智能体新范式</text>

  <!-- Bottom panel: Legend + Insights -->
  <rect x="30" y="560" width="1340" height="260" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <text x="50" y="585" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">阶段图例</text>

  <!-- Legend swatches row -->
  <rect x="50" y="610" width="14" height="14" fill="#546E7A" rx="2"/>
  <text x="70" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">前深度学习时代</text>

  <rect x="220" y="610" width="14" height="14" fill="#1E88E5" rx="2"/>
  <text x="240" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">深度学习复兴</text>

  <rect x="380" y="610" width="14" height="14" fill="#7B1FA2" rx="2"/>
  <text x="400" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">Transformer 革命</text>

  <rect x="560" y="610" width="14" height="14" fill="#F57C00" rx="2"/>
  <text x="580" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">预训练规模化</text>

  <rect x="720" y="610" width="14" height="14" fill="#43A047" rx="2"/>
  <text x="740" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">对齐与爆发</text>

  <rect x="860" y="610" width="14" height="14" fill="#E53935" rx="2"/>
  <text x="880" y="617" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">推理与智能体</text>

  <text x="1020" y="617" text-anchor="start" dominant-baseline="central" font-size="10" fill="#90A4AE" font-style="italic">阶段划分以代表性事件时间为准</text>

  <!-- Divider -->
  <line x1="50" y1="650" x2="1350" y2="650" stroke="#ECEFF1" stroke-width="1"/>

  <!-- Insights section -->
  <text x="50" y="675" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">关键演进洞察</text>

  <circle cx="58" cy="705" r="3" fill="#1E88E5"/>
  <text x="70" y="705" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">模型规模：百万参数 → 千亿参数 → 万亿参数，Scaling Law 驱动持续突破</text>

  <circle cx="58" cy="735" r="3" fill="#43A047"/>
  <text x="70" y="735" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">训练范式：监督学习 → 预训练+微调 → 预训练+对齐（SFT+RLHF）</text>

  <circle cx="58" cy="765" r="3" fill="#E53935"/>
  <text x="70" y="765" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">能力跃迁：感知 → 生成 → 推理 → 智能体，从被动回答走向主动规划与工具调用</text>

  <circle cx="58" cy="795" r="3" fill="#7B1FA2"/>
  <text x="70" y="795" text-anchor="start" dominant-baseline="central" font-size="11" fill="#37474F">开源生态：LLaMA 系列引爆开源浪潮，DeepSeek 等推动推理能力民主化</text>
</svg>
