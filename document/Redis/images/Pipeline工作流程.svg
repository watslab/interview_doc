<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#66BB6A"/></marker>
    <marker id="aho" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#FFB74D"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="480" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 客户端泳道 -->
  <rect x="40" y="40" width="380" height="420" rx="10" fill="#F5FAF5" stroke="#C8E6C9" stroke-width="1.5"/>
  <path d="M50,40 H410 Q420,40 420,50 V72 H40 V50 Q40,40 50,40Z" fill="#43A047"/>
  <text x="230" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">客户端</text>

  <!-- 服务端泳道 -->
  <rect x="500" y="40" width="380" height="420" rx="10" fill="#FFF9F3" stroke="#FFE0B2" stroke-width="1.5"/>
  <path d="M510,40 H870 Q880,40 880,50 V72 H500 V50 Q500,40 510,40Z" fill="#EF6C00"/>
  <text x="690" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">服务端</text>

  <!-- 客户端步骤 -->
  <rect x="70" y="112" width="320" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="96" cy="142" r="11" fill="#2E7D32"/>
  <text x="96" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="230" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">命令缓冲</text>
  <text x="230" y="156" text-anchor="middle" font-size="10.5" fill="#888888">将多个命令存入本地缓冲区</text>

  <rect x="70" y="232" width="320" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="96" cy="262" r="11" fill="#2E7D32"/>
  <text x="96" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="230" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">批量发送</text>
  <text x="230" y="276" text-anchor="middle" font-size="10.5" fill="#888888">达到阈值后一次性发送</text>

  <rect x="70" y="352" width="320" height="60" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="96" cy="382" r="11" fill="#2E7D32"/>
  <text x="96" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="230" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">批量接收</text>
  <text x="230" y="396" text-anchor="middle" font-size="10.5" fill="#888888">统一读取所有响应结果</text>

  <!-- 服务端步骤 -->
  <rect x="530" y="232" width="320" height="60" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="556" cy="262" r="11" fill="#E65100"/>
  <text x="556" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="690" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">顺序执行</text>
  <text x="690" y="276" text-anchor="middle" font-size="10.5" fill="#888888">按顺序执行所有命令</text>

  <rect x="530" y="352" width="320" height="60" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <circle cx="556" cy="382" r="11" fill="#E65100"/>
  <text x="556" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="690" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">打包响应</text>
  <text x="690" y="396" text-anchor="middle" font-size="10.5" fill="#888888">将结果打包返回</text>

  <!-- 连接线（最后绘制）：按步骤编号流转 -->
  <line x1="230" y1="172" x2="230" y2="232" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="390" y1="262" x2="530" y2="262" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="690" y1="292" x2="690" y2="352" stroke="#FFB74D" stroke-width="1.5" marker-end="url(#aho)"/>
  <line x1="530" y1="382" x2="390" y2="382" stroke="#FFB74D" stroke-width="1.5" marker-end="url(#aho)"/>
</svg>
