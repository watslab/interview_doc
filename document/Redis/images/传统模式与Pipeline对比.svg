<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 630" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#E57373"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#66BB6A"/></marker>
  </defs>

  <rect x="10" y="10" width="900" height="610" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 左侧面板：传统模式 -->
  <rect x="40" y="50" width="400" height="560" rx="10" fill="#FDF0F0" stroke="#E57373" stroke-width="1.5"/>
  <path d="M50,50 H430 Q440,50 440,60 V86 H40 V60 Q40,50 50,50Z" fill="#E53935"/>
  <text x="240" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">传统模式：逐条请求-响应</text>

  <rect x="90" y="111" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="240" y="137" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">客户端发送命令1</text>

  <rect x="90" y="183" width="300" height="42" rx="8" fill="#FFEBEE" stroke="#E57373" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="240" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">等待响应1</text>

  <rect x="90" y="255" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="240" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">客户端发送命令2</text>

  <rect x="90" y="327" width="300" height="42" rx="8" fill="#FFEBEE" stroke="#E57373" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="240" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">等待响应2</text>

  <rect x="90" y="399" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="240" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">客户端发送命令3</text>

  <rect x="90" y="471" width="300" height="42" rx="8" fill="#FFEBEE" stroke="#E57373" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="240" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">等待响应3</text>

  <rect x="90" y="543" width="300" height="42" rx="8" fill="#C62828" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="240" y="569" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">总耗时 = 3 × RTT</text>

  <!-- 右侧面板：Pipeline -->
  <rect x="480" y="50" width="400" height="560" rx="10" fill="#F2FAF2" stroke="#81C784" stroke-width="1.5"/>
  <path d="M490,50 H870 Q880,50 880,60 V86 H480 V60 Q480,50 490,50Z" fill="#43A047"/>
  <text x="680" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Pipeline：批量发送-批量接收</text>

  <rect x="530" y="157" width="300" height="72" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="680" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">客户端打包发送</text>
  <text x="680" y="207" text-anchor="middle" font-size="10.5" fill="#888888">命令1 + 命令2 + 命令3</text>

  <rect x="530" y="273" width="300" height="72" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="680" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">服务器依次执行</text>
  <text x="680" y="323" text-anchor="middle" font-size="10.5" fill="#888888">按命令顺序处理</text>

  <rect x="530" y="389" width="300" height="72" rx="8" fill="#FFFFFF" stroke="#66BB6A" stroke-width="1.5" filter="url(#s1)"/>
  <text x="680" y="419" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">一次性返回所有响应</text>
  <text x="680" y="439" text-anchor="middle" font-size="10.5" fill="#888888">响应顺序与命令一致</text>

  <rect x="530" y="491" width="300" height="48" rx="8" fill="#2E7D32" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="680" y="520" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">总耗时 ≈ 1 × RTT</text>

  <!-- 连接线（最后绘制） -->
  <line x1="240" y1="153" x2="240" y2="183" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>
  <line x1="240" y1="225" x2="240" y2="255" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>
  <line x1="240" y1="297" x2="240" y2="327" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>
  <line x1="240" y1="369" x2="240" y2="399" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>
  <line x1="240" y1="441" x2="240" y2="471" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>
  <line x1="240" y1="513" x2="240" y2="543" stroke="#E57373" stroke-width="1.5" marker-end="url(#ahr)"/>

  <line x1="680" y1="229" x2="680" y2="273" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="680" y1="345" x2="680" y2="389" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="680" y1="461" x2="680" y2="491" stroke="#66BB6A" stroke-width="1.5" marker-end="url(#ahg)"/>
</svg>
