<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="536" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H938 Q950,10 950,22 V50 H10 Z" fill="#37474F"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">UDP 与 TCP 首部对比</text>

  <!-- Panel labels -->
  <rect x="40" y="70" width="420" height="30" rx="4" fill="#1B5E20"/>
  <text x="250" y="85" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">UDP 首部（RFC 768）</text>

  <rect x="500" y="70" width="420" height="30" rx="4" fill="#1565C0"/>
  <text x="710" y="85" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">TCP 首部（RFC 9293）</text>

  <!-- Bit ruler: UDP panel (grid 40-460, mid 250) -->
  <text x="40" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="247" y="112" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">15</text>
  <text x="253" y="112" text-anchor="start" dominant-baseline="central" font-size="10" fill="#757575">16</text>
  <text x="460" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">31</text>
  <line x1="40" y1="116" x2="40" y2="124" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="250" y1="116" x2="250" y2="124" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="460" y1="116" x2="460" y2="124" stroke="#90A4AE" stroke-width="0.5"/>

  <!-- Bit ruler: TCP panel (grid 500-920, mid 710) -->
  <text x="500" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="707" y="112" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">15</text>
  <text x="713" y="112" text-anchor="start" dominant-baseline="central" font-size="10" fill="#757575">16</text>
  <text x="920" y="112" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">31</text>
  <line x1="500" y1="116" x2="500" y2="124" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="710" y1="116" x2="710" y2="124" stroke="#90A4AE" stroke-width="0.5"/>
  <line x1="920" y1="116" x2="920" y2="124" stroke="#90A4AE" stroke-width="0.5"/>

  <!-- UDP grid: Row 1 (y=124) Source Port | Destination Port -->
  <rect x="40" y="124" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="145" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Source Port（源端口）</text>
  <text x="145" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="250" y="124" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="355" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Destination Port（目的端口）</text>
  <text x="355" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- UDP grid: Row 2 (y=172) Length | Checksum -->
  <rect x="40" y="172" width="210" height="48" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="145" y="187" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#E65100">Length（长度）</text>
  <text x="145" y="206" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="250" y="172" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="355" y="187" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Checksum（校验和）</text>
  <text x="355" y="206" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- UDP grid: Data row (y=220) -->
  <rect x="40" y="220" width="420" height="40" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="250" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#37474F">Data（数据，长度可变，不计入首部）</text>

  <!-- TCP grid: Row 1 (y=124) Source Port | Destination Port -->
  <rect x="500" y="124" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Source Port（源端口）</text>
  <text x="605" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="710" y="124" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Destination Port（目的端口）</text>
  <text x="815" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- TCP grid: Row 2 (y=172) Sequence Number -->
  <rect x="500" y="172" width="420" height="48" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="710" y="187" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">Sequence Number（序列号）</text>
  <text x="710" y="206" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">32 位</text>

  <!-- TCP grid: Row 3 (y=220) Acknowledgment Number -->
  <rect x="500" y="220" width="420" height="48" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="710" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">Acknowledgment Number（确认号）</text>
  <text x="710" y="254" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">32 位</text>

  <!-- TCP grid: Row 4 (y=268) Data Offset + Reserved + Flags | Window Size -->
  <rect x="500" y="268" width="210" height="48" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="283" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Data Offset + Reserved + Flags</text>
  <text x="605" y="302" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位（4+3+9）</text>

  <rect x="710" y="268" width="210" height="48" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="283" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Window Size（窗口大小）</text>
  <text x="815" y="302" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- TCP grid: Row 5 (y=316) Checksum | Urgent Pointer -->
  <rect x="500" y="316" width="210" height="48" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="605" y="331" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1565C0">Checksum（校验和）</text>
  <text x="605" y="350" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <rect x="710" y="316" width="210" height="48" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="815" y="331" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#1B5E20">Urgent Pointer（紧急指针）</text>
  <text x="815" y="350" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">16 位</text>

  <!-- TCP grid: Options row (y=364) -->
  <rect x="500" y="364" width="420" height="40" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="710" y="384" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#1B5E20">Options + Padding（选项与填充，0~40 字节，需 4 字节对齐）</text>

  <!-- TCP grid: Data row (y=404) -->
  <rect x="500" y="404" width="420" height="40" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#s1)"/>
  <text x="710" y="424" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#37474F">Data（数据，长度可变，不计入首部）</text>

  <!-- Legend box (under UDP panel, bottom aligned with TCP grid) -->
  <rect x="40" y="280" width="420" height="164" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="56" y="302" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#37474F">颜色图例</text>

  <rect x="56" y="320" width="28" height="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="92" y="328" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">共有字段（端口、校验和）：两协议均设置</text>

  <rect x="56" y="352" width="28" height="16" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="92" y="360" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">UDP 特有（Length）：TCP 无对应字段</text>

  <rect x="56" y="384" width="28" height="16" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="92" y="392" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">TCP 特有（序号、标志、窗口等）：支撑可靠传输与速率控制</text>

  <rect x="56" y="416" width="28" height="16" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="92" y="424" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">虚线框：长度可变（选项属于首部，数据不属于）</text>

  <!-- Footer: length comparison -->
  <rect x="40" y="466" width="880" height="56" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="480" y="486" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#5D4037">首部长度对比：UDP 固定 8 字节 · TCP 20~60 字节</text>
  <text x="480" y="508" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5D4037">TCP = 固定部分 20 字节 + 选项 0~40 字节，实际长度由 Data Offset 字段指示</text>
</svg>
