<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="310" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#1E88E5" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">熔断降级机制</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">数据库压力触发状态转换：正常 → 降级 → 恢复</text>

  <!-- ============ 正常状态 ============ -->
  <rect x="30" y="90" width="280" height="200" rx="8" fill="#F4FAF5" stroke="#C8E6C9" stroke-width="1"/>
  <rect x="45" y="100" width="100" height="24" rx="12" fill="#43A047"/>
  <text x="95" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">正常状态</text>

  <rect x="45" y="163" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="170" y="181" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">请求查询缓存</text>
  <rect x="45" y="209" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="170" y="227" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">缓存未命中，查询数据库</text>

  <!-- ============ 降级状态 ============ -->
  <rect x="340" y="90" width="280" height="200" rx="8" fill="#FEF6F6" stroke="#E57373" stroke-width="1"/>
  <rect x="355" y="100" width="100" height="24" rx="12" fill="#C62828"/>
  <text x="405" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">降级状态</text>

  <rect x="355" y="142" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="480" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">检测到数据库压力过大</text>
  <rect x="355" y="186" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="480" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">开启熔断</text>
  <rect x="355" y="230" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="480" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">返回默认值或错误</text>

  <!-- ============ 恢复状态 ============ -->
  <rect x="650" y="90" width="280" height="200" rx="8" fill="#FFF9F2" stroke="#FFCC80" stroke-width="1"/>
  <rect x="665" y="100" width="100" height="24" rx="12" fill="#F57C00"/>
  <text x="715" y="112" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF">恢复状态</text>

  <rect x="665" y="142" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#FFCC80" stroke-width="1.2"/>
  <text x="790" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">数据库压力降低</text>
  <rect x="665" y="186" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#FFCC80" stroke-width="1.2"/>
  <text x="790" y="204" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">关闭熔断</text>
  <rect x="665" y="230" width="250" height="36" rx="6" fill="#FFFFFF" stroke="#FFCC80" stroke-width="1.2"/>
  <text x="790" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#37474F">恢复正常访问</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M312,190 L338,190" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M622,190 L648,190" stroke="#90A4AE" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
</svg>
