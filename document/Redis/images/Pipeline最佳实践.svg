<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <rect x="10" y="10" width="900" height="390" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 第一列：推荐使用 -->
  <rect x="30" y="40" width="272" height="330" rx="10" fill="#F2FAF2" stroke="#81C784" stroke-width="1.5"/>
