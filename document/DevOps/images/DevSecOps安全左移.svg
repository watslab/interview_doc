<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#E53935"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="900" height="320" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="460" y="31" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#263238">DevSecOps 安全左移</text>

  <!-- Shift-Left caption (above the arrow) -->
  <text x="460" y="57.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#E53935">安全左移：越早发现，修复成本越低</text>

  <!-- SDLC Stage Boxes (blue) -->
  <rect x="20" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">编码</text>

  <rect x="172" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="232" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">代码审查</text>

  <rect x="324" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="384" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">构建</text>

  <rect x="476" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="536" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">测试</text>

  <rect x="628" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="688" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">部署</text>

  <rect x="780" y="93" width="120" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="113" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">运行时</text>

  <!-- Security Check Boxes (orange) -->
  <rect x="20" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">Pre-commit</text>
  <text x="80" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Gitleaks</text>

  <rect x="172" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="232" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">SAST</text>
  <text x="232" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">SonarQube</text>

  <rect x="324" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="384" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">SCA</text>
  <text x="384" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Trivy</text>

  <rect x="476" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="536" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">DAST</text>
  <text x="536" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">OWASP ZAP</text>

  <rect x="628" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="688" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">IaC 扫描</text>
  <text x="688" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Kyverno</text>

  <rect x="780" y="168" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#E65100">运行时安全</text>
  <text x="840" y="203" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9E6500">Falco / Tetragon</text>

  <!-- Cost labels (green to dark red, increasing) -->
  <text x="80" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#43A047">$60</text>
  <text x="232" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#7CB342">$300</text>
  <text x="384" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FBC02D">$1,000</text>
  <text x="536" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#F57C00">$3,000</text>
  <text x="688" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#E53935">$10,000</text>
  <text x="840" y="257.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#B71C1C">$30,000+</text>

  <!-- Cost trend caption (below the arrow) -->
  <text x="460" y="302.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#E53935">越晚发现，修复成本越高</text>

  <!-- Connection Lines (drawn last for z-order) -->
  <!-- Shift-left arrow (tip at left end, pointing left) -->
  <line x1="890" y1="71" x2="30" y2="71" stroke="#E53935" stroke-width="2" marker-end="url(#ahr)"/>

  <!-- Stage arrows (horizontal) -->
  <line x1="141" y1="113" x2="171" y2="113" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="293" y1="113" x2="323" y2="113" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="445" y1="113" x2="475" y2="113" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="597" y1="113" x2="627" y2="113" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="749" y1="113" x2="779" y2="113" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ahg)"/>

  <!-- Dashed lines: stages to security checks -->
  <line x1="80" y1="130" x2="80" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="232" y1="130" x2="232" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="384" y1="130" x2="384" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="536" y1="130" x2="536" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="688" y1="130" x2="688" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="840" y1="130" x2="840" y2="166" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Dashed lines: security checks to fix cost -->
  <line x1="80" y1="219" x2="80" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="232" y1="219" x2="232" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="384" y1="219" x2="384" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="536" y1="219" x2="536" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="688" y1="219" x2="688" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="840" y1="219" x2="840" y2="241" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Cost trend arrow (horizontal, left to right) -->
  <line x1="30" y1="282" x2="890" y2="282" stroke="#E53935" stroke-width="2" marker-end="url(#ahr)"/>
</svg>
