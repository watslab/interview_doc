<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#B0BEC5"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="390" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M40,20 H920 Q930,20 930,30 V62 H30 V30 Q30,20 40,20Z" fill="#1565C0" filter="url(#s1)"/>
  <text x="480" y="41" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">事务并发问题</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#757575">脏读、不可重复读与幻读的定义及发生过程</text>

  <!-- ============ Column 1: 脏读 ============ -->
  <rect x="30" y="90" width="280" height="290" rx="8" fill="#FEF6F6" stroke="#E57373" stroke-width="1"/>
  <path d="M38,90 H302 Q310,90 310,98 V128 H30 V98 Q30,90 38,90Z" fill="#C62828"/>
  <text x="170" y="109" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#FFFFFF">脏读 · Dirty Read</text>

  <rect x="45" y="150" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5"/>
  <text x="170" y="166" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 读取了事务 B</text>
  <text x="170" y="188" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">未提交的数据</text>

  <rect x="45" y="234" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5"/>
  <text x="170" y="260" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 B 回滚</text>

  <rect x="45" y="318" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5"/>
  <text x="170" y="344" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 读取的是无效数据</text>

  <!-- ============ Column 2: 不可重复读 ============ -->
  <rect x="340" y="90" width="280" height="290" rx="8" fill="#FFF9F2" stroke="#FFB74D" stroke-width="1"/>
  <path d="M348,90 H612 Q620,90 620,98 V128 H340 V98 Q340,90 348,90Z" fill="#EF6C00"/>
  <text x="480" y="109" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#FFFFFF">不可重复读 · Non-Repeatable Read</text>

  <rect x="355" y="150" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="480" y="176" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 多次读取同一数据</text>

  <rect x="355" y="234" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="480" y="260" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 B 修改并提交该数据</text>

  <rect x="355" y="318" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="480" y="334" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 两次读取结果不一致</text>
  <text x="480" y="356" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">（针对修改 / 删除）</text>

  <!-- ============ Column 3: 幻读 ============ -->
  <rect x="650" y="90" width="280" height="290" rx="8" fill="#FAF4FB" stroke="#CE93D8" stroke-width="1"/>
  <path d="M658,90 H922 Q930,90 930,98 V128 H650 V98 Q650,90 658,90Z" fill="#7B1FA2"/>
  <text x="790" y="109" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#FFFFFF">幻读 · Phantom Read</text>

  <rect x="665" y="150" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="790" y="176" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 按条件查询</text>

  <rect x="665" y="234" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="790" y="260" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 B 插入或删除数据</text>

  <rect x="665" y="318" width="250" height="52" rx="6" fill="#FFFFFF" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="790" y="334" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">事务 A 再次查询</text>
  <text x="790" y="356" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#37474F">结果集数量变化</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <path d="M170,204 L170,232" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M170,288 L170,316" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,204 L480,232" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M480,288 L480,316" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M790,204 L790,232" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M790,288 L790,316" stroke="#B0BEC5" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
</svg>
