<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="600" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Docker 客户端 -->
  <rect x="80" y="46" width="440" height="124" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Docker 客户端</text>
  <rect x="110" y="96" width="180" height="54" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="200" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">docker CLI</text>
  <rect x="310" y="96" width="180" height="54" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="400" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">Docker API</text>

  <!-- 客户端 → Daemon -->
  <line x1="200" y1="150" x2="235" y2="242" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="192" y="196" text-anchor="end" font-size="10.5" fill="#757575">docker 命令</text>
  <line x1="400" y1="150" x2="365" y2="242" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="408" y="196" text-anchor="start" font-size="10.5" fill="#757575">REST API 调用</text>

  <!-- Docker Daemon -->
  <rect x="130" y="246" width="340" height="76" rx="10" fill="#1565C0" filter="url(#s1)"/>
  <text x="300" y="277" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">Docker Daemon（dockerd）</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#BBDEFB">镜像 · 容器 · 网络 · 数据卷的统一管理入口</text>

  <!-- Daemon → 本地资源 -->
  <line x1="300" y1="322" x2="300" y2="392" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="315" y="360" text-anchor="start" font-size="10.5" fill="#757575">创建 / 管理</text>

  <!-- 本地资源 -->
  <rect x="80" y="396" width="440" height="170" rx="10" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2" filter="url(#s1)"/>
  <text x="300" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#455A64">本地资源</text>
  <rect x="100" y="452" width="72" height="64" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="136" y="478" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">镜像 A</text>
  <text x="136" y="500" text-anchor="middle" font-size="9.5" fill="#888888">Image</text>
  <rect x="182" y="452" width="72" height="64" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="218" y="478" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">镜像 B</text>
  <text x="218" y="500" text-anchor="middle" font-size="9.5" fill="#888888">Image</text>
  <rect x="264" y="452" width="72" height="64" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="300" y="478" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">容器 A</text>
  <text x="300" y="500" text-anchor="middle" font-size="9.5" fill="#888888">Container</text>
  <rect x="346" y="452" width="72" height="64" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="382" y="478" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">容器 B</text>
  <text x="382" y="500" text-anchor="middle" font-size="9.5" fill="#888888">Container</text>
  <rect x="428" y="452" width="72" height="64" rx="6" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.2" filter="url(#s1)"/>
  <text x="464" y="478" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">数据卷</text>
  <text x="464" y="500" text-anchor="middle" font-size="9.5" fill="#888888">Volume</text>

  <!-- 镜像仓库 -->
  <rect x="640" y="210" width="280" height="260" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="780" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#EF6C00">镜像仓库（Registry）</text>
  <rect x="665" y="262" width="230" height="76" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="780" y="294" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Docker Hub</text>
  <text x="780" y="317" text-anchor="middle" font-size="10" fill="#888888">官方公共镜像仓库</text>
  <rect x="665" y="358" width="230" height="76" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="780" y="390" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">私有仓库</text>
  <text x="780" y="413" text-anchor="middle" font-size="10" fill="#888888">Harbor · Nexus 等</text>

  <!-- Daemon ↔ 仓库 -->
  <path d="M470,292 C520,292 575,340 615,340 L639,340" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-start="url(#ahr)" marker-end="url(#ah)"/>
  <rect x="512" y="309" width="68" height="14" fill="#FAFAFA"/>
  <text x="546" y="320" text-anchor="middle" font-size="10.5" fill="#757575">push / pull</text>

  <!-- 底部说明 -->
  <text x="480" y="596" text-anchor="middle" font-size="10.5" fill="#757575">客户端经由 CLI 或 REST API 与 Daemon 交互，Daemon 管理本地镜像、容器与数据卷，并与镜像仓库完成镜像的推送与拉取</text>
</svg>
