<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="880" height="560" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="450" y="44" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Kubernetes 网络分层架构</text>

  <!-- 应用层 -->
  <rect x="60" y="68" width="780" height="60" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,68 H832 Q840,68 840,76 V96 H60 V76 Q60,68 68,68Z" fill="#43A047"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">应用层：微服务 / Pod（IP-per-Pod，Pod 间无 NAT）</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#2E7D32">业务工作负载</text>

  <line x1="450" y1="130" x2="450" y2="148" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Service Mesh -->
  <rect x="60" y="150" width="780" height="70" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,150 H832 Q840,150 840,158 V178 H60 V158 Q60,150 68,150Z" fill="#7B1FA2"/>
  <text x="450" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">Service Mesh 层：mTLS · 流量管理 · 可观测性 · 策略</text>
  <rect x="90" y="186" width="240" height="28" rx="5" fill="#FFF" stroke="#CE93D8" stroke-width="1"/>
  <text x="210" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#6A1B9A">Sidecar（Envoy）</text>
  <rect x="350" y="186" width="240" height="28" rx="5" fill="#FFF" stroke="#CE93D8" stroke-width="1"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#6A1B9A">Ambient（ztunnel + waypoint）</text>
  <rect x="610" y="186" width="210" height="28" rx="5" fill="#FFF" stroke="#CE93D8" stroke-width="1"/>
  <text x="715" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#6A1B9A">eBPF（Cilium SM）</text>

  <line x1="450" y1="222" x2="450" y2="240" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Service / kube-proxy -->
  <rect x="60" y="242" width="780" height="60" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,242 H832 Q840,242 840,250 V270 H60 V250 Q60,242 68,242Z" fill="#1E88E5"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">Service 抽象层：ClusterIP / NodePort / LoadBalancer</text>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#1565C0">kube-proxy（iptables / IPVS / nftables）或 eBPF 替代</text>

  <line x1="450" y1="304" x2="450" y2="322" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Gateway / Ingress -->
  <rect x="60" y="324" width="780" height="50" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,324 H832 Q840,324 840,332 V352 H60 V332 Q60,324 68,324Z" fill="#F57C00"/>
  <text x="450" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">Ingress / Gateway API 层（南北向入口）</text>
  <text x="450" y="366" text-anchor="middle" font-size="11" fill="#E65100">HTTPRoute · GRPCRoute（Gateway API，替代 Ingress）</text>

  <line x1="450" y1="376" x2="450" y2="394" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- NetworkPolicy + CNI -->
  <rect x="60" y="396" width="780" height="70" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,396 H832 Q840,396 840,404 V424 H60 V404 Q60,396 68,396Z" fill="#546E7A"/>
  <text x="450" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">CNI 数据平面层 + NetworkPolicy（L3/L4 策略）</text>
  <rect x="90" y="432" width="140" height="26" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="160" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Calico（BGP/eBPF）</text>
  <rect x="250" y="432" width="140" height="26" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="320" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Cilium（eBPF）</text>
  <rect x="410" y="432" width="140" height="26" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="480" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Flannel（VXLAN）</text>
  <rect x="570" y="432" width="140" height="26" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="640" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Antrea（OVS）</text>
  <rect x="730" y="432" width="100" height="26" rx="5" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
  <text x="780" y="449" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">Kube-OVN</text>

  <line x1="450" y1="468" x2="450" y2="486" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 内核层 -->
  <rect x="60" y="488" width="780" height="50" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#s1)"/>
  <path d="M68,488 H832 Q840,488 840,496 V516 H60 V496 Q60,488 68,488Z" fill="#E53935"/>
  <text x="450" y="506" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">Linux 内核层</text>
  <text x="450" y="528" text-anchor="middle" font-size="11" fill="#C62828">netfilter/iptables · IPVS · eBPF · XDP · TC · OVS</text>

  <text x="450" y="558" text-anchor="middle" font-size="11" fill="#90A4AE">Pod 网络模型四项要求：Pod 唯一 IP · 容器共享网络命名空间 · Pod 间无 NAT · 节点可访问本机 Pod</text>
</svg>
