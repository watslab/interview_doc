  <text x="166" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">批量读取场景</text>
  <rect x="54" y="234" width="224" height="46" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="166" y="261" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">缓存预热</text>
  <rect x="54" y="302" width="224" height="46" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="166" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">数据迁移</text>

  <!-- 第二列：避免使用 -->
  <rect x="324" y="40" width="272" height="330" rx="10" fill="#FDF0F0" stroke="#E57373" stroke-width="1.5"/>
  <path d="M334,40 H586 Q596,40 596,50 V76 H324 V50 Q324,40 334,40Z" fill="#E53935"/>
  <text x="460" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">避免使用</text>
