<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="620" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 应用层 -->
  <text x="40" y="98" text-anchor="start" font-size="11" fill="#757575">应用层</text>
  <rect x="390" y="64" width="180" height="60" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6A1B9A">应用程序</text>
  <line x1="480" y1="124" x2="480" y2="170" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="495" y="150" text-anchor="start" font-size="9.5" fill="#757575">1 : 1</text>

  <!-- Stack 层 -->
  <text x="40" y="206" text-anchor="start" font-size="11" fill="#757575">Stack 层</text>
  <rect x="330" y="172" width="300" height="60" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#283593">Stack（栈）</text>
  <text x="480" y="214" text-anchor="middle" font-size="9.5" fill="#5C6BC0">docker-compose.yml 定义的服务集合</text>
  <path d="M430,232 C430,258 340,250 340,276 L340,288" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M530,232 C530,258 620,250 620,276 L620,288" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="480" y="264" text-anchor="middle" font-size="9.5" fill="#757575">1 : N</text>

  <!-- Service 层 -->
  <text x="40" y="326" text-anchor="start" font-size="11" fill="#757575">Service 层</text>
  <rect x="220" y="292" width="240" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="340" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Service A</text>
  <text x="340" y="335" text-anchor="middle" font-size="9.5" fill="#546E7A">镜像 · 端口 · 副本数</text>
  <rect x="500" y="292" width="240" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="620" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Service B</text>
  <text x="620" y="335" text-anchor="middle" font-size="9.5" fill="#546E7A">镜像 · 端口 · 副本数</text>
  <path d="M340,352 C340,380 201,372 201,398 L201,410" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M340,352 C340,380 387,372 387,398 L387,410" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M620,352 C620,380 573,372 573,398 L573,410" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M620,352 C620,380 759,372 759,398 L759,410" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="278" y="384" text-anchor="middle" font-size="9.5" fill="#757575">1 : N</text>

  <!-- Task 层 -->
  <text x="40" y="444" text-anchor="start" font-size="11" fill="#757575">Task 层</text>
  <rect x="126" y="412" width="150" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="201" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Task 1</text>
  <rect x="312" y="412" width="150" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="387" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Task 2</text>
  <rect x="498" y="412" width="150" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="573" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Task 3</text>
  <rect x="684" y="412" width="150" height="56" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="759" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Task 4</text>
  <line x1="201" y1="468" x2="201" y2="514" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="387" y1="468" x2="387" y2="514" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="573" y1="468" x2="573" y2="514" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="759" y1="468" x2="759" y2="514" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="216" y="494" text-anchor="start" font-size="9.5" fill="#757575">1 : 1</text>

  <!-- Container 层 -->
  <text x="40" y="552" text-anchor="start" font-size="11" fill="#757575">Container 层</text>
  <rect x="126" y="520" width="150" height="56" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="201" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">容器 1</text>
  <rect x="312" y="520" width="150" height="56" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="387" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">容器 2</text>
  <rect x="498" y="520" width="150" height="56" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="573" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">容器 3</text>
  <rect x="684" y="520" width="150" height="56" rx="6" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="759" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">容器 4</text>

  <!-- 底部说明 -->
  <text x="480" y="607" text-anchor="middle" font-size="10.5" fill="#757575">Stack 聚合多个 Service；Service 按副本数拆分为多个 Task；每个 Task 由 Swarm 调度启动一个容器实例</text>
</svg>
