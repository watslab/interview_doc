<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 402" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="980" height="382" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 缓存命中（全部满足） -->
  <rect x="60" y="45" width="390" height="216" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="75" y="75" text-anchor="start" font-size="12" font-weight="bold" fill="#1B5E20">缓存命中</text>
  <rect x="80" y="95" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="121.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">父层相同</text>
  <rect x="80" y="149" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="175.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">指令相同</text>
  <rect x="80" y="203" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="255" y="229.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">文件内容相同</text>

  <!-- 缓存失效（任一触发） -->
  <rect x="550" y="45" width="390" height="216" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="1.5" filter="url(#s1)"/>
  <text x="565" y="75" text-anchor="start" font-size="12" font-weight="bold" fill="#B71C1C">缓存失效</text>
  <rect x="570" y="95" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="745" y="121.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">父层缓存失效</text>
  <rect x="570" y="149" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="745" y="175.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">指令变化</text>
  <rect x="570" y="203" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.2" filter="url(#s1)"/>
  <text x="745" y="229.3" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">文件变化</text>

  <!-- 行对应关系（同一条件的命中/失效形态） -->
  <text x="500" y="121.3" text-anchor="middle" font-size="14" fill="#90A4AE">↔</text>
  <text x="500" y="175.3" text-anchor="middle" font-size="14" fill="#90A4AE">↔</text>
  <text x="500" y="229.3" text-anchor="middle" font-size="14" fill="#90A4AE">↔</text>

  <!-- 判断结果 -->
  <line x1="255" y1="262" x2="255" y2="304" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="267" y="286" text-anchor="start" font-size="10" fill="#2E7D32">全部满足</text>
  <rect x="165" y="305" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="255" y="335.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">使用缓存</text>
  <line x1="745" y1="262" x2="745" y2="304" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="757" y="286" text-anchor="start" font-size="10" fill="#C62828">任一触发</text>
  <rect x="655" y="305" width="180" height="52" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="745" y="335.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">重新构建</text>
</svg>
