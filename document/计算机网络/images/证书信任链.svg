<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#546E7A"/>
    </marker>
    <marker id="arrowLight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="680" height="400" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Global title -->
  <text x="350" y="35" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#37474F">证书信任链（Certificate Trust Chain）</text>

  <!-- ============ Left column: 3-tier hierarchy ============ -->

  <!-- Root CA (green) -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="340" height="75" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
    <path d="M38,70 H362 Q370,70 370,78 V95 H30 V78 Q30,70 38,70Z" fill="#43A047"/>
    <!-- Lock icon -->
    <g transform="translate(45,75)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="0" y="6" width="10" height="8" rx="1" fill="#FFFFFF" stroke="none"/>
      <path d="M2,6 V4 Q2,1 5,1 Q8,1 8,4 V6"/>
    </g>
    <text x="200" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">根 CA（Root CA）</text>
    <text x="200" y="112" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">自签名 · 预装在浏览器/OS 中</text>
    <text x="200" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#666">私钥离线存储于 HSM</text>
  </g>

  <!-- Intermediate CA (blue) -->
  <g filter="url(#shadow)">
    <rect x="30" y="185" width="340" height="75" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <path d="M38,185 H362 Q370,185 370,193 V210 H30 V193 Q30,185 38,185Z" fill="#1E88E5"/>
    <text x="200" y="197" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">中间 CA（Intermediate CA）</text>
    <text x="200" y="227" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">由根 CA 签发</text>
    <text x="200" y="245" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#666">实际签发终端证书</text>
  </g>

  <!-- End-entity Certificate (purple) -->
  <g filter="url(#shadow)">
    <rect x="30" y="300" width="340" height="75" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <path d="M38,300 H362 Q370,300 370,308 V325 H30 V308 Q30,300 38,300Z" fill="#7B1FA2"/>
    <text x="200" y="312" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">终端证书（End-entity Certificate）</text>
    <text x="200" y="342" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">部署在服务器上</text>
    <text x="200" y="360" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#666">绑定域名与公钥</text>
  </g>

  <!-- ============ Right column: verification flow ============ -->

  <!-- Right panel background -->
  <rect x="410" y="70" width="260" height="305" rx="8" fill="#F5F5F5" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Right panel title -->
  <text x="540" y="88" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#37474F">信任链验证流程</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
    <circle cx="450" cy="130" r="10" fill="#1E88E5"/>
    <text x="450" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="555" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">验证终端证书签名</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="430" y="170" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
    <circle cx="450" cy="190" r="10" fill="#1E88E5"/>
    <text x="450" y="190" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="555" y="190" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">验证中间 CA 签名</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="430" y="230" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5"/>
    <circle cx="450" cy="250" r="10" fill="#1E88E5"/>
    <text x="450" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="555" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#333">追溯到根 CA</text>
  </g>

  <!-- Step 4 (success) -->
  <g filter="url(#shadow)">
    <rect x="430" y="290" width="220" height="40" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
    <circle cx="450" cy="310" r="10" fill="#43A047"/>
    <text x="450" y="310" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="555" y="310" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#2E7D32">验证通过</text>
  </g>

  <!-- Hint text -->
  <text x="540" y="355" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575" font-style="italic">浏览器逐级验证至受信任根</text>

  <!-- ============ Connection arrows (drawn last) ============ -->

  <!-- Root -> Intermediate: 签发 (down) -->
  <line x1="140" y1="148" x2="140" y2="182" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">签发</text>

  <!-- Intermediate -> Root: 签名验证 (up) -->
  <line x1="260" y1="182" x2="260" y2="148" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="165" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">签名验证</text>

  <!-- Intermediate -> End-entity: 签发 (down) -->
  <line x1="140" y1="263" x2="140" y2="297" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">签发</text>

  <!-- End-entity -> Intermediate: 签名验证 (up) -->
  <line x1="260" y1="297" x2="260" y2="263" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#546E7A">签名验证</text>

  <!-- Verification flow arrows -->
  <line x1="540" y1="150" x2="540" y2="168" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrowLight)"/>
  <line x1="540" y1="210" x2="540" y2="228" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrowLight)"/>
  <line x1="540" y1="270" x2="540" y2="288" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#arrowLight)"/>

</svg>
