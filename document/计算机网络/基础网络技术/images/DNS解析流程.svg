<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah-blue" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#1E88E5"/></marker>
    <marker id="ah-green" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#43A047"/></marker>
    <marker id="ah-orange" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#F57C00"/></marker>
    <marker id="ah-purple" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#7B1FA2"/></marker>
    <marker id="ah-indigo" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#3949AB"/></marker>
    <marker id="ah-teal" markerWidth="6" markerHeight="4.5" refX="6" refY="2.25" orient="auto"><path d="M0,0 L6,2.25 L0,4.5Z" fill="#00897B"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="980" height="650" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H978 Q990,10 990,22 V50 H10 Z" fill="#37474F"/>
  <text x="500" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">DNS 解析流程时序图（www.example.com）</text>

  <!-- Entity headers -->
  <rect x="30" y="70" width="140" height="40" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#s1)"/>
  <text x="100" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1565C0">浏览器</text>

  <rect x="190" y="70" width="140" height="40" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#s1)"/>
  <text x="260" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20">本地缓存</text>

  <rect x="350" y="70" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="420" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#E65100">本地域名服务器</text>

  <rect x="510" y="70" width="140" height="40" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="580" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#4A148C">根域名服务器</text>

  <rect x="670" y="70" width="140" height="40" rx="6" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.5" filter="url(#s1)"/>
  <text x="740" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#283593">顶级域名服务器</text>

  <rect x="830" y="70" width="140" height="40" rx="6" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5" filter="url(#s1)"/>
  <text x="900" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#004D40">权威域名服务器</text>

  <!-- Lifelines -->
  <line x1="100" y1="110" x2="100" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="260" y1="110" x2="260" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="110" x2="420" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580" y1="110" x2="580" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="740" y1="110" x2="740" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="900" y1="110" x2="900" y2="565" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ① 浏览器 → 本地缓存：查询 -->
  <path d="M100,150 L260,150" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="135" y="140" width="95" height="20" rx="3" fill="#E3F2FD" stroke="#1E88E5" stroke-width="0.5"/>
  <circle cx="148" cy="150" r="8" fill="#1E88E5"/>
  <text x="148" y="150" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="161" y="150" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">查询本地缓存</text>

  <!-- 本地缓存 → 浏览器：未命中 -->
  <path d="M260,190 L100,190" stroke="#43A047" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ah-green)"/>
  <rect x="158" y="180" width="44" height="20" rx="3" fill="#E8F5E9" stroke="#43A047" stroke-width="0.5"/>
  <text x="180" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">未命中</text>

  <!-- ② 浏览器 → 本地域名服务器：递归查询 -->
  <path d="M100,230 L420,230" stroke="#1E88E5" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="225" y="220" width="72" height="20" rx="3" fill="#E3F2FD" stroke="#1E88E5" stroke-width="0.5"/>
  <circle cx="238" cy="230" r="8" fill="#1E88E5"/>
  <text x="238" y="230" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="251" y="230" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">递归查询</text>

  <!-- ③ 本地域名服务器 → 根域名服务器：迭代查询 -->
  <path d="M420,270 L580,270" stroke="#F57C00" stroke-width="2" marker-end="url(#ah-orange)"/>
  <rect x="465" y="260" width="71" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <circle cx="478" cy="270" r="8" fill="#F57C00"/>
  <text x="478" y="270" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="491" y="270" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">迭代查询</text>

  <!-- 根域名服务器 → 本地域名服务器：返回顶级域名服务器地址 -->
  <path d="M580,310 L420,310" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ah-purple)"/>
  <rect x="437" y="300" width="126" height="20" rx="3" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="0.5"/>
  <text x="500" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#4A148C">返回顶级域名服务器地址</text>

  <!-- ④ 本地域名服务器 → 顶级域名服务器：迭代查询 -->
  <path d="M420,350 L740,350" stroke="#F57C00" stroke-width="2" marker-end="url(#ah-orange)"/>
  <rect x="545" y="340" width="71" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <circle cx="558" cy="350" r="8" fill="#F57C00"/>
  <text x="558" y="350" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="571" y="350" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">迭代查询</text>

  <!-- 顶级域名服务器 → 本地域名服务器：返回权威域名服务器地址 -->
  <path d="M740,390 L420,390" stroke="#3949AB" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ah-indigo)"/>
  <rect x="517" y="380" width="126" height="20" rx="3" fill="#E8EAF6" stroke="#3949AB" stroke-width="0.5"/>
  <text x="580" y="390" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#283593">返回权威域名服务器地址</text>

  <!-- ⑤ 本地域名服务器 → 权威域名服务器：迭代查询 -->
  <path d="M420,430 L900,430" stroke="#F57C00" stroke-width="2" marker-end="url(#ah-orange)"/>
  <rect x="625" y="420" width="71" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <circle cx="638" cy="430" r="8" fill="#F57C00"/>
  <text x="638" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="651" y="430" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">迭代查询</text>

  <!-- 权威域名服务器 → 本地域名服务器：返回 IP 地址 -->
  <path d="M900,470 L420,470" stroke="#00897B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ah-teal)"/>
  <rect x="577" y="460" width="166" height="20" rx="3" fill="#E0F2F1" stroke="#00897B" stroke-width="0.5"/>
  <text x="660" y="470" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#004D40">返回 www.example.com 的 IP 地址</text>

  <!-- ⑥ 本地域名服务器 → 浏览器：返回解析结果 -->
  <path d="M420,510 L100,510" stroke="#F57C00" stroke-width="2" marker-end="url(#ah-orange)"/>
  <rect x="215" y="500" width="95" height="20" rx="3" fill="#FFF3E0" stroke="#F57C00" stroke-width="0.5"/>
  <circle cx="228" cy="510" r="8" fill="#F57C00"/>
  <text x="228" y="510" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="241" y="510" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">返回解析结果</text>

  <!-- 缓存注记 -->
  <rect x="40" y="535" width="120" height="26" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="100" y="548" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">浏览器缓存结果</text>

  <rect x="345" y="535" width="150" height="26" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="420" y="548" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#E65100">本地域名服务器缓存结果</text>

  <!-- 查询类型说明 -->
  <rect x="50" y="580" width="900" height="58" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="500" y="593" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#5D4037">查询类型说明</text>
  <text x="500" y="610" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">浏览器 → 本地域名服务器：递归查询（由本地域名服务器代为完成全部解析）</text>
  <text x="500" y="627" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">本地域名服务器 → 根域名服务器 / 顶级域名服务器 / 权威域名服务器：迭代查询（被查询方仅返回下一级地址，本地域名服务器自行再次查询）</text>

  <!-- Footer -->
  <text x="500" y="648" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">依据 RFC 1034/1035：DNS 查询默认使用 UDP 53 端口，响应超长或区域传送时改用 TCP（详见 3.4 节）</text>
</svg>
