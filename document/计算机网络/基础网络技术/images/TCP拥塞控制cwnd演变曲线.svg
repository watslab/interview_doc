<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="940" height="580" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M10,22 Q10,10 22,10 H938 Q950,10 950,22 V50 H10 Z" fill="#37474F"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF">TCP 拥塞控制 cwnd 演变曲线（RFC 5681）</text>

  <!-- Plot area -->
  <rect x="100" y="80" width="780" height="380" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Y-axis grid lines (5/10/15/20 MSS) -->
  <line x1="100" y1="375" x2="880" y2="375" stroke="#ECEFF1" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="290" x2="880" y2="290" stroke="#ECEFF1" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="205" x2="880" y2="205" stroke="#ECEFF1" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="120" x2="880" y2="120" stroke="#ECEFF1" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Axes -->
  <line x1="100" y1="460" x2="880" y2="460" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="100" y1="80" x2="100" y2="460" stroke="#546E7A" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="490" y="493" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F">传输轮次（每轮一个 RTT）</text>
  <text x="60" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#37474F" transform="rotate(-90 60 270)">拥塞窗口 cwnd（MSS）</text>

  <!-- Y-axis ticks -->
  <text x="92" y="460" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="92" y="375" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">5</text>
  <text x="92" y="290" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">10</text>
  <text x="92" y="205" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">15</text>
  <text x="92" y="120" text-anchor="end" dominant-baseline="central" font-size="10" fill="#757575">20</text>

  <!-- X-axis ticks (every 2 rounds) -->
  <text x="100" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">0</text>
  <text x="190" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">2</text>
  <text x="280" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">4</text>
  <text x="370" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">6</text>
  <text x="460" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">8</text>
  <text x="550" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">10</text>
  <text x="640" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">12</text>
  <text x="730" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">14</text>
  <text x="820" y="475" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">16</text>

  <!-- ssthresh lines -->
  <line x1="100" y1="188" x2="290" y2="188" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="110" y="172" text-anchor="start" dominant-baseline="central" font-size="10" font-weight="600" fill="#7B1FA2">初始 ssthresh = 16</text>

  <line x1="460" y1="290" x2="590" y2="290" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="6,3"/>

  <line x1="610" y1="324" x2="740" y2="324" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Phase 1: slow start, exponential (1,2,4,8,16) -->
  <polyline points="100,443 145,426 190,392 235,324 280,188" fill="none" stroke="#1E88E5" stroke-width="3"/>

  <!-- Phase 2: congestion avoidance, linear (16..20) -->
  <polyline points="280,188 325,171 370,154 415,137 460,120" fill="none" stroke="#43A047" stroke-width="3"/>

  <!-- Event A drop: 3 dup ACKs, cwnd 20 -> 13 -->
  <line x1="460" y1="120" x2="460" y2="239" stroke="#E53935" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Phase 3: congestion avoidance, linear (13..16) -->
  <polyline points="460,239 505,222 550,205 595,188" fill="none" stroke="#43A047" stroke-width="3"/>

  <!-- Event B drop: timeout, cwnd 16 -> 1 -->
  <line x1="595" y1="188" x2="595" y2="443" stroke="#E53935" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Phase 4: slow start again, exponential (1,2,4,8) -->
  <polyline points="595,443 640,426 685,392 730,324" fill="none" stroke="#1E88E5" stroke-width="3"/>

  <!-- Phase 5: congestion avoidance, linear (8..10) -->
  <polyline points="730,324 775,307 820,290" fill="none" stroke="#43A047" stroke-width="3"/>

  <!-- Data points -->
  <circle cx="100" cy="443" r="2.5" fill="#1E88E5"/>
  <circle cx="145" cy="426" r="2.5" fill="#1E88E5"/>
  <circle cx="190" cy="392" r="2.5" fill="#1E88E5"/>
  <circle cx="235" cy="324" r="2.5" fill="#1E88E5"/>
  <circle cx="280" cy="188" r="2.5" fill="#1E88E5"/>
  <circle cx="325" cy="171" r="2.5" fill="#43A047"/>
  <circle cx="370" cy="154" r="2.5" fill="#43A047"/>
  <circle cx="415" cy="137" r="2.5" fill="#43A047"/>
  <circle cx="460" cy="239" r="2.5" fill="#43A047"/>
  <circle cx="505" cy="222" r="2.5" fill="#43A047"/>
  <circle cx="550" cy="205" r="2.5" fill="#43A047"/>
  <circle cx="595" cy="188" r="2.5" fill="#43A047"/>
  <circle cx="640" cy="426" r="2.5" fill="#1E88E5"/>
  <circle cx="685" cy="392" r="2.5" fill="#1E88E5"/>
  <circle cx="730" cy="324" r="2.5" fill="#1E88E5"/>
  <circle cx="775" cy="307" r="2.5" fill="#43A047"/>
  <circle cx="820" cy="290" r="2.5" fill="#43A047"/>

  <!-- Event markers -->
  <circle cx="460" cy="120" r="5" fill="#E53935" stroke="#FFFFFF" stroke-width="2"/>
  <text x="460" y="98" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="bold" fill="#B71C1C">3 个重复 ACK</text>

  <circle cx="595" cy="188" r="5" fill="#E53935" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Event A annotations -->
  <text x="474" y="156" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="bold" fill="#B71C1C">快重传 + 快恢复</text>
  <text x="474" y="174" text-anchor="start" dominant-baseline="central" font-size="10" fill="#B71C1C">ssthresh = 10，cwnd = 13</text>

  <!-- Event B annotations -->
  <text x="615" y="210" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="bold" fill="#B71C1C">超时</text>
  <text x="615" y="228" text-anchor="start" dominant-baseline="central" font-size="10" fill="#B71C1C">ssthresh = 8，cwnd = 1</text>
  <text x="615" y="246" text-anchor="start" dominant-baseline="central" font-size="10" fill="#757575">重回慢开始</text>

  <!-- Phase labels -->
  <rect x="115" y="237" width="112" height="22" rx="4" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1"/>
  <text x="171" y="248" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1565C0">慢开始（指数增长）</text>

  <rect x="305" y="222" width="122" height="22" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="366" y="233" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1B5E20">拥塞避免（线性增长）</text>

  <!-- Legend row -->
  <line x1="122" y1="518" x2="150" y2="518" stroke="#1E88E5" stroke-width="3"/>
  <text x="156" y="518" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">慢开始（指数增长）</text>

  <line x1="309" y1="518" x2="337" y2="518" stroke="#43A047" stroke-width="3"/>
  <text x="343" y="518" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">拥塞避免（线性增长）</text>

  <line x1="496" y1="518" x2="524" y2="518" stroke="#E53935" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="530" y="518" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">拥塞事件（cwnd 骤降）</text>

  <line x1="673" y1="518" x2="701" y2="518" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="707" y="518" text-anchor="start" dominant-baseline="central" font-size="10" fill="#333">ssthresh 门限（随事件更新）</text>

  <!-- Footer note -->
  <rect x="100" y="540" width="780" height="32" rx="4" fill="#FFF8E1" stroke="#FFA000" stroke-width="1"/>
  <text x="490" y="556" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5D4037">示例场景：初始 ssthresh = 16 MSS；第 8 轮收到 3 个重复 ACK，进入快恢复（ssthresh = 10，cwnd = 13）；第 11 轮超时，重回慢开始（ssthresh = 8，cwnd = 1）</text>
</svg>
