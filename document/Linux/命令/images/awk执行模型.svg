<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E88E5"/></marker>
    <marker id="ahb2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E88E5"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="840" height="620" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="270" y="42" text-anchor="middle" fill="#1565C0" font-size="16" font-weight="bold" dominant-baseline="central">awk 程序执行模型</text>

  <!-- ============ BEGIN block ============ -->
  <g filter="url(#s1)">
    <rect x="80" y="70" width="380" height="64" rx="8" fill="#1E88E5" stroke="#1565C0" stroke-width="1"/>
  </g>
  <text x="270" y="92" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" dominant-baseline="central">BEGIN 块</text>
  <text x="270" y="114" text-anchor="middle" fill="#BBDEFB" font-size="11" dominant-baseline="central">执行前初始化（可选）</text>

  <!-- ============ 主循环 container ============ -->
  <rect x="40" y="165" width="460" height="330" rx="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="270" y="188" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="600" dominant-baseline="central">主循环（逐行处理直至 EOF）</text>

  <!-- Step 1 -->
  <g filter="url(#s1)">
    <rect x="80" y="205" width="380" height="44" rx="6" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
    <text x="270" y="220" text-anchor="middle" fill="#333" font-size="13" font-weight="600" dominant-baseline="central">读取一行（record）</text>
    <text x="270" y="237" text-anchor="middle" fill="#999" font-size="10" dominant-baseline="central">NR 自增，$0 赋值为整行</text>
  </g>
  <!-- Step 2 -->
  <g filter="url(#s1)">
    <rect x="80" y="282" width="380" height="44" rx="6" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
    <text x="270" y="297" text-anchor="middle" fill="#333" font-size="13" font-weight="600" dominant-baseline="central">按 FS 分割字段</text>
    <text x="270" y="314" text-anchor="middle" fill="#999" font-size="10" dominant-baseline="central">$1, $2, …, $NF</text>
  </g>
  <!-- Step 3 -->
  <g filter="url(#s1)">
    <rect x="80" y="359" width="380" height="44" rx="6" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
    <text x="270" y="374" text-anchor="middle" fill="#333" font-size="13" font-weight="600" dominant-baseline="central">匹配 pattern</text>
    <text x="270" y="391" text-anchor="middle" fill="#999" font-size="10" dominant-baseline="central">符合则进入 action</text>
  </g>
  <!-- Step 4 -->
  <g filter="url(#s1)">
    <rect x="80" y="436" width="380" height="44" rx="6" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
    <text x="270" y="451" text-anchor="middle" fill="#333" font-size="13" font-weight="600" dominant-baseline="central">执行 {action}</text>
    <text x="270" y="468" text-anchor="middle" fill="#999" font-size="10" dominant-baseline="central">输出 / 累加 / 跳转</text>
  </g>

  <!-- ============ END block ============ -->
  <g filter="url(#s1)">
    <rect x="80" y="530" width="380" height="64" rx="8" fill="#1E88E5" stroke="#1565C0" stroke-width="1"/>
  </g>
  <text x="270" y="552" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" dominant-baseline="central">END 块</text>
  <text x="270" y="574" text-anchor="middle" fill="#BBDEFB" font-size="11" dominant-baseline="central">执行后收尾（可选）</text>

  <!-- ============ Side panel: built-in variables ============ -->
  <rect x="540" y="165" width="290" height="330" rx="10" fill="#F5F7FA" stroke="#B0BEC5" stroke-width="1.2"/>
  <text x="685" y="190" text-anchor="middle" fill="#1565C0" font-size="13" font-weight="600" dominant-baseline="central">awk 内置变量</text>
  <line x1="560" y1="205" x2="810" y2="205" stroke="#CFD8DC" stroke-width="1"/>

  <text x="560" y="227" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">NR</text>
  <text x="625" y="227" font-size="11" fill="#555" dominant-baseline="central">当前记录号（行号）</text>

  <text x="560" y="255" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">NF</text>
  <text x="625" y="255" font-size="11" fill="#555" dominant-baseline="central">当前记录字段数</text>

  <text x="560" y="283" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">$0</text>
  <text x="625" y="283" font-size="11" fill="#555" dominant-baseline="central">整行内容</text>

  <text x="560" y="311" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">$1</text>
  <text x="625" y="311" font-size="11" fill="#555" dominant-baseline="central">第 1 个字段</text>

  <text x="560" y="339" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">FS</text>
  <text x="625" y="339" font-size="11" fill="#555" dominant-baseline="central">输入字段分隔符</text>

  <text x="560" y="367" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">OFS</text>
  <text x="625" y="367" font-size="11" fill="#555" dominant-baseline="central">输出字段分隔符</text>

  <text x="560" y="395" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">RS</text>
  <text x="625" y="395" font-size="11" fill="#555" dominant-baseline="central">输入记录分隔符</text>

  <text x="560" y="423" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="bold" fill="#1565C0" dominant-baseline="central">ORS</text>
  <text x="625" y="423" font-size="11" fill="#555" dominant-baseline="central">输出记录分隔符</text>

  <text x="685" y="463" text-anchor="middle" fill="#90A4AE" font-size="10" dominant-baseline="central">另有 FNR / FILENAME / SUBSEP 等</text>

  <!-- ============ Connection lines (drawn last) ============ -->
  <!-- BEGIN -> 主循环 -->
  <line x1="270" y1="134" x2="270" y2="165" stroke="#1E88E5" stroke-width="1.8" marker-end="url(#ahb)"/>
  <!-- Step1 -> Step2 -->
  <line x1="270" y1="249" x2="270" y2="282" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Step2 -> Step3 -->
  <line x1="270" y1="326" x2="270" y2="359" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Step3 -> Step4 -->
  <line x1="270" y1="403" x2="270" y2="436" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- 主循环 -> END -->
  <line x1="270" y1="495" x2="270" y2="530" stroke="#1E88E5" stroke-width="1.8" marker-end="url(#ahb)"/>

  <!-- Loop arrow: Step4 right -> Step1 right (two-segment curve for horizontal entry) -->
  <path d="M460,458 C510,458 530,400 530,342 C530,284 510,227 474,227" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ahb2)"/>
  <text transform="translate(496,342) rotate(-90)" text-anchor="middle" font-size="10" fill="#1565C0">循环至 EOF</text>
</svg>
