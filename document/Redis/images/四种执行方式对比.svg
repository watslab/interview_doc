<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
  </defs>

  <rect x="10" y="10" width="900" height="380" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 第一列：普通命令 -->
  <rect x="30" y="40" width="200" height="310" rx="10" fill="#FDF0F0" stroke="#E57373" stroke-width="1.5"/>
  <path d="M40,40 H220 Q230,40 230,50 V76 H30 V50 Q30,40 40,40Z" fill="#E53935"/>
  <text x="130" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">普通命令</text>
  <rect x="50" y="105" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="130" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">逐条发送</text>
  <rect x="50" y="186" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="130" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">逐条等待响应</text>
  <rect x="50" y="267" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#E57373" stroke-width="1.5" filter="url(#s1)"/>
  <text x="130" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">RTT 累积</text>

  <!-- 第二列：Pipeline -->
  <rect x="250" y="40" width="200" height="310" rx="10" fill="#F2FAF2" stroke="#81C784" stroke-width="1.5"/>
  <path d="M260,40 H440 Q450,40 450,50 V76 H250 V50 Q250,40 260,40Z" fill="#43A047"/>
  <text x="350" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Pipeline</text>
  <rect x="270" y="105" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="350" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">批量发送</text>
  <rect x="270" y="186" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="350" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">批量接收响应</text>
  <rect x="270" y="267" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#81C784" stroke-width="1.5" filter="url(#s1)"/>
  <text x="350" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">减少 RTT</text>

  <!-- 第三列：事务 MULTI/EXEC -->
  <rect x="470" y="40" width="200" height="310" rx="10" fill="#F0F7FF" stroke="#90CAF9" stroke-width="1.5"/>
  <path d="M480,40 H660 Q670,40 670,50 V76 H470 V50 Q470,40 480,40Z" fill="#1E88E5"/>
  <text x="570" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">事务 MULTI/EXEC</text>
  <rect x="490" y="105" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="570" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">批量发送</text>
  <rect x="490" y="186" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="570" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">原子执行</text>
  <rect x="490" y="267" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.5" filter="url(#s1)"/>
  <text x="570" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">保证一致性</text>

  <!-- 第四列：Lua 脚本 -->
  <rect x="690" y="40" width="200" height="310" rx="10" fill="#FFF9F3" stroke="#FFB74D" stroke-width="1.5"/>
  <path d="M700,40 H880 Q890,40 890,50 V76 H690 V50 Q690,40 700,40Z" fill="#F57C00"/>
  <text x="790" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Lua 脚本</text>
  <rect x="710" y="105" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">单次发送</text>
  <rect x="710" y="186" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">原子执行</text>
  <rect x="710" y="267" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.5" filter="url(#s1)"/>
  <text x="790" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">复杂逻辑</text>
</svg>
