<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="540" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Docker 容器 -->
  <rect x="330" y="46" width="300" height="88" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6A1B9A">Docker 容器</text>
  <text x="480" y="104" text-anchor="middle" font-size="10" fill="#8E24AA">运行中的应用进程</text>

  <!-- 容器 → 三大技术 -->
  <line x1="400" y1="134" x2="180" y2="216" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="134" x2="480" y2="216" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="560" y1="134" x2="780" y2="216" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Namespace -->
  <rect x="40" y="220" width="280" height="270" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" filter="url(#s1)"/>
  <text x="180" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Namespace（命名空间）</text>
  <text x="180" y="266" text-anchor="middle" font-size="10" fill="#546E7A">隔离：独立的系统资源视图</text>
  <rect x="60" y="284" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="301" text-anchor="middle" font-size="11" fill="#333333">PID · 进程隔离</text>
  <rect x="60" y="318" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="335" text-anchor="middle" font-size="11" fill="#333333">NET · 网络隔离</text>
  <rect x="60" y="352" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="369" text-anchor="middle" font-size="11" fill="#333333">MNT · 文件系统隔离</text>
  <rect x="60" y="386" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="403" text-anchor="middle" font-size="11" fill="#333333">UTS · 主机名隔离</text>
  <rect x="60" y="420" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="437" text-anchor="middle" font-size="11" fill="#333333">IPC · 进程通信隔离</text>
  <rect x="60" y="454" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="180" y="471" text-anchor="middle" font-size="11" fill="#333333">USER · 用户隔离</text>

  <!-- Cgroups -->
  <rect x="340" y="220" width="280" height="270" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Cgroups（控制组）</text>
  <text x="480" y="266" text-anchor="middle" font-size="10" fill="#546E7A">限制：约束物理资源用量</text>
  <rect x="360" y="284" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="480" y="301" text-anchor="middle" font-size="11" fill="#333333">CPU 限制</text>
  <rect x="360" y="340" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="480" y="357" text-anchor="middle" font-size="11" fill="#333333">内存限制</text>
  <rect x="360" y="396" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="480" y="413" text-anchor="middle" font-size="11" fill="#333333">磁盘 I/O 限制</text>
  <rect x="360" y="452" width="240" height="26" rx="5" fill="#FFFFFF" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="480" y="469" text-anchor="middle" font-size="11" fill="#333333">网络带宽限制</text>

  <!-- UnionFS -->
  <rect x="640" y="220" width="280" height="270" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="780" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#EF6C00">UnionFS（联合文件系统）</text>
  <text x="780" y="266" text-anchor="middle" font-size="10" fill="#546E7A">分层：联合挂载为统一视图</text>
  <rect x="660" y="316" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.5" filter="url(#s1)"/>
  <text x="780" y="341" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">Overlay2</text>
  <text x="780" y="359" text-anchor="middle" font-size="10" fill="#888888">当前默认存储驱动</text>
  <rect x="660" y="402" width="240" height="56" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="780" y="427" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333333">AUFS</text>
  <text x="780" y="445" text-anchor="middle" font-size="10" fill="#888888">早期存储驱动</text>

  <!-- 底部说明 -->
  <text x="480" y="530" text-anchor="middle" font-size="10.5" fill="#757575">三项技术均由 Linux 内核提供：Namespace 隔离资源视图，Cgroups 限制资源用量，UnionFS 叠加分层文件系统，共同支撑容器运行</text>
</svg>
