<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#FFFFFF"/>
  <text x="480" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="bold" fill="#263238">Kubernetes 在 DevOps 体系中的定位与学习路径</text>

  <!-- 上：DevOps 持续交付链路 -->
  <rect x="30" y="58" width="900" height="140" rx="8" fill="#E3F2FD" filter="url(#s1)"/>
  <path d="M38,58 H922 Q930,58 930,66 V84 H30 V66 Q30,58 38,58 Z" fill="#1E88E5"/>
  <rect x="30" y="58" width="900" height="140" rx="8" fill="none" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="480" y="71" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#FFFFFF">DevOps 持续交付链路与 Kubernetes 落点</text>

  <!-- 6 步骤框 w=126 gap=24 x:42,192,342,492,642,792 -->
  <rect x="42" y="104" width="126" height="68" rx="6" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="105" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">代码提交</text>
  <text x="105" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">Git 仓库</text>

  <rect x="192" y="104" width="126" height="68" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="255" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">CI 构建/测试</text>
  <text x="255" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">编译·单元测试·扫描</text>

  <rect x="342" y="104" width="126" height="68" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="405" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">镜像仓库</text>
  <text x="405" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">不可变制品</text>

  <rect x="492" y="104" width="126" height="68" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="555" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">CD 部署</text>
  <text x="555" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">清单·GitOps</text>

  <rect x="642" y="104" width="126" height="68" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="2.5"/>
  <text x="705" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#1B5E20">Kubernetes 集群</text>
  <text x="705" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2E7D32">编排·调度·自愈</text>

  <rect x="792" y="104" width="126" height="68" rx="6" fill="#FFFFFF" stroke="#F57C00" stroke-width="1.5"/>
  <text x="855" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#333333">监控运维</text>
  <text x="855" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#757575">指标·日志·告警</text>

  <!-- 上行箭头 y=138 -->
  <line x1="170" y1="138" x2="190" y2="138" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="320" y1="138" x2="340" y2="138" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="470" y1="138" x2="490" y2="138" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="620" y1="138" x2="640" y2="138" stroke="#43A047" stroke-width="1.5" marker-end="url(#ahg)"/>
  <line x1="770" y1="138" x2="790" y2="138" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

