<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/>
    </filter>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E88E5"/></marker>
    <marker id="ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#43A047"/></marker>
    <marker id="ah-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#607D8B"/></marker>
    <marker id="ah-gray0" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#607D8B"/></marker>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="960" height="560" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 标题 -->
  <text x="490" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">主从复制数据同步链路</text>

  <!-- 客户端（外部实体） -->
  <rect x="30" y="230" width="110" height="80" rx="8" fill="#ECEFF1" stroke="#78909C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="85" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F">客户端</text>
  <text x="85" y="285" text-anchor="middle" font-size="9.5" fill="#78909C">读写分离路由</text>

  <!-- 主库容器 -->
  <rect x="200" y="90" width="330" height="380" rx="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M210,90 H520 Q530,90 530,100 V122 H200 V100 Q200,90 210,90 Z" fill="#1E88E5"/>
  <text x="365" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">主库（Source）</text>

  <!-- 从库容器 -->
  <rect x="620" y="90" width="330" height="380" rx="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M630,90 H940 Q950,90 950,100 V122 H620 V100 Q620,90 630,90 Z" fill="#43A047"/>
  <text x="785" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">从库（Replica）</text>

  <!-- 主库组件 -->
  <!-- 主库数据圆柱 -->
  <path d="M250,173 A115,10 0 0 1 480,173 L480,203 A115,10 0 0 1 250,203 Z" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.3"/>
  <ellipse cx="365" cy="173" rx="115" ry="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.3"/>
  <text x="365" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#333">主库数据</text>

  <!-- Binlog 圆柱 -->
  <path d="M250,273 A115,10 0 0 1 480,273 L480,303 A115,10 0 0 1 250,303 Z" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.3"/>
  <ellipse cx="365" cy="273" rx="115" ry="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.3"/>
  <text x="365" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Binlog</text>

  <!-- Dump Thread 框 -->
  <rect x="250" y="373" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="365" y="391" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Dump Thread</text>
  <text x="365" y="408" text-anchor="middle" font-size="9.5" fill="#757575">读取 Binlog 并发送</text>

  <!-- 从库组件 -->
  <!-- IO Thread 框 -->
  <rect x="670" y="155" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2"/>
  <text x="785" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#333">IO Thread</text>
  <text x="785" y="191" text-anchor="middle" font-size="9.5" fill="#757575">接收 Binlog 事件</text>

  <!-- Relay Log 圆柱 -->
  <path d="M670,241 A115,10 0 0 1 900,241 L900,271 A115,10 0 0 1 670,271 Z" fill="#FFFFFF" stroke="#43A047" stroke-width="1.3"/>
  <ellipse cx="785" cy="241" rx="115" ry="10" fill="#FFFFFF" stroke="#43A047" stroke-width="1.3"/>
  <text x="785" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Relay Log</text>

  <!-- SQL Thread 框 -->
  <rect x="670" y="311" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2"/>
  <text x="785" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#333">SQL Thread</text>
  <text x="785" y="347" text-anchor="middle" font-size="9.5" fill="#757575">重放 Relay Log 事件</text>

  <!-- 从库数据圆柱 -->
  <path d="M670,397 A115,10 0 0 1 900,397 L900,427 A115,10 0 0 1 670,427 Z" fill="#FFFFFF" stroke="#43A047" stroke-width="1.3"/>
  <ellipse cx="785" cy="397" rx="115" ry="10" fill="#FFFFFF" stroke="#43A047" stroke-width="1.3"/>
  <text x="785" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#333">从库数据</text>

  <!-- 主库内部箭头 -->
  <line x1="365" y1="213" x2="365" y2="262" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <text x="378" y="241" font-size="10" fill="#546E7A">记录变更</text>
  <line x1="365" y1="313" x2="365" y2="372" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <text x="378" y="346" font-size="10" fill="#546E7A">读取</text>

  <!-- 从库内部箭头 -->
  <line x1="785" y1="201" x2="785" y2="230" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="798" y="219" font-size="10" fill="#546E7A">写入</text>
  <line x1="785" y1="281" x2="785" y2="310" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="798" y="299" font-size="10" fill="#546E7A">读取</text>
  <line x1="785" y1="357" x2="785" y2="386" stroke="#43A047" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="798" y="375" font-size="10" fill="#546E7A">重放</text>

  <!-- 跨容器箭头：Dump Thread → IO Thread -->
  <path d="M480,396 C575,396 575,178 670,178" fill="none" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <text x="570" y="220" text-anchor="middle" font-size="10" fill="#546E7A">Binlog 事件</text>

  <!-- 写请求箭头 -->
  <line x1="140" y1="270" x2="197" y2="270" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="168" y="260" text-anchor="middle" font-size="10" fill="#607D8B">写请求</text>

  <!-- 读请求折线（虚线） -->
  <path d="M85,310 V530 H785 V481" fill="none" stroke="#607D8B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-gray0)"/>
  <text x="435" y="522" text-anchor="middle" font-size="10" fill="#607D8B">读请求</text>
</svg>
