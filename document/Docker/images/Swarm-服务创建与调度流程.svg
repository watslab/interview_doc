<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 1030" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="996" height="1010" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- 阶段容器（6 个阶段，自上而下） -->
  <rect x="42" y="30" width="932" height="126" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.2" filter="url(#s1)"/>
  <rect x="42" y="192" width="932" height="126" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <rect x="42" y="354" width="932" height="126" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2" filter="url(#s1)"/>
  <rect x="42" y="516" width="932" height="126" rx="10" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.2" filter="url(#s1)"/>
  <rect x="42" y="678" width="932" height="126" rx="10" fill="#FCE4EC" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <rect x="42" y="840" width="932" height="126" rx="10" fill="#F5F5F5" stroke="#757575" stroke-width="1.2" filter="url(#s1)"/>

  <!-- 阶段标题 -->
  <text x="62" y="52" font-size="13" font-weight="600" fill="#6A1B9A">1. 请求阶段</text>
  <text x="62" y="214" font-size="13" font-weight="600" fill="#0D47A1">2. 编排阶段</text>
  <text x="62" y="376" font-size="13" font-weight="600" fill="#1B5E20">3. 调度阶段</text>
  <text x="62" y="538" font-size="13" font-weight="600" fill="#E65100">4. 分发阶段</text>
  <text x="62" y="700" font-size="13" font-weight="600" fill="#AD1457">5. 执行阶段</text>
  <text x="62" y="862" font-size="13" font-weight="600" fill="#424242">6. 调谐阶段</text>

  <!-- 阶段 1：请求 -->
  <rect x="213" y="64" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#8E24AA" stroke-width="1.2" filter="url(#s1)"/>
  <g font-family="Consolas,'Courier New',monospace" font-size="11" fill="#6A1B9A" text-anchor="middle">
    <text x="373" y="92.8">docker service create</text>
    <text x="373" y="105.6">--name web --replicas 3 nginx</text>
  </g>
  <rect x="563" y="64" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#8E24AA" stroke-width="1.2" filter="url(#s1)"/>
  <text x="683" y="99.3" text-anchor="middle" font-size="12" font-weight="600" fill="#6A1B9A">Manager API 接收请求</text>

  <!-- 阶段 2：编排 -->
  <rect x="55" y="226" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="155" y="254.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Orchestrator</text>
  <text x="155" y="268.9" text-anchor="middle" font-size="10.5" fill="#546E7A">创建服务对象</text>
  <rect x="290" y="226" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="390" y="254.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">生成期望状态</text>
  <text x="390" y="268.9" text-anchor="middle" font-size="10.5" fill="#546E7A">3 个 Task</text>
  <rect x="525" y="226" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="625" y="261.3" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">写入 Raft 日志</text>
  <rect x="760" y="226" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.2" filter="url(#s1)"/>
  <text x="860" y="261.3" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Raft 多数确认</text>

  <!-- 阶段 3：调度 -->
  <rect x="55" y="388" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2" filter="url(#s1)"/>
  <text x="155" y="416.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Scheduler</text>
  <text x="155" y="430.9" text-anchor="middle" font-size="10.5" fill="#546E7A">获取待调度 Task</text>
  <rect x="290" y="388" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2" filter="url(#s1)"/>
  <text x="390" y="423.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">评估所有可用节点</text>
  <rect x="525" y="388" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2" filter="url(#s1)"/>
  <text x="625" y="423.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">应用调度策略和约束</text>
  <rect x="760" y="388" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.2" filter="url(#s1)"/>
  <text x="860" y="423.3" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">选择最优节点</text>

  <!-- 阶段 4：分发 -->
  <rect x="213" y="550" width="280" height="62" rx="8" fill="#FFFFFF" stroke="#FB8C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="353" y="578.2" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">Dispatcher 发送 Task</text>
  <text x="353" y="592.9" text-anchor="middle" font-size="10.5" fill="#546E7A">到 Worker</text>
  <rect x="523" y="550" width="280" height="62" rx="8" fill="#FFFFFF" stroke="#FB8C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="663" y="585.3" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">Worker 接收 Task</text>

  <!-- 阶段 5：执行 -->
  <rect x="55" y="712" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <text x="155" y="747.3" text-anchor="middle" font-size="12" font-weight="600" fill="#AD1457">拉取镜像</text>
  <rect x="290" y="712" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <text x="390" y="747.3" text-anchor="middle" font-size="12" font-weight="600" fill="#AD1457">创建容器</text>
  <rect x="525" y="712" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <text x="625" y="747.3" text-anchor="middle" font-size="12" font-weight="600" fill="#AD1457">启动容器</text>
  <rect x="760" y="712" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.2" filter="url(#s1)"/>
  <text x="860" y="747.3" text-anchor="middle" font-size="12" font-weight="600" fill="#AD1457">上报状态到 Manager</text>

  <!-- 阶段 6：调谐 -->
  <rect x="178" y="874" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#757575" stroke-width="1.2" filter="url(#s1)"/>
  <text x="278" y="909.3" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">Manager 更新集群状态</text>
  <path d="M508,865 L603,905 L508,945 L413,905 Z" fill="#FFFFFF" stroke="#757575" stroke-width="1.5" filter="url(#s1)"/>
  <text x="508" y="901.4" text-anchor="middle" font-size="11" font-weight="600" fill="#424242">实际状态 ==</text>
  <text x="508" y="916.5" text-anchor="middle" font-size="11" font-weight="600" fill="#424242">期望状态?</text>
  <rect x="638" y="874" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#757575" stroke-width="1.2" filter="url(#s1)"/>
  <text x="738" y="909.3" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">服务就绪</text>

  <!-- 连接箭头（最后绘制，保证置于顶层） -->
  <!-- 阶段内横向箭头 -->
  <line x1="534" y1="95" x2="562" y2="95" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="256" y1="257" x2="289" y2="257" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="491" y1="257" x2="524" y2="257" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="726" y1="257" x2="759" y2="257" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="256" y1="419" x2="289" y2="419" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="491" y1="419" x2="524" y2="419" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="726" y1="419" x2="759" y2="419" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="494" y1="581" x2="522" y2="581" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="256" y1="743" x2="289" y2="743" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="491" y1="743" x2="524" y2="743" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="726" y1="743" x2="759" y2="743" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="379" y1="905" x2="412.6" y2="905" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="604" y1="905" x2="637" y2="905" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 阶段间纵向箭头 -->
  <line x1="508" y1="157" x2="508" y2="191" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="508" y1="319" x2="508" y2="353" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="508" y1="481" x2="508" y2="515" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="508" y1="643" x2="508" y2="677" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="508" y1="805" x2="508" y2="839" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 调谐回环：不一致时重新调度（竖线居中于左边距带 10..42） -->
  <path d="M508,945 L508,968 Q508,978 498,978 L36,978 Q26,978 26,968 L26,429 Q26,419 36,419 L54.8,419" fill="none" stroke="#90A4AE" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 分支标签 -->
  <text x="620.5" y="897" text-anchor="middle" font-size="11" fill="#757575">是</text>
  <text x="517" y="960.5" text-anchor="start" font-size="11" fill="#757575">否</text>

  <!-- 底部说明 -->
  <text x="508" y="1003" text-anchor="middle" font-size="10.5" fill="#757575">服务创建依次经过请求、编排、调度、分发、执行、调谐六个阶段；调谐阶段在实际状态与期望状态不一致时重新触发调度，一致则服务就绪</text>
</svg>
