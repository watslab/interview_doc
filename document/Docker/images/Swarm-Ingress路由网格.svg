<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" flood-color="#000" flood-opacity="0.08" stdDeviation="3"/></filter>
    <!-- 实线箭头（refX=8，尖端落在端点） -->
    <marker id="ahP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#C2185B"/></marker>
    <marker id="ahB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1565C0"/></marker>
    <marker id="ahGn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2E7D32"/></marker>
    <marker id="ahO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EF6C00"/></marker>
    <!-- 虚线箭头（refX=0，避免虚线穿过箭头） -->
    <marker id="ah2G" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#90A4AE"/></marker>
    <marker id="ah2B" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1565C0"/></marker>
    <marker id="ah2Gn" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2E7D32"/></marker>
    <marker id="ah2O" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EF6C00"/></marker>
  </defs>

  <rect x="10" y="10" width="940" height="600" rx="12" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Swarm 集群容器 -->
  <rect x="50" y="168" width="860" height="384" rx="12" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="480" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#546E7A">Swarm 集群（Ingress 路由网格）</text>

  <!-- 节点 1 -->
  <rect x="70" y="210" width="260" height="320" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="200" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">节点 1</text>
  <rect x="100" y="254" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2" filter="url(#s1)"/>
  <text x="200" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Ingress 网格</text>
  <text x="200" y="293" text-anchor="middle" font-size="10" fill="#757575">监听 :8080</text>
  <rect x="115" y="456" width="170" height="44" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="200" y="474" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">web.1</text>
  <text x="200" y="490" text-anchor="middle" font-size="9.5" fill="#757575">容器</text>

  <!-- 节点 2 -->
  <rect x="350" y="210" width="260" height="320" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">节点 2</text>
  <rect x="380" y="254" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Ingress 网格</text>
  <text x="480" y="293" text-anchor="middle" font-size="10" fill="#757575">监听 :8080</text>
  <rect x="395" y="456" width="170" height="44" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="480" y="474" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">web.2</text>
  <text x="480" y="490" text-anchor="middle" font-size="9.5" fill="#757575">容器</text>

  <!-- 节点 3 -->
  <rect x="630" y="210" width="260" height="320" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="760" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">节点 3</text>
  <rect x="660" y="254" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="1.2" filter="url(#s1)"/>
  <text x="760" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333333">Ingress 网格</text>
  <text x="760" y="293" text-anchor="middle" font-size="10" fill="#757575">监听 :8080</text>
  <rect x="675" y="456" width="170" height="44" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.2" filter="url(#s1)"/>
  <text x="760" y="474" text-anchor="middle" font-size="11" font-weight="600" fill="#37474F">web.3</text>
  <text x="760" y="490" text-anchor="middle" font-size="9.5" fill="#757575">容器</text>

  <!-- 用户请求（外部） -->
  <rect x="390" y="56" width="180" height="56" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.5" filter="url(#s1)"/>
  <text x="480" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#AD1457">用户请求</text>
  <text x="480" y="98" text-anchor="middle" font-size="9.5" fill="#C2185B">端口 8080</text>

  <!-- 连线：用户 → Ingress（实线=主路径，虚线=或） -->
  <path d="M420,113 C420,180 200,180 200,241 L200,253" fill="none" stroke="#C2185B" stroke-width="1.5" marker-end="url(#ahP)"/>
  <line x1="480" y1="113" x2="480" y2="241" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2G)"/>
  <path d="M540,113 C540,180 760,180 760,229 L760,241" fill="none" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2G)"/>
  <text x="345" y="145" text-anchor="middle" font-size="10.5" fill="#C2185B">访问任意节点</text>
  <text x="492" y="145" text-anchor="start" font-size="10" fill="#757575">或</text>
  <text x="585" y="145" text-anchor="middle" font-size="10" fill="#757575">或</text>

  <!-- 连线：本地转发（实线，按发送方着色） -->
  <line x1="200" y1="307" x2="200" y2="455" stroke="#1565C0" stroke-width="1.5" marker-end="url(#ahB)"/>
  <line x1="480" y1="307" x2="480" y2="455" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#ahGn)"/>
  <line x1="760" y1="307" x2="760" y2="455" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#ahO)"/>

  <!-- 连线：跨节点转发（虚线，按发送方着色）— 节点 1 -->
  <path d="M200,307 C200,377 520,361 520,431 L520,443" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2B)"/>
  <path d="M200,307 C200,385 720,353 720,431 L720,443" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2B)"/>
  <!-- 节点 2 -->
  <path d="M480,307 C480,377 160,361 160,431 L160,443" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2Gn)"/>
  <path d="M480,307 C480,377 800,361 800,431 L800,443" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2Gn)"/>
  <!-- 节点 3 -->
  <path d="M760,307 C760,385 240,353 240,431 L240,443" fill="none" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2O)"/>
  <path d="M760,307 C760,377 440,361 440,431 L440,443" fill="none" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah2O)"/>

  <!-- 图例与说明 -->
  <text x="480" y="576" text-anchor="middle" font-size="10" fill="#757575">实线 = 本地直达转发　　虚线 = 跨节点转发　　（路由网格互连，颜色对应发起转发的节点）</text>
  <text x="480" y="595" text-anchor="middle" font-size="10" fill="#757575">任一节点的 Ingress 收到请求后，均可转发至任意节点上的服务副本，外部流量无需感知副本位置</text>
</svg>
