  <rect x="44" y="278" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="62" cy="296" r="9" fill="#43A047"/>
  <text x="62" y="296" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="96" y="313" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#333333">容器与编排基础</text>

